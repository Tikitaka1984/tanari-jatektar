<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>A Hanza kereskedői – Hálózat és hatalom</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=EB+Garamond:ital,wght@0,400;0,600;1,400&family=Source+Sans+3:wght@400;600;700&display=swap">
<style>
/* Elrendezés: asztalon a tábla bal oldalt, a soron lévő játékos és a pontok jobb oldalt; telefonon a soron lévő játékos panelje a tábla fölé kerül. */
:root {
  --bg: #ECE2CB; --surface: #FBF6EA; --surface2: #F3EAD6; --ink: #2B2420; --muted: #6D5D48;
  --line: #D6C29A; --accent: #B04F2A; --accent-ink: #FFFFFF; --sea: #2C6894; --gold: #A87B22;
  --ok: #4F6B2C; --warn: #A3461F; --shadow: 0 10px 30px rgba(60,40,20,.18);
  --f-display: 'Cinzel', 'Trajan Pro', Georgia, serif;
  --f-text: 'Source Sans 3', 'Segoe UI', system-ui, sans-serif;
  --f-quote: 'EB Garamond', Garamond, Georgia, serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #17202B; --surface: #212C3A; --surface2: #2A3748; --ink: #F1E8D6; --muted: #B9AA92;
  --line: #3E4E62; --accent: #E2805A; --accent-ink: #1B1410; --sea: #86B7DC; --gold: #D9B25E;
  --ok: #9DBB6A; --warn: #F0956E; --shadow: 0 10px 30px rgba(0,0,0,.45); color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #17202B; --surface: #212C3A; --surface2: #2A3748; --ink: #F1E8D6; --muted: #B9AA92;
  --line: #3E4E62; --accent: #E2805A; --accent-ink: #1B1410; --sea: #86B7DC; --gold: #D9B25E;
  --ok: #9DBB6A; --warn: #F0956E; --shadow: 0 10px 30px rgba(0,0,0,.45); color-scheme: dark; }

* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-text); font-size: 15px; line-height: 1.4;
  padding-block: 0 28px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
button { font: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible, select:focus-visible, summary:focus-visible { outline: 3px solid var(--sea); outline-offset: 2px; }
.top { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding-block: 14px 12px; max-width: 1400px; margin: 0 auto; }
.brand { display: flex; flex-direction: column; margin-right: auto; min-width: 0; }
.brand h1 { font-family: var(--f-display); font-weight: 700; font-size: 1.5rem; margin: 0; letter-spacing: .02em; text-wrap: balance; }
.brand span { font-family: var(--f-quote); font-style: italic; color: var(--accent); font-size: 1.02rem; }
.clock { font-variant-numeric: tabular-nums; font-weight: 700; padding: 6px 12px; border-radius: 999px; background: var(--surface); border: 1px solid var(--line); }
.btn { border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 10px; padding: 8px 14px; font-weight: 600; }
.btn:hover { background: var(--surface2); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.primary:hover { filter: brightness(1.06); }
.btn.big { font-size: 1.15rem; padding: 12px 22px; border-radius: 12px; }
.btn:disabled { opacity: .45; cursor: not-allowed; }

.layout { display: grid; grid-template-columns: minmax(0, 1fr) 380px; grid-template-areas: "board turn" "board side"; grid-template-rows: auto 1fr;
  gap: 18px; max-width: 1400px; margin: 0 auto; align-items: start; }
#turn { grid-area: turn; min-width: 0; }
.board { grid-area: board; align-self: start; }
.side { grid-area: side; display: flex; flex-direction: column; gap: 14px; min-width: 0; }
@media (max-width: 980px) { .layout { grid-template-columns: minmax(0, 1fr); grid-template-areas: "turn" "board" "side"; grid-template-rows: auto; } }
.board { background: var(--surface); border-radius: 14px; box-shadow: var(--shadow); padding: 8px; min-width: 0; }
.board svg { width: 100%; height: auto; display: block; border-radius: 8px; }
.boardtools { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; padding: 8px 4px 2px; color: var(--muted); font-size: .88rem; }
.pawn { transition: transform .16s ease-out; }
.pawn.active circle.ring { animation: pulse 1.2s ease-in-out infinite; }
@keyframes pulse { 0%,100% { opacity: .9; } 50% { opacity: .2; } }

.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; min-width: 0; }
.panel h2 { font-family: var(--f-display); font-size: .82rem; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); margin: 0 0 10px; font-weight: 700; }
.turn-name { font-family: var(--f-display); font-weight: 700; font-size: 1.45rem; display: flex; align-items: center; gap: 10px; }
.chip { width: 16px; height: 16px; border-radius: 50%; display: inline-block; flex: none; border: 2px solid #fff; box-shadow: 0 0 0 1px rgba(0,0,0,.25); }
.roles { color: var(--muted); font-size: .93rem; margin: 6px 0 12px; }
.roles b { color: var(--ink); }
.rollrow { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
.dice { display: flex; gap: 8px; }
.die { width: 52px; height: 52px; border-radius: 11px; background: #FFFDF6; border: 2px solid #2B2420; display: grid;
  grid-template: repeat(3, 1fr) / repeat(3, 1fr); padding: 6px; box-shadow: 0 3px 0 #2B2420; flex: none; }
.die i { width: 9px; height: 9px; border-radius: 50%; background: #B04F2A; place-self: center; visibility: hidden; }
.die i.on { visibility: visible; }
.dice.spin .die { animation: wob .12s linear infinite; }
@keyframes wob { 50% { transform: rotate(8deg) scale(1.04); } }
.status { font-size: .95rem; color: var(--muted); }
.banner { border-radius: 10px; padding: 9px 12px; font-weight: 600; background: var(--accent); color: var(--accent-ink); margin-bottom: 10px; }

table.sc { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
table.sc th { text-align: left; font-size: .76rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 600; padding: 0 4px 6px; }
table.sc td { padding: 7px 4px; border-top: 1px solid var(--line); }
table.sc td.num { text-align: right; font-weight: 700; }
table.sc tr.cur td { background: var(--surface2); }
.tag { font-size: .72rem; border-radius: 999px; padding: 1px 7px; margin-left: 4px; border: 1px solid var(--line); color: var(--muted); white-space: nowrap; }
.tag.ex { background: var(--ink); color: var(--surface); border-color: var(--ink); }
.decks { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; }
.deck { border-radius: 8px; color: #fff; text-align: center; padding: 6px 2px; font-family: var(--f-display); font-weight: 700; }
.deck small { display: block; font-family: var(--f-text); font-weight: 600; font-size: .78rem; opacity: .95; }
.deck.empty { opacity: .3; }
.log { list-style: none; margin: 0; padding: 0; max-height: 220px; overflow-y: auto; font-size: .9rem; }
.log li { padding: 5px 0; border-top: 1px dashed var(--line); }
.log li:first-child { border-top: 0; }

.setup .row { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
.seg button { border: 1px solid var(--line); background: var(--surface2); color: var(--ink); padding: 7px 14px; border-radius: 9px; font-weight: 600; }
.seg button[aria-pressed="true"] { background: var(--sea); color: var(--accent-ink); border-color: var(--sea); }
.setup label { font-size: .85rem; color: var(--muted); display: block; margin: 8px 0 4px; }
.setup input[type=text], .modal input { width: 100%; padding: 9px 11px; border-radius: 9px; border: 1px solid var(--line); background: var(--surface2); color: var(--ink); font: inherit; }
.namegrid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.namegrid div { display: flex; align-items: center; gap: 8px; min-width: 0; }
.example { font-size: .82rem; color: var(--muted); margin: 4px 0 0; }

.overlay { position: fixed; inset: 0; background: rgba(20,14,8,.62); z-index: 20; display: flex; align-items: center; justify-content: center;
  padding: max(14px, env(safe-area-inset-top, 0px)) max(14px, env(safe-area-inset-right, 0px)) max(14px, env(safe-area-inset-bottom, 0px)) max(14px, env(safe-area-inset-left, 0px)); overflow-y: auto; }
.modal { background: var(--surface); color: var(--ink); border-radius: 16px; box-shadow: var(--shadow); width: 100%; max-width: 660px; padding: 20px; margin: auto; min-width: 0; }
.modal.wide { max-width: min(1180px, 100%); }
.modal h3 { font-family: var(--f-display); font-size: 1.25rem; margin: 0 0 8px; text-wrap: balance; }
.modal .actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 16px; }
.modal p { margin: 0 0 10px; }
.zoomscroll { overflow: auto; max-height: 72vh; border: 1px solid var(--line); border-radius: 10px; background: #F4EAD3; }
.zoomscroll svg { width: 1100px; max-width: none; height: auto; display: block; }

/* a kártya fizikai tárgyként mindkét témában világos marad */
.card { --cc: #A87B22; background: #FDF9EF; color: #2B2420; border: 3px solid var(--cc); border-radius: 14px; overflow: hidden; }
.card .ch { background: var(--cc); color: #fff; display: flex; align-items: center; gap: 10px; padding: 8px 12px; }
.card .cid { background: #FDF9EF; color: var(--cc); width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; flex: none; }
.card .cn { font-family: var(--f-display); font-weight: 700; line-height: 1.15; min-width: 0; }
.card .cn small { display: block; font-family: var(--f-text); font-weight: 400; font-size: .8rem; opacity: .95; }
.card .cp { margin-left: auto; background: #FDF9EF; color: var(--cc); border-radius: 7px; padding: 3px 9px; font-weight: 700; white-space: nowrap; }
.card .cb { padding: 14px 16px 10px; font-size: 1.04rem; line-height: 1.42; }
.card .bg { color: #4B3D2F; font-size: .96rem; margin-bottom: 8px; }
.card .ev { font-family: var(--f-display); font-weight: 700; color: var(--cc); margin-bottom: 4px; font-size: 1.05rem; }
.card .src { font-family: var(--f-quote); font-style: italic; font-size: 1.12rem; background: #F1E6CC; border-left: 4px solid #B8862B; padding: 8px 12px; }
.card .sref { font-size: .76rem; color: #7A6A55; text-align: right; margin: 3px 0 9px; }
.card .stmt { font-family: var(--f-quote); font-weight: 600; font-size: 1.3rem; text-align: center; border: 1px solid #C7A86A; border-radius: 9px; padding: 12px; margin: 4px 0 12px; background: #F6EDD6; }
.card .task { font-weight: 700; }
.card ul { list-style: none; padding-left: 8px; margin: 6px 0 0; }
.card table { border-collapse: collapse; margin-top: 6px; }
.card table td { padding: 3px 14px 3px 4px; border-bottom: 1px dotted #C7A86A; }
.card .eff { margin-top: 10px; background: #22384F; color: #fff; border-radius: 8px; padding: 8px 11px; font-size: .95rem; }
.card .cf { border-top: 1px solid #E2D2AE; background: #F6EEDB; padding: 7px 16px; font-size: .86rem; color: #4B3D2F; }
.card .recap { color: #4B3D2F; font-size: .95rem; border-bottom: 1px dashed #C7A86A; padding-bottom: 8px; margin-bottom: 10px; }
.card .solh { font-family: var(--f-display); font-weight: 700; font-size: .82rem; letter-spacing: .1em; color: #4F6B2C; margin-bottom: 4px; }
.card .sola { font-weight: 700; font-size: 1.08rem; margin-bottom: 4px; }
.card .soln { color: #5B4B38; font-size: .9rem; margin: 6px 0 4px; }
.card.back .cb { background: #EEF2E2; }
.card.flipout { animation: flipout .23s ease-in forwards; }
@keyframes flipout { to { transform: perspective(900px) rotateY(90deg); } }
.card.flipin { animation: flipin .3s ease-out; }
@keyframes flipin { from { transform: perspective(900px) rotateY(-90deg); } }

.timer { height: 8px; border-radius: 4px; background: var(--surface2); overflow: hidden; margin: 12px 0 4px; }
.timer div { height: 100%; background: var(--sea); transition: width .25s linear; }
.timer.out div { background: var(--accent); }
.tlabel { font-variant-numeric: tabular-nums; font-size: .9rem; color: var(--muted); }
.rub { margin-top: 12px; border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; background: var(--surface2); }
.rub h4 { margin: 0 0 6px; font-family: var(--f-display); font-size: .8rem; letter-spacing: .08em; color: var(--muted); }
.rrow { display: flex; gap: 10px; align-items: center; justify-content: space-between; padding: 7px 0; border-top: 1px solid var(--line); flex-wrap: wrap; }
.rub h4 + .rrow { border-top: 0; }
.rl { flex: 1 1 220px; min-width: 0; }
.rbtn { display: flex; gap: 6px; }
.rbtn button { min-width: 46px; min-height: 40px; border-radius: 9px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); font-weight: 700; }
.rbtn button.on { background: var(--sea); color: var(--accent-ink); border-color: var(--sea); }
.rtotal { margin-top: 8px; font-weight: 700; font-variant-numeric: tabular-nums; }
.pts { display: flex; gap: 8px; flex-wrap: wrap; }
.ostraka { display: flex; flex-wrap: wrap; gap: 10px; margin: 10px 0; }
.ostrakon { background: #E7B48F; color: #2B2420; padding: 10px 16px; font-family: var(--f-display); font-weight: 700;
  clip-path: polygon(0 30%, 18% 4%, 56% 0, 86% 12%, 100% 48%, 90% 92%, 50% 100%, 12% 88%); animation: drop .4s ease-out both; }
@keyframes drop { from { transform: translateY(-12px) rotate(-6deg); opacity: 0; } }
.rank { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
.rank td { padding: 9px 6px; border-top: 1px solid var(--line); }
.rank tr:first-child td { font-weight: 700; font-size: 1.1rem; }
.winner { font-family: var(--f-display); font-weight: 700; font-size: 1.7rem; text-align: center; margin: 4px 0 12px; color: var(--accent); }
details.sum { margin-top: 14px; border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; background: var(--surface2); }
details.sum summary { cursor: pointer; font-weight: 700; }
.sumtbl { width: 100%; border-collapse: collapse; margin: 10px 0; font-variant-numeric: tabular-nums; }
.sumtbl td { padding: 6px 6px; border-top: 1px solid var(--line); }
.bar { height: 10px; background: var(--surface); border-radius: 5px; overflow: hidden; border: 1px solid var(--line); }
.bar div { height: 100%; }
.sumtxt { width: 100%; font: 12px/1.4 ui-monospace, Menlo, Consolas, monospace; padding: 8px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); }
.rules h4 { font-family: var(--f-display); margin: 12px 0 4px; font-size: .95rem; color: var(--accent); }
.rules ul { margin: 0; padding-left: 20px; }
.toast { position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--surface);
  padding: 10px 16px; border-radius: 10px; z-index: 30; font-weight: 600; max-width: calc(100% - 32px); text-align: center; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }

.layout { display:grid; grid-template-columns:minmax(0,1fr) 400px; grid-template-areas:"board turn" "board side"; grid-template-rows:auto 1fr; gap:18px; max-width:1440px; margin:0 auto; align-items:start; }
#turn { grid-area:turn; min-width:0; } .board{grid-area:board;} .side{grid-area:side;display:flex;flex-direction:column;gap:14px;min-width:0;}
@media (max-width:1000px){ .layout{grid-template-columns:minmax(0,1fr);grid-template-areas:"turn" "board" "side";grid-template-rows:auto;} }
.board svg .cty:hover circle:first-child { stroke:#B04F2A; }
.acts { display:flex; gap:6px; margin:8px 0; flex-wrap:wrap; }
.acts i { width:18px; height:18px; border-radius:50%; border:2px solid var(--sea); display:inline-block; }
.acts i.used { background:var(--line); border-color:var(--line); }
.acts i.bonus { border-style:dashed; border-color:var(--accent); }
.cargo { display:flex; gap:6px; margin:6px 0 10px; flex-wrap:wrap; }
.gtag { color:#fff; font-weight:700; border-radius:8px; padding:4px 10px; font-size:.88rem; }
.gtag.empty { background:var(--surface2); color:var(--muted); border:1px dashed var(--line); font-weight:400; }
.mkt { list-style:none; margin:0; padding:0; display:grid; gap:6px; }
.mkt li { display:flex; align-items:center; gap:8px; border:1px solid var(--line); border-radius:9px; padding:6px 9px; background:var(--surface2); }
.mkt li .vp { margin-left:auto; font-weight:700; background:var(--accent); color:var(--accent-ink); border-radius:6px; padding:2px 8px; }
.effbox { border-radius:10px; padding:8px 11px; background:var(--sea); color:var(--accent-ink); font-size:.92rem; margin-top:8px; }
.btnrow { display:flex; gap:8px; flex-wrap:wrap; margin-top:8px; }
.kscore { display:grid; gap:8px; margin-top:10px; }
.kscore .krow { display:flex; align-items:center; gap:10px; justify-content:space-between; flex-wrap:wrap; border-top:1px solid var(--line); padding-top:8px; }
.kbtn { display:flex; gap:6px; } .kbtn button { min-width:46px; min-height:42px; border-radius:9px; border:1px solid var(--line); background:var(--surface); color:var(--ink); font-weight:700; }
.kbtn button.on { background:var(--sea); color:var(--accent-ink); border-color:var(--sea); }
.modal.rules{max-width:760px;width:calc(100% - 24px);max-height:88vh;display:flex;flex-direction:column;padding:0;overflow:hidden;}
.rhead{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 18px;border-bottom:1px solid var(--line);}
.rhead h3{margin:0;font-size:1.15rem;}
.rbody{overflow-y:auto;padding:6px 18px 18px;line-height:1.5;}
.rbody h4{margin:16px 0 6px;font-size:1.05rem;color:var(--accent);} .rbody h5{margin:12px 0 4px;font-size:.98rem;}
.rbody ul{margin:6px 0;padding-left:20px;} .rbody li{margin-bottom:4px;}
table.rt{width:100%;border-collapse:collapse;margin:8px 0;font-size:.92rem;} table.rt th,table.rt td{border:1px solid var(--line);padding:5px 8px;text-align:left;vertical-align:top;} table.rt th{background:var(--surface2);}
.hq { margin:8px 0 0; padding-left:20px; } .hq li { margin-bottom:6px; font-weight:600; }

.board svg{filter:drop-shadow(0 1px 0 rgba(0,0,0,.05));}
.pawn{transition:transform .55s cubic-bezier(.3,.75,.25,1);}
.pawn .bob{transform-box:fill-box;}
.pawn.active .bob{animation:bob 1.6s ease-in-out infinite;} .pawn.active .ring{animation:pulse 1.4s ease-in-out infinite;}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-.7px)}}
.hint{animation:dash 1.8s linear infinite;} @keyframes dash{to{stroke-dashoffset:-7.2}}
.floatfx{font-family:var(--f-display),serif;font-weight:700;font-size:6px;paint-order:stroke;stroke:#FFFDF6;stroke-width:1.4px;animation:fl 1.4s ease-out forwards;}
@keyframes fl{0%{transform:translateY(0);opacity:0}15%{opacity:1}100%{transform:translateY(-14px);opacity:0}}
@media (prefers-reduced-motion:reduce){.pawn{transition:none}.pawn.active .bob,.pawn.active .ring,.hint,.floatfx{animation:none}.floatfx{opacity:1}}
.maplegend{display:flex;flex-wrap:wrap;gap:6px 18px;padding:10px 6px 2px;font-size:.84rem;color:var(--muted);}
.maplegend span{display:inline-flex;align-items:center;gap:7px;}
.lg-tag{display:inline-block;width:22px;height:11px;border-radius:4px;background:#4F7F8C;}
.panel.turn{border-top:6px solid var(--pc);padding-top:12px;}
.turn-name{gap:12px;} .turn-name .cogi{flex:none;}
.acts{gap:7px;margin:10px 0 6px;} .acts i{width:22px;height:22px;border:2px solid var(--pc);background:var(--pc);box-shadow:inset 0 0 0 2px var(--surface);}
.acts i.used{background:transparent;border-color:var(--line);box-shadow:none;opacity:.8;}
.acts i.bonus{border-style:solid;border-color:var(--gold);background:var(--gold);}
.acts i.bonus.used{background:transparent;border-color:var(--line);}
.cargo{margin:10px 0 12px;} .gtag{padding:6px 12px;border-radius:7px;box-shadow:0 1px 0 rgba(0,0,0,.2);} .gtag.empty{box-shadow:none;}
.actlist{display:grid;gap:8px;margin:2px 0 6px;}
.act{display:flex;justify-content:space-between;align-items:center;gap:10px;text-align:left;border-radius:11px;padding:10px 13px;border:1px solid var(--line);background:var(--surface2);color:var(--ink);min-height:48px;font-weight:700;}
.act .ac{font-weight:600;font-size:.86rem;color:var(--muted);text-align:right;white-space:nowrap;}
.act:hover{filter:brightness(.97);}
.act.deliver{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);} .act.deliver .ac{color:var(--accent-ink);opacity:.92;}
.act.load{border-left:6px solid var(--sea);} .act.build{border-left:6px solid var(--gold);}

.score li{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr) auto auto;grid-template-areas:"pn pl pv pk" "pb pb pb pb";gap:2px 10px;align-items:center;border:1px solid var(--line);border-left:6px solid var(--pc);border-radius:10px;padding:7px 10px;background:var(--surface);}

<script>
const E=(()=>{// A Hanza kereskedői – játékmotor (közös: szimuláció és online játék)
const CITIES = {
  BER:{n:'Bergen',x:87.3,y:48,big:true,prod:'tokehal'},
  LON:{n:'London',x:24,y:159.8,big:true,prod:'gyapju'},
  BRU:{n:'Brügge',x:51,y:169.5,big:true,prod:'posztó'},
  KOL:{n:'Köln',x:82.3,y:178,prod:'bor'},
  HAM:{n:'Hamburg',x:105.3,y:145,prod:'sör'},
  LUN:{n:'Lüneburg',x:113.4,y:157.4,prod:'só'},
  LUB:{n:'Lübeck',x:122.3,y:138},
  SKA:{n:'Skanör',x:135.4,y:120.8,prod:'hering'},
  VIS:{n:'Visby',x:176.6,y:90.3},
  DAN:{n:'Danzig',x:181.3,y:135.2,prod:'gabona'},
  RIG:{n:'Riga',x:220.3,y:96.2,prod:'fa'},
  NOV:{n:'Novgorod',x:268,y:65.9,big:true,prod:'szőrme'},
};
// [a,b,típus,költség]
const EDGES = [
  ['BER','LON','S',1],['BER','SKA','S',1],['LON','BRU','S',1],['LON','HAM','S',1],['BRU','HAM','S',1],
  ['BRU','KOL','L',1],['KOL','HAM','L',1],['HAM','LUB','L',1],['HAM','LUN','L',1],['LUN','LUB','L',1],
  ['LUB','SKA','S',1],['LUB','VIS','S',1],['LUB','DAN','S',1],['SKA','VIS','S',1],['VIS','DAN','S',1],
  ['VIS','RIG','S',1],['DAN','RIG','S',1],['RIG','NOV','L',1],
];
const GOODS = {tokehal:'Szárított tőkehal',gyapju:'Gyapjú',posztó:'Posztó',bor:'Bor',sör:'Sör',só:'Só',hering:'Hering',gabona:'Gabona',fa:'Fa és kátrány',szőrme:'Szőrme és viasz'};
const P = {kbTable:[0,0,1,1],cMin:2,cK:1.8,cMax:7,maxK:3,baseActions:6,cap:2,marketSize:4,buildCost:2,bigCost:3,kontorVP:1,bigVP:2,netMin:3,netPer:0,kontorHere:1,maxPerCity:2,kontorMove:false,kfDel:true,kfLoad:true};
function adj(f){const a={};for(const k in CITIES)a[k]=[];for(const [x,y,t,c0] of EDGES){const c=f?f(c0,t):c0;a[x].push({to:y,t,c});a[y].push({to:x,t,c});}return a;}
const ADJ=adj();
function setCosts(f){for(const k in ADJ)delete ADJ[k];const a=adj(f);Object.assign(ADJ,a);}
function dist(from){ // legkisebb költség (alap) minden városba
  const d={};for(const k in CITIES)d[k]=1e9;d[from]=0;const q=[from];
  while(q.length){q.sort((a,b)=>d[a]-d[b]);const u=q.shift();for(const e of ADJ[u]){if(d[u]+e.c<d[e.to]){d[e.to]=d[u]+e.c;q.push(e.to);}}}
  return d;
}
function makeContracts(rng){
  const out=[];
  for(const [g,name] of Object.entries(GOODS)){
    const src=Object.keys(CITIES).find(k=>CITIES[k].prod===g);const d=dist(src);
    for(const c in CITIES){ if(c===src) continue; if(d[c]<P.cMin) continue;
      const vp=Math.max(2,Math.min(P.cMax,Math.round(1+d[c]*P.cK)));
      out.push({good:g,from:src,to:c,vp});
    }
  }
  return out;
}
function pick30(){
  const all=makeContracts();const out=[];
  for(const g of Object.keys(GOODS)){const c=all.filter(x=>x.good===g).sort((a,b)=>a.vp-b.vp||a.to.localeCompare(b.to));
    const idx=[0,Math.floor(c.length/2),c.length-1];const used=new Set();
    for(const i of idx){let j=i;while(used.has(c[j].to)&&j<c.length-1)j++;used.add(c[j].to);out.push(c[j]);}}
  return out.map((c,i)=>Object.assign({id:'M'+String(i+1).padStart(2,'0')},c));
}
function rngMaker(seed){let s=seed>>>0;return()=>{s=(s+0x6D2B79F5)>>>0;let t=s;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return((t^t>>>14)>>>0)/4294967296;};}
function shuffle(a,r){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

function newGame(n,rounds,events,rng,deckSize=30){
  const all=shuffle(pick30(),rng).slice(0,deckSize);
  const st={n,rounds,round:0,players:[],deck:all,market:[],events:shuffle(events,rng).slice(0,rounds),rng,first:0,log:[],eff:{},kontors:{}};
  for(let i=0;i<n;i++)st.players.push({pos:'LUB',cargo:[],kontors:[],vp:0,acts:0,del:0,kb:0});
  while(st.market.length<P.marketSize&&st.deck.length)st.market.push(st.deck.shift());
  return st;
}
function effOf(st){return st.eff||{};}
function moveCost(st,p,from,e){
  const ef=st.eff; let c=e.c;
  if(e.t==='S'&&ef.sea1)c+=1; if(e.t==='L'&&ef.land1)c+=1;
  if(ef.free&&((ef.free[0]===from&&ef.free[1]===e.to)||(ef.free[1]===from&&ef.free[0]===e.to)))return 0;
  if(P.kontorMove&&p.kontors.includes(from)&&c>1)c-=1;
  return c;
}
function isClosed(st,c){return st.eff.closed===c;}
function capOf(st){const e=st.eff;return e.cap1?1:e.cap3?3:P.cap;}
function legal(st,pi){ // lehetséges lépések
  const p=st.players[pi],acts=[];
  for(const e of ADJ[p.pos]){ if(isClosed(st,e.to))continue; const c=moveCost(st,p,p.pos,e); if(c<=p.acts)acts.push({a:'move',to:e.to,cost:c}); }
  const city=CITIES[p.pos];
  if(city.prod&&p.cargo.length<capOf(st)&&(p.acts>=1||(P.kfLoad&&p.kontors.includes(p.pos)))&&!isClosed(st,p.pos))acts.push({a:'load',cost:(P.kfLoad&&p.kontors.includes(p.pos))?0:1});
  st.market.forEach((m,i)=>{if(m.to===p.pos&&p.cargo.includes(m.good)&&(p.acts>=1||(P.kfDel&&p.kontors.includes(p.pos)))&&!isClosed(st,p.pos))acts.push({a:'deliver',i,cost:(P.kfDel&&p.kontors.includes(p.pos))?0:1});});
  const bc=buildCost(st,p.pos);
  if(!isClosed(st,p.pos)&&p.acts>=bc&&p.kontors.length<P.maxK&&!p.kontors.includes(p.pos)&&(st.kontors[p.pos]||0)<P.maxPerCity)acts.push({a:'build',cost:bc});
  return acts;
}
function buildCost(st,c){let b=CITIES[c].big?P.bigCost:P.buildCost; if(st.eff.disc)b=Math.max(1,b-1); return b;}
function apply(st,pi,act){
  const p=st.players[pi]; p.acts-=act.cost;
  if(act.a==='move'){p.pos=act.to;}
  else if(act.a==='load'){p.cargo.push(CITIES[p.pos].prod);}
  else if(act.a==='deliver'){const m=st.market[act.i];p.cargo.splice(p.cargo.indexOf(m.good),1);
    let vp=m.vp+(p.kontors.includes(p.pos)?P.kontorHere:0);
    if(st.eff.bonus===m.good)vp+=2; if(st.eff.malus===m.good)vp=Math.max(1,vp-1);
    p.vp+=vp;p.del++;st.market.splice(act.i,1);if(st.deck.length)st.market.push(st.deck.shift());}
  else if(act.a==='build'){p.kontors.push(p.pos);st.kontors[p.pos]=(st.kontors[p.pos]||0)+1;p.kb++;}
}
function component(p){ // legnagyobb összefüggő kontorcsoport
  const set=new Set(p.kontors);let best=0;const seen=new Set();
  for(const s of set){if(seen.has(s))continue;let cnt=0;const q=[s];seen.add(s);
    while(q.length){const u=q.pop();cnt++;for(const e of ADJ[u])if(set.has(e.to)&&!seen.has(e.to)){seen.add(e.to);q.push(e.to);}}
    best=Math.max(best,cnt);}
  return best;
}
function finalVP(p){let v=p.vp;for(const k of p.kontors)v+=CITIES[k].big?P.bigVP:P.kontorVP;const c=component(p);if(c>=P.netMin)v+=c*P.netPer;return v;}
function startRound(st,know){ // know[i] = 0..3 helyes részszempont
  st.eff=st.events[st.round]?.eff||{};
  st.players.forEach((p,i)=>{const kb=P.kbTable[know[i]];p.acts=Math.max(1,P.baseActions+kb+(st.eff.extra||0)-(st.eff.minus1||0));});
}
return {pick30,setCosts,CITIES,EDGES,GOODS,P,ADJ,dist,makeContracts,rngMaker,shuffle,newGame,legal,apply,startRound,finalVP,component,buildCost,capOf,isClosed,moveCost};

s viasz"}};
const COLORS=['#2C6894','#B04F2A','#5F6E30','#7A3E8E'];
const KEYQ='hanza-kereskedoi-online-v1';
const ROUNDS={tanorai:{2:6,3:3,4:4},hosszu:{2:12,3:6,4:8}};
const LENLAB={tanorai:'Tanórai (kb. 45 perc a magyarázattal)',hosszu:'Hosszú (két tanóra)'};
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const REDUCED=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
let S=null, ui=null, ticker=null;
let setup={n:4,names:['Anna','Bence','Csenge','Dani'],len:'tanorai'};
const gname=g=>D.GOODNAME[g];
function save(){try{localStorage.setItem(KEYQ,JSON.stringify(S));}catch(e){}}
function load(){try{const v=localStorage.getItem(KEYQ);return v?JSON.parse(v):null;}catch(e){return null;}}
function clearSave(){try{localStorage.removeItem(KEYQ);}catch(e){}}
function toast(m){const t=$('#toast');t.textContent=m;t.hidden=false;clearTimeout(toast.h);toast.h=setTimeout(()=>t.hidden=true,2400);announce(m);}
let _an=0;
function announce(m){const r=$('#sr');if(!r)return;r.textContent='';const id=++_an;setTimeout(()=>{if(id===_an)r.textContent=m;},40);}
let _lock=0;
function locked(){const n=Date.now();if(n-_lock<320)return true;_lock=n;return false;}
const plain=h=>String(h).replace(/<[^>]*>/g,'').replace(/&amp;/g,'&').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&quot;/g,'"');
function log(m){S.log.unshift(m);if(S.log.length>80)S.log.pop();}
const P=i=>S.players[i];
const cur=()=>S.players[S.cur];
const card=()=>D.CARDS[S.events[S.round].id];
function legal(){return E.legal(S,S.cur);}

/* ---------- indítás ---------- */
function startGame(){
  const n=setup.n;
  const st=E.newGame(n,ROUNDS[setup.len][n],D.CARDLIST.map(c=>({id:c.id,eff:c.eff})),Math.random);
  st.players.forEach((p,i)=>{p.name=(setup.names[i]||'').trim()||(i+1)+'. játékos';p.color=COLORS[i];p.kt=0;});
  Object.assign(st,{v:1,phase:'know',k:{stage:'q',t0:Date.now()},cur:0,oi:0,first:0,log:[],results:[],undo:null,modal:null});
  S=st; log('A játék elkezdődött: '+n+' játékos, '+st.rounds+' kör.'); save(); renderAll(); focusEl($('#turnH'));
}
/* ---------- kör és fázisok ---------- */
function afterKnow(scores){
  if(S.phase!=='know'||locked())return;
  S.results.push({id:card().id,s:scores.slice()});
  scores.forEach((v,i)=>{P(i).kt+=v;});
  E.startRound(S,scores);
  S.phase='act';S.oi=0;S.cur=S.first;S.undo=null;
  log('<b>'+(S.round+1)+'. kör – '+esc(card().title)+':</b> '+esc(card().effect));
  save();renderAll();focusEl($('#turnH'));
  announce((S.round+1)+'. kör: '+card().title+'. '+cur().name+' következik, '+cur().acts+' akció.');
}
function endTurn(){
  if(!S||S.phase!=='act'||locked())return;
  S.undo=null;S.oi++;
  if(S.oi>=S.n){
    S.round++;S.first=(S.first+1)%S.n;S.eff={};
    if(S.round>=S.rounds){finish();return;}
    S.phase='know';S.k={stage:'q',t0:Date.now()};
  } else { S.cur=(S.first+S.oi)%S.n; }
  save();renderAll();
  if(S.phase==='act'){announce('Következik: '+cur().name+', '+cur().acts+' akció.');focusEl($('#turnH'));}
  else if(S.phase==='know')focusEl($('#turnH'));
}
function doAct(a){
  if(!S||S.phase!=='act'||ui||locked())return;
  if(!legal().some(x=>JSON.stringify(x)===JSON.stringify(a)))return;
  S.undo=JSON.stringify(S,(k,v)=>(k==='rng'||k==='undo')?undefined:v);
  const p=cur();const before=p.vp;
  E.apply(S,S.cur,a);
  if(a.a==='move')log(esc(p.name)+' → '+E.CITIES[a.to].n);
  else if(a.a==='load')log(esc(p.name)+' felrakodott: '+gname(E.CITIES[p.pos].prod)+' ('+E.CITIES[p.pos].n+').');
  else if(a.a==='deliver'){log('<b>'+esc(p.name)+' kiszállított ('+E.CITIES[p.pos].n+'): +'+(p.vp-before)+' VP.</b>');toast('+'+(p.vp-before)+' VP');fx(p.pos,'+'+(p.vp-before)+' VP');}
  else if(a.a==='build'){log('<b>'+esc(p.name)+' kereskedőtelepet épített: '+E.CITIES[p.pos].n+'.</b>');toast('Kereskedőtelep épült: '+E.CITIES[p.pos].n);fx(p.pos,'Telep','#2C6894');}
  announce(plain(S.log[0]||'')+' Hátralévő akció: '+p.acts+'.');
  save();renderAll();focusAfterAct(a);
}
function focusEl(el){if(el&&el.focus){try{el.focus({preventScroll:false});}catch(e){el.focus();}}}
function focusAfterAct(a){
  const key=JSON.stringify(a);
  const same=[...document.querySelectorAll('#turn [data-ai]')].find(b=>b.dataset.ai===key);
  if(same)return focusEl(same);
  focusEl($('#turnH'));
}
function undo(){if(!S||!S.undo||locked())return;const o=JSON.parse(S.undo);Object.keys(S).forEach(k=>{if(k!=='rng')delete S[k];});Object.assign(S,o);S.rng=Math.random;save();renderAll();announce('Az utolsó lépést visszavontad.');focusEl($('#turnH'));}
function finish(){
  S.phase='end';
  const info=S.players.map((p,i)=>{
    let kv=0,big=0;p.kontors.forEach(c=>{if(E.CITIES[c].big){kv+=E.P.bigVP;big++;}else kv+=E.P.kontorVP;});
    return {i,total:p.vp+kv,cv:p.vp,kv,del:p.del,big,kt:p.kt};
  });
  info.sort((a,b)=>b.total-a.total||b.del-a.del||b.big-a.big||b.kt-a.kt);
  const top=info.filter(x=>x.total===info[0].total&&x.del===info[0].del&&x.big===info[0].big&&x.kt===info[0].kt);
  S.modal={type:'end',order:info,winners:top.map(x=>x.i)};
  log('<b>A játék véget ért.</b>');save();renderAll();
}

/* ---------- tábla-réteg ---------- */
const NS='http://www.w3.org/2000/svg';
function layers(svgEl){
  let L=svgEl.querySelector('#layer');
  if(!L){L=document.createElementNS(NS,'g');L.id='layer';L.setAttribute('pointer-events','none');
    ['stat','pawns','fx'].forEach(n=>{const g=document.createElementNS(NS,'g');g.id='L-'+n;L.appendChild(g);});svgEl.appendChild(L);}
  return {stat:L.querySelector('#L-stat'),pawns:L.querySelector('#L-pawns'),fx:L.querySelector('#L-fx')};
}
const COG=(c,ch)=>`<g class="bob"><path d="M-4.2 0.6 L4.2 0.6 L3 3.4 L-3 3.4 Z" fill="${c}" stroke="#2B2420" stroke-width=".5" stroke-linejoin="round"/><line x1="0" y1="0.6" x2="0" y2="-4.6" stroke="#2B2420" stroke-width=".55"/><path d="M0 -4 L3.6 -0.4 L0 0.2 Z" fill="#FFFDF6" stroke="#2B2420" stroke-width=".4" stroke-linejoin="round"/><path d="M0 -3.4 L-3 -0.6 L0 0 Z" fill="#F1E4C6" stroke="#2B2420" stroke-width=".4" stroke-linejoin="round"/>${ch?`<text class="hl" y="3" text-anchor="middle" font-weight="700" font-size="2.5" fill="#fff">${ch}</text>`:''}</g>`;
function cogHTML(c,w=26){return `<svg class="cogi" viewBox="-6 -6 12 10.5" width="${w}" height="${Math.round(w*.875)}" aria-hidden="true">${COG(c).replace('class="bob"','')}</svg>`;}
function drawLayer(svgEl){
  const {stat,pawns}=layers(svgEl);
  let h='';
  const players=S?S.players:setup.names.slice(0,setup.n).map((n,i)=>({name:n,pos:'LUB',color:COLORS[i],kontors:[]}));
  if(S&&S.eff&&S.eff.closed){const c=E.CITIES[S.eff.closed];h+=`<circle cx="${c.x}" cy="${c.y}" r="9" fill="#B04F2A" fill-opacity=".38" stroke="#B04F2A" stroke-width="1"/><path d="M${c.x-3} ${c.y-3} L${c.x+3} ${c.y+3} M${c.x+3} ${c.y-3} L${c.x-3} ${c.y+3}" stroke="#7A2A10" stroke-width="1.4" stroke-linecap="round"/>`;}
  if(S&&S.phase==='act'){
    legal().filter(a=>a.a==='move').forEach(a=>{const c=E.CITIES[a.to];h+=`<circle class="hint" cx="${c.x}" cy="${c.y}" r="${c.big?9.4:8}" fill="${cur().color}" fill-opacity=".12" stroke="${cur().color}" stroke-width="1.1" stroke-dasharray="2 1.6"/>`;});
  }
  players.forEach((p,pi)=>{p.kontors.forEach((k)=>{const c=E.CITIES[k];const cnt=players.filter((q,qi)=>qi<pi&&q.kontors.includes(k)).length;
      h+=`<g transform="translate(${c.x+4.4+cnt*5.4},${c.y-8.6})"><path d="M-2.6 1.8 L-2.6 -0.6 L0 -2.8 L2.6 -0.6 L2.6 1.8 Z" fill="${p.color}" stroke="#fff" stroke-width=".7" stroke-linejoin="round"/></g>`;});});
  stat.innerHTML=h;
  // bábuk: állandó elemek, hogy a mozgás animálható legyen
  const at={};players.forEach((p,i)=>{(at[p.pos]=at[p.pos]||[]).push(i);});
  players.forEach((p,i)=>{
    let el=pawns.querySelector('#pawn'+i);
    if(!el){el=document.createElementNS(NS,'g');el.id='pawn'+i;el.setAttribute('class','pawn');pawns.appendChild(el);}
    const arr=at[p.pos];const j=arr.indexOf(i);const c=E.CITIES[p.pos];
    const dx=(j-(arr.length-1)/2)*9.2, dy=arr.length>1?(j%2?1.6:-1.6):0;
    const act=S&&S.phase==='act'&&i===S.cur;
    el.style.transform=`translate(${c.x+dx}px,${c.y-0.4+dy}px)`;
    el.classList.toggle('active',!!act);
    el.setAttribute('data-c',p.color);
    const ch=esc((p.name.trim().charAt(0)||String(i+1)).toUpperCase());
    if(el.dataset.col!==p.color||!el.dataset.init){el.innerHTML=`<g transform="scale(1.35)"><ellipse class="ring" cx="0" cy="3.7" rx="5.8" ry="1.9" fill="none" stroke="${p.color}" stroke-width=".8"/><ellipse cx="0" cy="3.7" rx="4.6" ry="1.2" fill="#0b2a3c" fill-opacity=".22"/>${COG(p.color,ch)}</g>`;el.dataset.col=p.color;el.dataset.init='1';}
    else{const t=el.querySelector('.hl');if(t)t.textContent=ch.replace(/&amp;/g,'&');}
  });
}
function fx(cityKey,txt,col){
  const svg=$('#boardsvg');if(!svg)return;const {fx:f}=layers(svg);const c=E.CITIES[cityKey];
  const t=document.createElementNS(NS,'text');t.setAttribute('x',c.x);t.setAttribute('y',c.y-6);t.setAttribute('text-anchor','middle');t.setAttribute('class','floatfx');t.setAttribute('fill',col||'#7A2A10');t.textContent=txt;f.appendChild(t);setTimeout(()=>t.remove(),1500);
}
function drawBoard(){const svg=$('#boardsvg');if(svg)drawLayer(svg);}

function renderKnow(ov,m){

  } else {

    const done=k.sel.every(v=>v!==null);
    $('#kt').textContent=done?'Bónusz akciót kap: '+S.players.filter((p,i)=>E.P.kbTable[k.sel[i]]>0).map(p=>p.name).join(', ')||'senki':'(minden játékosnál válassz értéket)';

  ov.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{k.sel[+b.dataset.p]=+b.dataset.v;sync();});

function summary(){
  const R=S.results;const lines=['A Hanza kereskedői – összesítő','Kártya\tCím\t'+S.players.map(p=>p.name).join('\t')];
  R.forEach(r=>lines.push(r.id+'\t'+D.CARDS[r.id].title+'\t'+r.s.join('\t')));
  const avg=R.map(r=>({id:r.id,t:D.CARDS[r.id].title,a:r.s.reduce((x,y)=>x+y,0)/r.s.length})).sort((a,b)=>a.a-b.a);
  const html=`<table class="sumtbl"><tr><td><b>Kártya</b></td><td><b>Átlagos pont (0–3)</b></td><td></td></tr>`+R.map((r,i)=>{const a=r.s.reduce((x,y)=>x+y,0)/r.s.length;const g=D.GROUPS[r.id[0]];return `<tr><td>${r.id} ${esc(D.CARDS[r.id].title)}</td><td style="width:34%"><div class="bar"><div style="width:${a/3*100}%;background:${g[1]}"></div></div></td><td style="text-align:right"><b>${a.toFixed(1)}</b></td></tr>`;}).join('')+`</table><p><b>Leggyengébben sikerült:</b> ${avg.slice(0,3).map(x=>esc(x.id+' '+x.t)).join(', ')}</p>`;
  return {html,text:lines.join('\n')};
}
function renderEnd(ov,m){
  let h='<div class="modal" role="dialog" aria-modal="true" aria-label="Eredmény"><h3>A Hansetag ítélete</h3>';
  h+=`<div class="winner">${m.winners.map(i=>esc(P(i).name)).join(' és ')} ${m.winners.length>1?'közösen győztek':'győzött'}!</div>`;
  h+='<table class="rank">'+m.order.map((x,r)=>`<tr><td>${r+1}.</td><td><span class="chip" style="background:${P(x.i).color}"></span> ${esc(P(x.i).name)}</td><td style="text-align:right;font-size:.85rem;color:var(--muted)">megbízás ${x.cv} · telep ${x.kv}</td><td style="text-align:right"><b>${x.total} VP</b></td></tr>`).join('')+'</table>';
  h+='<p class="status" style="margin-top:8px">Holtverseny esetén: több megbízás, több nagy kereskedőtelep, majd több jó válasz dönt.</p>';
  const sm=summary();
  h+=`<details class="sum"><summary>Tanári összesítő – melyik Hansetag-kártya hogyan sikerült?</summary>${sm.html}<textarea class="sumtxt" id="sumTxt" rows="6" readonly aria-label="Összesítő szövege">${esc(sm.text)}</textarea><div class="actions"><button class="btn" id="bCopy" type="button">Összesítő másolása</button></div></details>`;
  h+='<div class="actions"><button class="btn" id="eNew" type="button">Új játék</button><button class="btn" id="eClose" type="button">Tábla megtekintése</button></div></div>';
  ov.innerHTML=h;
  $('#bCopy').onclick=()=>{const t=$('#sumTxt');const fb=()=>{t.focus();t.select();toast('Jelöld ki és másold ki a szöveget (Ctrl+C)');};try{navigator.clipboard.writeText(t.value).then(()=>toast('Az összesítő a vágólapra került'),fb);}catch(e){fb();}};
  $('#eNew').onclick=askNew;$('#eClose').onclick=()=>{m.hidden=true;save();renderModal();};
}
function renderRules(ov){
  const P_=E.P;
  const ct=Object.values(D.CARDS).map(c=>`<tr><td><b>${esc(c.id)}</b> ${esc(c.title)}</td><td>${esc((t=>t.charAt(0).toUpperCase()+t.slice(1))(c.effect.replace(/^[^:]*:\s*/,'')))}</td></tr>`).join('');
  const rt=[2,3,4].map(n=>`<tr><td>${n} fő</td><td>${ROUNDS.tanorai[n]} kör</td><td>${ROUNDS.hosszu[n]} kör</td></tr>`).join('');
  ov.innerHTML=`<div class="modal rules" role="dialog" aria-modal="true" aria-label="Játékszabály"><div class="rhead"><h3>Játékszabály – A Hanza kereskedői</h3><button class="btn primary" id="rClose" type="button">Bezárás</button></div><div class="rbody" tabindex="0">
  <h4>1. Cél</h4><p>Mindenki egy hanzai kereskedőház vezetője. A játék végén az nyer, akinek a legtöbb győzelmi pontja (VP) van. VP-t megbízások teljesítésével és kereskedőtelepek (kontorok) építésével lehet szerezni.</p>
  <h4>2. Előkészítés és a játék hossza</h4><ul><li>Minden hajó <b>Lübeckben</b> indul.</li><li>A 30 megbízásból 4 nyitott megbízás van a táblán. Teljesítés után a pakliból új kerül a helyére.</li><li>Minden játékosnak legfeljebb ${P_.maxK} kereskedőtelepe lehet.</li><li>A kezdő játékos körről körre továbbmegy a következőre (az 1. játékossal indul).</li></ul>
  <table class="rt"><tr><th>Játékosok</th><th>Tanórai (kb. 45 perc)</th><th>Hosszú (két tanóra)</th></tr>${rt}</table>
  <p class="example">A körök száma a játékosszám többszöröse, így az ülésrend nem ad előnyt.</p>
  <h4>3. Egy kör menete</h4>
  <h5>3.1. Hansetag (kb. 3 perc)</h5><ul><li>A játék megnyit egy Hansetag-kártyát: háttérszöveg, három kérdés és a kör hatása. A kérdésekre 120 másodperc áll rendelkezésre (az időzítő csak jelzés).</li><li><b>Mindenki papírra írja a válaszait</b> (a felolvasó is).</li><li>A kártya megfordítása után megjelenik a megoldás. A szomszéd javít: kérdésenként <b>1 pont</b> (0–3). A pontszámot játékosonként be kell kattintani.</li><li><b>2 vagy 3 jó válasz esetén +1 akció</b> jár az adott körre. 0–1 jó válasz esetén nincs bónusz.</li><li>A kártya <b>hatása</b> mindenkire érvényes, de csak abban a körben (lásd a 4. pontot).</li></ul>
  <h5>3.2. Kereskedés</h5><ul><li>Minden játékosnak alapból <b>${P_.baseActions} akciója</b> van, plusz 1 a tudásért, plusz vagy mínusz 1 az esemény miatt (legalább 1 marad). A fel nem használt akció elvész.</li><li>A kezdő játékostól indulva mindenki sorra elhasználja az akcióit, majd a <b>Kör vége</b> gombbal továbbadja a sort. Az utolsó lépés a <b>Visszavonás</b> gombbal visszavonható.</li></ul>
  <table class="rt"><tr><th>Akció</th><th>Költség</th><th>Szabály</th></tr>
  <tr><td><b>Út</b></td><td>1</td><td>Szomszédos városba, tengeri (S) vagy szárazföldi (L) úton. A térképen a szaggatott piros gyűrűvel jelölt városra kattintva lehet lépni. Több hajó állhat egy városban.</td></tr>
  <tr><td><b>Rakodás</b></td><td>1</td><td>Termelő városban 1 árut lehet felvenni (a térképen színes címke jelzi). Legfeljebb <b>${P_.cap} áru</b> vihető.</td></tr>
  <tr><td><b>Kiszállítás</b></td><td>1</td><td>Ha a városban nyitott megbízás vár a nálad lévő árura, leadod az árut, megkapod a megbízás VP-it, és új megbízás kerül ki.</td></tr>
  <tr><td><b>Kereskedőtelep építése</b></td><td>${P_.buildCost} (a négy nagy kereskedőtelep városában ${P_.bigCost})</td><td>Abban a városban, ahol állsz.</td></tr></table>
  <ul><li><b>Mi a kereskedőtelep?</b> A Hanza külföldi kereskedőtelepének, történelmi nevén a <i>kontornak</i> megfelelője: a saját házad egy városban.</li><li><b>Kereskedőtelepre vonatkozó korlátok:</b> legfeljebb ${P_.maxK} kereskedőtelep játékosonként; egy városban legfeljebb ${P_.maxPerCity} kereskedőtelep állhat, tőled csak egy.</li><li><b>Kereskedőtelep előnye:</b> a saját kereskedőtelepeden a rakodás és a kiszállítás <b>ingyenes</b> (0 akció), és az oda teljesített kiszállításért <b>+${P_.kontorHere} VP</b> jár.</li><li><b>Nagy kereskedőtelepek városai:</b> Bergen, London, Brügge, Novgorod.</li><li><b>Lezárt város</b> (esemény miatt): nem léphetsz be, nem rakodhatsz, nem szállíthatsz ki és nem építhetsz ott. Ha már ott állsz, elindulhatsz. A térképen piros X jelzi.</li></ul>
  <h4>4. A Hansetag-kártyák hatása</h4><table class="rt"><tr><th>Kártya</th><th>Hatás abban a körben</th></tr>${ct}</table>
  <h4>5. A játék vége és pontozás</h4><p>A megadott számú kör után összesítés következik: <b>összpontszám = teljesített megbízások VP-i + kereskedőtelepek</b> (kereskedőtelep ${P_.kontorVP} VP, nagy kereskedőtelep ${P_.bigVP} VP). A „Játék lezárása” gombbal a játék korábban is befejezhető.</p><p><b>Holtverseny esetén</b> a következő sorrend dönt: (1) több teljesített megbízás, (2) több nagy kereskedőtelep, (3) több jó válasz összesen a Hansetag-kérdésekre.</p>
  <h4>6. Tudnivalók</h4><ul><li>Az állás a böngészőben automatikusan mentődik, így az oldal újratöltése után is folytatható. A mentés csak az adott eszközön él.</li><li>A játék az eredményablakban tanári összesítőt ad: kártyánként az osztály átlagos pontszámát és a leggyengébben sikerült témákat.</li><li>A játékot még nem próbálták ki osztályteremben. Az áru–város párosítások (különösen bor–Köln, sör–Hamburg, gabona–Danzig, fa–Riga) játéktechnikai egyszerűsítések, forrással nem ellenőrzöttek.</li></ul>
  </div></div>`;
  $('#rClose').onclick=()=>{ui=null;renderAll();};
  $('#rClose').focus();
}
function renderZoom(ov){
  ov.innerHTML=`<div class="modal wide" role="dialog" aria-modal="true" aria-label="Nagyított játéktábla"><h3>Játéktábla</h3><div class="zoomscroll" id="zs"></div><div class="actions"><button class="btn primary" id="zClose" type="button">Bezárás</button></div></div>`;
  const svg=$('#boardsvg').cloneNode(true);svg.removeAttribute('id');svg.removeAttribute('width');svg.removeAttribute('height');
  svg.querySelectorAll('[id]').forEach(e=>{if(!/^(layer|L-|pawn)/.test(e.id))e.removeAttribute('id');});
  $('#zs').appendChild(svg);$('#zClose').onclick=()=>{ui=null;renderAll();};
}
function renderConfirm(ov,m){
  ov.innerHTML=`<div class="modal" role="dialog" aria-modal="true"><h3>${m.title}</h3><p>${m.text}</p><div class="actions"><button class="btn primary" id="okB" type="button">${m.ok}</button><button class="btn" id="noB" type="button">Mégse</button></div></div>`;
  $('#okB').onclick=()=>{const f=m.fn;ui=null;f();};$('#noB').onclick=()=>{ui=null;renderAll();};
}
function askNew(){const go=()=>{clearSave();S=null;renderAll();};if(!S)return go();ui={type:'confirm',title:'Új játék kezdése',text:'A jelenlegi játék állása törlődik. Biztosan új játékot kezdtek?',ok:'Igen, új játék',fn:go};renderModal();}
function renderModalInner(){
  const ov=$('#overlay');const m=ui||(S&&S.modal);
  if(!m||m.hidden){ov.hidden=true;ov.innerHTML='';clearInterval(ticker);return;}
  ov.hidden=false;
  if(m.type==='know')return renderKnow(ov,m);
  clearInterval(ticker);
  if(m.type==='end')return renderEnd(ov,m);
  if(m.type==='confirm')return renderConfirm(ov,m);
  if(m.type==='rules')return renderRules(ov);
  if(m.type==='zoom')return renderZoom(ov);
}
let _wasOpen=false,_opener=null;
function setInert(on){document.querySelectorAll('header.top,main.layout').forEach(e=>{if(on)e.setAttribute('inert','');else e.removeAttribute('inert');});}
function renderModal(){
  if(!_wasOpen){const a=document.activeElement;_opener=a&&a!==document.body?{id:a.id||null,el:a}:null;}
  renderModalInner();
  const ov=$('#overlay');const open=!ov.hidden;
  setInert(open);
  if(open){
    const dlg=ov.querySelector('.modal');
    if(dlg&&!ov.contains(document.activeElement)){dlg.setAttribute('tabindex','-1');dlg.focus();}
  } else if(_wasOpen){
    let t=null;
    if(_opener){t=document.body.contains(_opener.el)&&!_opener.el.disabled&&!_opener.el.hidden?_opener.el:(_opener.id?document.getElementById(_opener.id):null);}
    if(!t||t.hidden)t=$('#turnH')||$('#bStart')||$('#bRules');
    focusEl(t);
  }
  _wasOpen=open;
}
function updateClock(){const c=$('#clock');if(!S||S.phase==='end'){c.hidden=true;return;}c.hidden=false;c.textContent=Math.min(S.rounds,S.round+1)+'. kör / '+S.rounds;}
function renderAll(){
  if(S&&S.phase==='act'){S.players.forEach(p=>{});}
  renderPanels();updateClock();renderModal();
}
// az akciópontok összes számának tárolása a kör elején
const _sr=E.startRound;
E.startRound=function(st,know){_sr(st,know);st.players.forEach(p=>{p.tot=p.acts;});};

document.addEventListener('click',e=>{
  const g=e.target.closest&&e.target.closest('.cty');if(!g||!S||S.phase!=='act'||ui)return;
  if(g.closest('#zs'))return;
  const id=g.dataset.id;const a=legal().find(x=>x.a==='move'&&x.to===id);
  if(a)doAct(a);else if(id!==cur().pos)toast('Ide most nem léphetsz (nem szomszédos, nincs elég akció, vagy lezárt város).');
});
$('#bRules').onclick=()=>{ui={type:'rules'};renderModal();};
$('#bZoom').onclick=()=>{ui={type:'zoom'};renderModal();};
$('#bNew').onclick=askNew;
$('#bRes').onclick=()=>{if(S&&S.modal){S.modal.hidden=false;renderModal();}};
$('#bEnd').onclick=()=>{ui={type:'confirm',title:'Játék lezárása',text:'A játék most véget ér, és megjelenik az eredmény. Folytatja a lezárást?',ok:'Lezárás',fn:()=>{S.modal=null;finish();}};renderModal();};
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&ui&&(ui.type==='rules'||ui.type==='zoom'||ui.type==='confirm')){ui=null;renderAll();return;}
  if(e.repeat&&(e.key==='Enter'||e.key===' ')&&e.target.closest&&e.target.closest('button'))e.preventDefault();
});
function start(data){
  S=(data&&data.S)||load();
  if(S&&S.v!==1)S=null;
  if(S)S.rng=Math.random;
  try{renderAll();}
  catch(err){S=null;ui=null;clearSave();try{renderAll();}catch(e2){}}
}
start({});
</script>
