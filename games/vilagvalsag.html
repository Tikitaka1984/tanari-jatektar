<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A nagy gazdasági világválság – interaktív feladat</title>
<style>
:root{
  --paper:#f4efe6; --card:#fffdf8; --ink:#1f1a14; --muted:#5f5547; --line:#d9cdb6;
  --accent:#7a2e2e; --accent-d:#5c2121; --gold:#b08a3e; --ok:#2f6b3f; --bad:#a33a2f; --bar:#231f1a;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
h1,h2,h3{font-family:Georgia,"Times New Roman",serif;line-height:1.25;margin:0}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* fejléc */
.top{background:var(--bar);color:#f4efe6;padding:14px 20px;display:flex;flex-wrap:wrap;gap:12px 28px;align-items:center;justify-content:space-between}
.top h1{font-size:1.45rem;font-weight:700}
.top .sub{margin:2px 0 0;font-size:.9rem;color:#cfc4ad}
.stat{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center}
.pill{background:#3a342b;border:1px solid #574d3d;border-radius:999px;padding:4px 14px;font-size:.92rem;white-space:nowrap}
.pill b{color:#fff}
.bar{width:150px;height:8px;background:#3a342b;border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--gold);transition:width .3s}
.btn{border:1px solid #8a7a5c;background:transparent;color:#f4efe6;border-radius:6px;padding:6px 14px;font-size:.92rem}
.btn:hover{background:#3a342b}
.btn[aria-pressed=true]{background:var(--gold);color:#1f1a14;border-color:var(--gold)}

/* fülek */
.tabs{display:flex;flex-wrap:wrap;gap:4px;padding:12px 20px 0;max-width:1400px;margin:0 auto}
.tab{background:#e9e0cd;border:1px solid var(--line);border-bottom:none;border-radius:8px 8px 0 0;padding:9px 18px;font-weight:600;color:var(--muted)}
.tab:hover{background:#f0e8d6}
.tab[aria-current=true]{background:var(--card);color:var(--accent-d);box-shadow:0 2px 0 var(--card)}
.tab .tk{font-weight:400;font-size:.8rem;margin-left:6px;color:var(--ok)}

main{max-width:1400px;margin:0 auto;padding:0 20px 24px}
.sheet{background:var(--card);border:1px solid var(--line);border-radius:0 8px 8px 8px;padding:18px}
.sheet h2{font-size:1.3rem;color:var(--accent-d)}
.intro{margin:6px 0 14px;color:var(--muted);max-width:90ch}
.layout{display:grid;grid-template-columns:minmax(0,1.65fr) minmax(300px,1fr);gap:20px;align-items:start}
@media (max-width:980px){.layout{grid-template-columns:1fr}}
.caption{margin:8px 2px 0;font-size:.85rem;color:var(--muted)}

/* kép és pontok */
.imgwrap{position:relative;line-height:0;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:#111;touch-action:manipulation}
.imgwrap img{width:100%;height:auto;display:block;user-select:none;-webkit-user-drag:none}
.hs{position:absolute;transform:translate(-50%,-50%);width:38px;height:38px;padding:0;border-radius:50%;border:2px solid #fff;background:var(--accent);color:#fff;font:700 15px/1 system-ui,sans-serif;display:grid;place-items:center;box-shadow:0 1px 6px rgba(0,0,0,.65)}
.hs::after{content:"";position:absolute;inset:-7px;border-radius:50%;border:2px solid rgba(255,255,255,.85);animation:pulse 2s ease-out infinite;pointer-events:none}
@keyframes pulse{0%{transform:scale(.7);opacity:.9}100%{transform:scale(1.3);opacity:0}}
@media (prefers-reduced-motion:reduce){.hs::after{animation:none;opacity:.45}.bar i{transition:none}}
@media (pointer:coarse){.hs{width:46px;height:46px}}
.hs:hover{background:var(--accent-d)}
.hs:focus-visible{outline:3px solid #fff;box-shadow:0 0 0 6px var(--accent-d)}
.hs.sel{background:var(--gold);color:#1f1a14;outline:3px solid #fff}
.hs.done{background:var(--ok)}
.hs.done::after{display:none}
body.teacher .hs{cursor:grab}
body.teacher .hs:active{cursor:grabbing}

/* SVG ábrák */
.svgwrap{background:#fbf6ec;border:1px solid var(--line);border-radius:6px;padding:6px}
.svgwrap svg{width:100%;height:auto;display:block}
.svgwrap text{font-family:Georgia,"Times New Roman",serif;fill:var(--ink)}
.hs-svg{cursor:pointer;outline:none}
.hs-svg .shape{stroke:#3b3225;stroke-width:1.5}
.hs-svg:hover .shape,.hs-svg:focus-visible .shape{stroke:var(--accent);stroke-width:3.5}
.hs-svg.sel .shape{stroke:var(--gold);stroke-width:5}
.badge circle{fill:var(--accent);stroke:#fff;stroke-width:2}
.badge text{fill:#fff !important;font:700 14px system-ui,sans-serif !important;text-anchor:middle;dominant-baseline:central}
.hs-svg.done .badge circle{fill:var(--ok)}
.hs-svg.sel .badge circle{fill:var(--gold)}
.hs-svg.sel .badge text{fill:#1f1a14 !important}
.nl{font-size:17px;text-anchor:middle;dominant-baseline:central;pointer-events:none}
.nl.light{fill:#fff !important}
.al{font-size:14px;font-style:italic;text-anchor:middle;paint-order:stroke;stroke:#fbf6ec;stroke-width:4px;fill:#4a4034 !important;pointer-events:none}
.note{font-size:14px;text-anchor:middle;fill:#5f5547 !important}
.axis{stroke:#bdb199;stroke-width:1}
.tick{font:12px system-ui,sans-serif !important;fill:#5f5547 !important}
.ttl{font:700 14px system-ui,sans-serif !important;fill:#3b3225 !important}
.line{fill:none;stroke-width:3;stroke-linejoin:round}
.dot{fill:#fff;stroke:#3b3225;stroke-width:2}
.dot.key{fill:var(--accent);stroke:#fff;stroke-width:2.5}
.hs-svg.done .dot{fill:var(--ok)}
.hs-svg:focus-visible .dot,.hs-svg:hover .dot{stroke:var(--accent);stroke-width:4}
.band{fill:var(--gold);opacity:0;pointer-events:all}
.hs-svg:hover .band{opacity:.1}
.hs-svg.sel .band{opacity:.2}
.hit{fill:transparent}

/* jobb panel */
.panel{background:#fffaf0;border:1px solid var(--line);border-radius:8px;padding:16px;position:sticky;top:12px}
@media (max-width:980px){.panel{position:static}}
.empty{color:var(--muted)}
.empty b{color:var(--accent-d)}
.pk{font-size:.78rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
.panel h3{font-size:1.2rem;margin-bottom:8px;color:var(--ink)}
.panel p{margin:0 0 .6em}
.ref{font-size:.82rem;color:var(--muted);border-top:1px dashed var(--line);padding-top:6px;margin-top:8px !important}
.facts{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 10px}
.fact{background:#f1e8d5;border:1px solid var(--line);border-radius:6px;padding:6px 10px;font-size:.92rem}
.fact b{display:block;font-size:1.15rem;font-family:Georgia,serif}
.fact small{color:var(--muted)}
.q{margin-top:14px;border-top:2px solid var(--line);padding-top:12px}
.qt{font-weight:600;margin:0 0 10px !important}
.opts{display:grid;gap:8px}
.opt{display:flex;gap:10px;text-align:left;align-items:flex-start;background:#fff;border:1.5px solid #cdbf9f;border-radius:8px;padding:9px 12px;width:100%}
.opt .lt{flex:0 0 auto;width:24px;height:24px;border-radius:50%;background:#efe6d2;display:grid;place-items:center;font-weight:700;font-size:.85rem}
.opt:hover:not(:disabled){border-color:var(--accent);background:#fbf3e4}
.opt:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.opt.ok{border-color:var(--ok);background:#e8f3ea}
.opt.ok .lt{background:var(--ok);color:#fff}
.opt.no{border-color:var(--bad);background:#f8e8e5;color:#6d2a22}
.opt.no .lt{background:var(--bad);color:#fff}
.opt:disabled{cursor:default}
.fb{margin-top:10px;font-size:.95rem}
.fb.good{color:var(--ok)}
.fb.bad{color:var(--bad)}
.fb .ex{color:var(--ink);display:block;margin-top:4px}
.next{margin-top:12px;background:var(--accent);color:#fff;border:none;border-radius:8px;padding:9px 16px;font-weight:600}
.next:hover{background:var(--accent-d)}
.next:focus-visible{outline:3px solid var(--gold);outline-offset:2px}

/* tanári mód */
.tbar{display:none;flex-wrap:wrap;gap:8px;align-items:center;background:#f6ecd0;border:1px dashed var(--gold);border-radius:8px;padding:8px 12px;margin:0 0 12px}
body.teacher .tbar{display:flex}
.tbar .tb{background:#fff;border:1px solid #bfa66a;border-radius:6px;padding:5px 12px;font-size:.9rem}
.tbar .tb:hover{background:#fbf1d6}
.tbar span{font-size:.85rem;color:var(--muted)}
.ed{display:none;margin-top:14px;border:1px dashed var(--gold);border-radius:8px;padding:10px 12px;background:#fdf6e3}
body.teacher .ed{display:block}
.ed summary{font-weight:700;cursor:pointer}
.ed label{display:block;font-size:.85rem;font-weight:600;margin:8px 0 2px}
.ed input[type=text],.ed textarea{width:100%;border:1px solid #c9b88c;border-radius:6px;padding:6px 8px;background:#fff}
.ed .orow{display:flex;gap:6px;align-items:center;margin-bottom:4px}
.ed .orow input[type=text]{flex:1}
.ed .del{margin-top:10px;background:#fff;border:1px solid var(--bad);color:var(--bad);border-radius:6px;padding:5px 12px}

/* összegzés */
dialog{border:none;border-radius:12px;max-width:640px;width:calc(100% - 32px);padding:0;background:var(--card);color:var(--ink);box-shadow:0 20px 60px rgba(0,0,0,.4)}
dialog::backdrop{background:rgba(20,15,8,.6)}
.dlg{padding:22px}
.dlg h2{font-size:1.4rem;color:var(--accent-d);margin-bottom:10px}
.dlg table{width:100%;border-collapse:collapse;margin:10px 0 14px}
.dlg th,.dlg td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);font-size:.95rem}
.dlg td.n,.dlg th.n{text-align:right;white-space:nowrap}
.dlg tfoot td{font-weight:700;border-top:2px solid var(--ink);border-bottom:none}
.dlg .row{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.dlg .row input{flex:1 1 200px;border:1px solid #c9b88c;border-radius:6px;padding:7px 10px}
.dlg button.pr{background:var(--accent);color:#fff;border:none;border-radius:8px;padding:8px 16px;font-weight:600}
.dlg button.sc{background:#fff;border:1px solid #bfa66a;border-radius:8px;padding:8px 16px}
.dlg ol{padding-left:1.3em;margin:6px 0}
.cp{font-size:.9rem;color:var(--ok);min-height:1.4em;margin-top:6px}

footer{max-width:1400px;margin:0 auto;padding:0 20px 28px;font-size:.84rem;color:var(--muted)}
footer p{margin:4px 0}
noscript{display:block;padding:20px;background:#fff3cd}
</style>
</head>

efektetéseket, és hiteleket is nyújtott a vesztes országnak.\nAz amerikai pénz így Németországba áramlott, onnan jóvátétel formájában az antanthoz, majd törlesztésként vissza az Egyesült Államokba: ez a hitelkörforgás.", "ref": "154. o.", "q": {"text": "Mi volt a Dawes-terv lényege?", "options": ["Amerikai befektetések és hitelek Németországnak, hogy a német gazdaság képes legyen jóvátételt fizetni.", "A jóvátétel teljes eltörlése.", "Német hitelek folyósítása az Egyesült Államoknak."], "correct": 0, "expl": "A terv ösztönözte a németországi befektetéseket, és hiteleket nyújtott a vesztes országnak."}}, {"id": "nemet", "x": 0, "y": 0, "title": "Németország és a teljesítési politika", "info": "A békeszerződések csak a jóvátétel első összegét tartalmazták. A vesztes Németország képtelen volt fizetni, mire Franciaország újabb német területeket szállt meg.\nA győztesekkel együttműködő Gustav Stresemann német külügyminiszter nevéhez köthető az úgynevezett teljesítési politika.", "ref": "154. o.", "q": {"text": "Mi volt a teljesítési politika célja?", "options": ["Németország pontosan teljesítette a békefeltételeket (köztük a jóvátételt), hogy elérje az ország egyenjogúsítását.", "A békefeltételek nyílt megtagadása.", "Katonai szövetség kötése az antanttal."], "correct": 0, "expl": "Az egyenjogúsítás jele volt például, hogy Németországot felvették a Népszövetségbe."}}, {"id": "jovatetel", "x": 0, "y": 0, "title": "A jóvátétel", "info": "A győztesek a vesztesekre kiszabott jóvátételek összegéből akarták rendezni az Egyesült Államokkal szembeni tartozásukat.\nA békeszerződések azonban csak a jóvátétel első összegét tartalmazták, a teljes összeget később tervezték meghatározni.", "ref": "154. o.", "q": {"text": "Mit tartalmaztak a békeszerződések a jóvátételről?", "options": ["Csak az első összeget; a teljes összeget később kívánták meghatározni.", "A teljes összeget és a fizetés pontos ütemezését.", "Semmit: a jóvátétel kérdését teljesen figyelmen kívül hagyták."], "correct": 0, "expl": "A békeszerződések csak a jóvátétel első összegét tartalmazták."}}, {"id": "antant", "x": 0, "y": 0, "title": "Nagy-Britannia és Franciaország", "info": "A háborús költségek fedezésére az antant a washingtoni kormányzattól vett fel hiteleket, a központi hatalmak ezzel szemben inkább saját lakosságuktól.\nA győztes országok így jelentős tartozást halmoztak fel az Egyesült Államokkal szemben.", "ref": "154. o.", "q": {"text": "Kitől vett fel hiteleket háborús költségeinek fedezésére az antant?", "options": ["A washingtoni kormányzattól.", "Elsősorban a saját lakosságától (ez a központi hatalmakra volt jellemző).", "Németországtól."], "correct": 0, "expl": "Az antant a washingtoni kormányzattól, a központi hatalmak inkább saját lakosságuktól vettek fel hiteleket."}}, {"id": "torlesztes", "x": 0, "y": 0, "title": "Törlesztés és a körbetartozás veszélye", "info": "A pénz körbejár: az Egyesült Államok hitelez Németországnak, Németország jóvátételt fizet, az antant ebből törleszt az Egyesült Államoknak. A terv logikája szerint a rendszer addig működik, amíg a hitelek áramlanak és a német gazdaság növekszik.\nA körbetartozások miatt 1931-re szinte teljesen leállt a nemzetközi hitelezés, és a német bankrendszer is összeomlott.", "ref": "154. és 157. o.", "q": {"text": "Miért veszélyes jelenség a körbetartozás?", "options": ["Ha a hitelezés valahol megakad, az egész láncolat összeomolhat.", "Mert a tartozások a körbeforgás miatt automatikusan megszűnnek.", "Mert csak az Egyesült Államokat érinti, a többi országot nem."], "correct": 0, "expl": "A körbetartozások miatt 1931-re szinte teljesen leállt a nemzetközi hitelezés."}}, {"id": "young", "x": 0, "y": 0, "title": "A Young-terv (1929) és a jóvátétel vége", "info": "A Dawes-terv csak öt évre rögzítette a jóvátételi összegeket, ezért 1929-ben újabb jóvátételi konferenciát rendeztek: ekkor készült el a Young-terv. Ez lehűtötte az enyhülő politikai légkört, mert mintegy hatvan évben határozta meg a jóvátétel-fizetés időtartamát.\nA valóságban az abban az évben kitört világválság elsöpörte a jóvátételi kérdést.", "ref": "154. o.", "q": {"text": "Mi lett a jóvátételi tartozásokkal a világválság idején?", "options": ["1932-ben ideiglenesen eltörölték a volt vesztesek tartozásait.", "Németország 1932-re kifizette a teljes összeget.", "A Young-terv szerinti hatvan éves fizetést zökkenőmentesen teljesítették."], "correct": 0, "expl": "A világválság elsöpörte a jóvátételi kérdést, 1932-ben ideiglenesen eltörölték a volt vesztesek tartozásait."}}]}, {"id": "tozsde", "type": "image", "tab": "A tőzsde", "title": "A tőzsde és a pénzügyi összeomlás – fényképelemzés", "intro": "Vizsgálja meg a fényképet! Kattintson a számozott pontokra: minden pont a világválság kibontakozásának egy lépését mutatja, a kérdések a tankönyv 156–157. oldalán alapulnak.", "caption": "Tőzsdei kereskedési csarnok (fénykép). Forrás és keletkezési idő: a tanár által feltöltött felvétel – használat előtt ellenőrzendő.", "alt": "Zsúfolt tőzsdei kereskedési csarnok felülnézetből, fekete-fehér fénykép, öltönyös férfiak tömege a kereskedési pultok körül.", "image": "data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAQDAwQDAwQEBAQFBQQFBwsHBwYGBw4KCggLEA4RERAOEA8SFBoWEhMYEw8QFh8XGBsbHR0dERYgIh8cIhocHRz/wAALCAObBMQBAREA/8QAHQAAAQUBAQEBAAAAAAAAAAAABgMEBQcIAgEACf/EAFAQAAEDAwIEBAQEAgkBBwIADwIBAwQABREGEgcTITEiMkFRFEJhcQgjUoEVkRYkM2JyobHB0eEXNEOCkqLwJVPxssLSGCZEY3PiJ1Q1dPL/2gAIAQEAAD8AryS0QmJ9laPCrjr96lo76Wx2POXDh56IS+GuZE1y43CO7IjtthjGRXP2qCvAchwRcLYZF4EHr/nSjjMQbcxkUNTRfShh0WRUTUlDavVRTNSNqYjNS9yIm76dutO5rACgui0aiXRSBV79qm7Vezt2m34sU0B8HFVCwu4fpmq3uDpzZjrs501Mu/XO5amrMM6Gw3Ji7E3L0REz/Ol9QXuTdrjDuaR0bmRETftDwmqdlodduz1xkPSZbqvPGaKufloqt+oIAOCFzbMGATy46mmKat6vibJTDdrbYbdzyyDzD96go9mO5ED4MqjecGuKeXjT7NriC80fR3ov6f2qKgR3pRkIuqjfhRXU67Kn37lMgQntPI2T0YnuYh7F3LQ1CdO3XQHW8A7HPeBfpqfa1DceavwjznMe6uKHqq1ATAZLnk8SuPZ9+33ppDaEjQ0a3ACpv/TRndpkOVE2tiHhT0XG3p1ptpJpmafIV5GwePBkS0e3HgwzKZRIMlc5Vdh9qrZti5aSkTIbhK3v/LMflNKYGCOIBIWUzhPolc zővé tette a részvényvásárlást.", "Megszűnt a bankbetétek kamata."], "correct": 0, "expl": "Az optimista várakozás önmagában is felhajtotta az árakat, ami még jobban megerősítette a várakozásokat."}}, {"id": "arfolyam", "x": 56.5, "y": 24, "title": "Emelkedő árfolyamok", "info": "A bővülő kereslet a részvényekre önmagában is felhajtotta azok árát, ami még jobban megerősítette az optimista várakozásokat. 1928–1929-ben a New York-i tőzsdén a részvények ára 20 hónap alatt megduplázódott.", "ref": "156. o.", "q": {"text": "Hogyan változtak a részvényárak a New York-i tőzsdén 1928–1929-ben?", "options": ["20 hónap alatt megduplázódtak.", "20 hónap alatt a felére estek.", "Alig változtak."], "correct": 0, "expl": "A részvények ára 20 hónap alatt megduplázódott."}}, {"id": "nyereseg", "x": 18, "y": 6, "title": "Elmaradó nyereség", "info": "A fogyasztás – főleg Európában – nem bővült a befektetésekkel azonos mértékben, ezért az egyre több termék értékesítése egyre nagyobb nehézségbe ütközött.\nA vállalatok nyeresége elmaradt, az osztalék hiánya miatt pedig megcsappant a részvények iránti kereslet. A részvényárak csökkenni kezdtek.", "ref": "156. o.", "q": {"text": "Miért kezdtek csökkenni a részvényárak?", "options": ["A vállalatok nyeresége elmaradt, osztalék hiányában megcsappant a részvények iránti kereslet.", "A kormány magas adót vetett ki a részvényekre.", "Túl kevés vállalat bocsátott ki részvényt."], "correct": 0, "expl": "A nyereség és az osztalék elmaradása szétfeszítette az optimista várakozásokat."}}, {"id": "panik", "x": 23.5, "y": 55.8, "title": "Tőzsdepánik", "info": "A részvényárak csökkenésekor egyre többen akartak megszabadulni tévedésnek tűnő befektetésüktől. A tőzsdei buborék kipukkant, tőzsdepánik tört ki: az eladások miatt a részvények ára zuhanni kezdett.", "ref": "156. o.", "q": {"text": "Miért zuhant tovább a részvények ára a tőzsdepánikban?", "options": ["Egyre többen akartak megszabadulni a részvényeiktől, és az eladások lenyomták az árakat.", "A tőzsdét a kormány ideiglenesen bezárta.", "A vállalatok hirtelen nagy osztalékot kezdtek fizetni."], "correct": 0, "expl": "A tőzsdei buborék kipukkant: az eladások miatt a részvények ára zuhanni kezdett."}}, {"id": "fekete", "x": 49, "y": 55, "title": "„Fekete kedd”", "info": "A New York-i tőzsde 1929. október 29-én, az úgynevezett „fekete kedden” összeomlott, az árfolyamok egy hét alatt átlagosan 40%-ot estek.", "ref": "156. o.", "q": {"text": "Mikor omlott össze a New York-i tőzsde („fekete kedd”)?", "options": ["1929. október 29-én.", "1924. október 29-én.", "1932. október 29-én."], "correct": 0, "expl": "Az árfolyamok egy hét alatt átlagosan 40%-ot estek."}}, {"id": "bank", "x": 84, "y": 76, "title": "Bankpánik", "info": "Az emberek attól tartottak, hogy a részvényárak zuhanása tönkreteszi a bankokat is, mivel azok a betétek pénzének egy részét részvényekbe fektették. A betétesek ki akarták venni megtakarításaikat, de a bankok a pénzt továbbhitelezték vagy befektették, ezért azt egyszerre nem tudták visszafizetni.\nA bankpánik következtében 10 ezer kisebb-nagyobb bank vált fizetésképtelenné, vagyis csődbe ment.", "ref": "156. o.", "q": {"text": "Miért nem tudták a bankok egyszerre kifizetni a betéteseket?", "options": ["A betétek pénzét továbbhitelezték vagy befektették (részben részvényekbe), ezért nem volt azonnal kifizethető.", "A kormány 1929-ben megtiltotta a készpénzkifizetést.", "A betétesek mind külföldi pénznemben kérték a pénzüket."], "correct": 0, "expl": "A bankok feladata a betétek továbbhitelezése vagy befektetése, nem a készenlétben tartása."}}, {"id": "kovetkezmeny", "x": 39, "y": 93, "title": "A válság következményei", "info": "A bankrendszer és a külkereskedelem összeomlása megbénította a termelést és a kereskedelmet. A termelés és a hitelezés leállása miatt a fizetésképtelen üzemeknek rengeteg embert el kellett bocsátaniuk, és csökkentették a fizetéseket is.\nAz Egyesült Államokban a munkanélküliek száma 1,5 millióról 13 millióra emelkedett, a nemzeti össztermék értéke rövid időn belül 45%-kal zuhant.", "ref": "157. o.", "q": {"text": "Hogyan változott az Egyesült Államokban a munkanélküliek száma a válság hatására?", "options": ["1,5 millióról 13 millióra nőtt.", "13 millióról 1,5 millióra csökkent.", "Alig változott, mert a leépítettek új munkát kaptak."], "correct": 0, "expl": "A munkanélküliek aránya a foglalkoztatottak negyedét is elérte."}}, {"id": "forras", "x": 91, "y": 52.5, "title": "Forráskritika: mit bizonyít a fénykép?", "info": "A felvétel egy zsúfolt tőzsdei kereskedési csarnokot ábrázol. A képen nincs képaláírás, ezért a keletkezésének pontos ideje és helyszíne a kép alapján nem állapítható meg. A tömegben egyenruhát viselő alak is látható, ami a datálás szempontjából óvatosságra int.\nForráskritikai alapszabály: mielőtt a fényképet a „fekete kedd” bizonyítékaként használjuk, ellenőrizni kell a forrását.", "ref": "Forráskritikai megjegyzés (nem tankönyvi adat)", "q": {"text": "Mit kell megvizsgálni, mielőtt a fényképet 1929 októberének bizonyítékaként használjuk?", "options": ["A kép eredetét: ki, mikor és hol készítette, van-e hiteles képaláírás vagy levéltári adat.", "Elegendő, hogy a kép tőzsdét ábrázol.", "Csak azt, hogy hány ember látható rajta."], "correct": 0, "expl": "A tőzsdei csarnokok külseje a korszakban hasonló volt, ezért egy tőzsdekép önmagában nem datálható."}}]}, {"id": "okok", "type": "svg", "builder": "okok", "tab": "Okok láncolata", "title": "A világválság okai – ok-okozati lánc", "intro": "Az ábra a világválság okainak láncolatát mutatja. Kattintson a számozott mezőkre, és magyarázza meg, hogyan vezetett egyik tényező a másikhoz.", "caption": "Ábra a tankönyv „A világválság okai” sémája alapján (156. o.).", "points": [{"id": "haboru", "x": 0, "y": 0, "title": "Háború és forradalmak", "info": "A világháború következtében Európa gazdasági válsággal küzdött. Külső piacait a hadigazdaság idején jórészt az Amerikai Egyesült Államok vette át.\nA tankönyv ábrája szerint a háború és a forradalmak indították el azt a folyamatot, amely a túltermelési válsághoz vezetett.", "ref": "154. és 156. o.", "q": {"text": "Mi történt Európa külső piacaival a háború idején?", "options": ["Jórészt az Amerikai Egyesült Államok vette át őket.", "Európa a háború alatt új piacokat hódított meg.", "A piacok érintetlenek maradtak."], "correct": 0, "expl": "Európa gazdasági válsággal küzdött, külső piacait az USA vette át."}}, {"id": "usa", "x": 0, "y": 0, "title": "Egyedül az USA-ban jelentős a fellendülés", "info": "A világ ipari termelésének megoszlása: az Egyesült Államok részesedése 1900-ban 23,6%, 1913-ban 32,0%, 1928-ban 39,3% volt. Ezzel szemben Nagy-Britannia aránya 18,5%-ról 9,9%-ra csökkent.", "ref": "156. o. (adatsor)", "q": {"text": "Hány százalékát adta az Egyesült Államok a világ ipari termelésének 1928-ban?", "options": ["39,3%-át.", "23,6%-át.", "32,0%-át."], "correct": 0, "expl": "Az adatsor szerint 1900 és 1928 között az USA részesedése folyamatosan nőtt."}}, {"id": "eletszinvonal", "x": 0, "y": 0, "title": "Alacsonyabb életszínvonal Európában", "info": "Az európai lakosságot a háború és az infláció szegényítette el. Így az egyre több termék értékesítése egyre nagyobb nehézségbe ütközött: nem volt elegendő fizetőképes kereslet.", "ref": "156. o.", "q": {"text": "Miért volt nehéz az áruk értékesítése Európában?", "options": ["A lakosságot a háború és az infláció elszegényítette, ezért csökkent a fizetőképes kereslet.", "Mert Európában megszűnt az ipari termelés.", "Mert a lakosság tömegesen külföldre vándorolt."], "correct": 0, "expl": "Az elszegényedett lakosság nem tudta felvásárolni a termékeket."}}, {"id": "gyarmat", "x": 0, "y": 0, "title": "A gyarmati termelés bővülése", "info": "A háború idején az európai termékek eltűnésével a gyarmatok saját ipari termelése növekedett. Az európai gyártók így újabb piacokat veszítettek.", "ref": "156. o.", "q": {"text": "Mi történt a gyarmatok ipari termelésével a háború idején?", "options": ["Növekedett, mert az európai termékek eltűntek a piacról.", "Csökkent, mert a gyarmatokat elszigetelték.", "Nem változott."], "correct": 0, "expl": "A gyarmati termelés bővülése tovább szűkítette az európai gyártók piacát."}}, {"id": "szovjet", "x": 0, "y": 0, "title": "A Szovjetunió létrejötte", "info": "A Szovjetunió elzárkózott a világpiactól, így ez a nagy kiterjedésű terület kiesett a nemzetközi kereskedelemből. Oroszország/Szovjetunió részesedése a világ ipari termeléséből 8,8%-ról (1900) 5,3%-ra (1928) csökkent.", "ref": "156. o.", "q": {"text": "Hogyan hatott a Szovjetunió létrejötte a világpiacra?", "options": ["Elzárkózott a világpiactól, így a piac tovább szűkült.", "Új, nagy felvevőpiacot nyitott a nyugati áruknak.", "A világkereskedelem fellendülését okozta."], "correct": 0, "expl": "A Szovjetunió elzárkózása hozzájárult a piac beszűküléséhez."}}, {"id": "beruhazas", "x": 0, "y": 0, "title": "Túlzott beruházások", "info": "Az Egyesült Államokban befektetési láz uralkodott, a részvényárak 20 hónap alatt megduplázódtak. A fogyasztás azonban – főleg Európában – nem bővült a befektetésekkel azonos mértékben.", "ref": "156. o.", "q": {"text": "Mi volt a probléma a beruházások és a fogyasztás viszonyával?", "options": ["A fogyasztás nem bővült a befektetésekkel azonos mértékben.", "A fogyasztás gyorsabban nőtt, mint a beruházások.", "A beruházások teljesen leálltak."], "correct": 0, "expl": "A túlzott beruházások túlkínálatot hoztak létre."}}, {"id": "piac", "x": 0, "y": 0, "title": "A piac beszűkülése", "info": "Az alacsonyabb európai életszínvonal, a gyarmati termelés bővülése és a Szovjetunió elzárkózása együtt a piac beszűkülését okozta. Ez és a túlzott beruházások vezettek a túltermelési válsághoz.", "ref": "156. o.", "q": {"text": "Mely tényezők együtt vezettek a piac beszűküléséhez?", "options": ["Az alacsonyabb európai életszínvonal, a gyarmati termelés bővülése és a Szovjetunió elzárkózása.", "A jóvátétel eltörlése és a Young-terv.", "A New Deal beruházásai és a bérminimum."], "correct": 0, "expl": "A piac beszűkülése és a túlzott beruházások együtt idézték elő a túltermelési válságot."}}, {"id": "tultermeles", "x": 0, "y": 0, "title": "Túltermelési válság", "info": "A túltermelési válság azt jelenti, hogy a gazdaság több árut állított elő, mint amennyit a fizetőképes kereslet fel tudott venni. A vállalatok nyeresége elmaradt, az osztalék hiánya miatt megcsappant a részvények iránti kereslet, és a folyamat a tőzsdei összeomláshoz vezetett.", "ref": "156. o.", "q": {"text": "Mit jelent a túltermelési válság?", "options": ["Több árut állítottak elő, mint amennyit a fizetőképes kereslet fel tudott venni.", "Túl kevés árut állítottak elő a kereslethez képest.", "A termelés a háború miatt teljesen leállt."], "correct": 0, "expl": "A túltermelési válság a tőzsdei összeomlás egyik előzménye volt."}}]}, {"id": "adatok", "type": "chart", "builder": "chart", "tab": "Adatok", "title": "Munkanélküliség és nemzeti jövedelem az USA-ban, 1929–1944", "intro": "A grafikon az Egyesült Államok munkanélküliségét (a munkaképes népesség arányában) és nemzeti jövedelmét mutatja. Kattintson a színezett évekre: az adatok elemzése után kérdések következnek.", "caption": "Adatok: a tankönyv „A munkanélküliség és a nemzeti jövedelem alakulása az Egyesült Államokban” táblázata (159. o.).", "data": [{"y": 1929, "ue": 3.2, "ni": 822}, {"y": 1930, "ue": 8.7, "ni": 750}, {"y": 1931, "ue": 15.9, "ni": 692}, {"y": 1932, "ue": 23.6, "ni": 600}, {"y": 1933, "ue": 24.9, "ni": 587}, {"y": 1934, "ue": 21.7, "ni": 633}, {"y": 1935, "ue": 20.1, "ni": 681}, {"y": 1936, "ue": 16.9, "ni": 778}, {"y": 1937, "ue": 14.3, "ni": 811}, {"y": 1938, "ue": 19.8, "ni": 779}, {"y": 1939, "ue": 17.2, "ni": 841}, {"y": 1940, "ue": 14.6, "ni": 906}, {"y": 1941, "ue": 9.9, "ni": 1071}, {"y": 1942, "ue": 4.7, "ni": 1285}, {"y": 1943, "ue": 1.9, "ni": 1541}, {"y": 1944, "ue": 1.2, "ni": 1670}], "points": [{"id": "y1929", "x": 0, "y": 0, "title": "1929 – A tőzsdekrach éve", "info": "1929 októberében összeomlott a New York-i tőzsde. A munkanélküliség ekkor még alacsony volt, a nemzeti jövedelem a vizsgált időszak elejéhez képest magas.", "ref": "156. és 159. o.", "q": {"text": "Mi jellemezte az amerikai gazdaságot 1929-ben az adatsor szerint?", "options": ["Alacsony munkanélküliség (3,2%) és 822 milliárd dolláros nemzeti jövedelem.", "Már ekkor 20% fölötti munkanélküliség.", "A nemzeti jövedelem mélypontja."], "correct": 0, "expl": "Az adatsor szerint a munkanélküliség már 1930-ban 8,7%-ra, 1933-ra pedig 24,9%-ra nőtt."}}, {"id": "y1930", "x": 0, "y": 0, "title": "1930", "info": "Ehhez az évhez nem tartozik kérdés. Hasonlítsa össze az értékeket az előző évvel, és keresse az okokat a tankönyv szövegében. A kérdésekhez kattintson a színezett (kiemelt) évekre.", "ref": "159. o. (adatsor)", "q": null}, {"id": "y1931", "x": 0, "y": 0, "title": "1931 – A nemzetközi hitelezés leállása", "info": "1931-re szinte teljesen leállt a nemzetközi hitelezés. Ennek következtében a német bankrendszer is összeomlott, a banki ügyleteket felfüggesztették. Az Egyesült Államokban a munkanélküliség ekkorra 15,9%-ra nőtt.", "ref": "157. o.", "q": {"text": "Mi jellemezte a nemzetközi pénzügyi rendszert 1931-re?", "options": ["A nemzetközi hitelezés szinte teljesen leállt, a német bankrendszer összeomlott.", "A jóvátételi tartozásokat végleg kifizették.", "A nemzetközi hitelezés a korábbinál gyorsabban bővült."], "correct": 0, "expl": "A körbetartozások miatt leállt a nemzetközi hitelezés."}}, {"id": "y1932", "x": 0, "y": 0, "title": "1932", "info": "Ehhez az évhez nem tartozik kérdés. Hasonlítsa össze az értékeket az előző évvel, és keresse az okokat a tankönyv szövegében. A kérdésekhez kattintson a színezett (kiemelt) évekre.", "ref": "159. o. (adatsor)", "q": null}, {"id": "y1933", "x": 0, "y": 0, "title": "1933 – A mélypont", "info": "A munkanélküliség elérte a csúcsát (24,9%), a nemzeti jövedelem pedig mélypontra süllyedt (587 milliárd dollár).\nA New Deal inté rdésekhez kattintson a színezett (kiemelt) évekre.", "ref": "159. o. (adatsor)", "q": null}, {"id": "y1938", "x": 0, "y": 0, "title": "1938 – Visszaesés a javuló trendben", "info": "A munkanélküliség 1937-ben 14,3%-ra csökkent, majd 1938-ban ismét 19,8%-ra nőtt. A nemzeti jövedelem ugyanezen idő alatt 811-ről 779 milliárd dollárra esett.", "ref": "159. o. (adatsor)", "q": {"text": "Mit olvashatunk ki az 1937–1938-as adatokból?", "options": ["A munkanélküliség ismét nőtt, a nemzeti jövedelem csökkent: a javulás nem volt zökkenőmentes.", "A munkanélküliség és a nemzeti jövedelem egyaránt tovább javult.", "A munkanélküliség megszűnt."], "correct": 0, "expl": "Az adatsor alapján a fellendülés 1937–1938-ban megtört."}}, {"id": "y1939", "x": 0, "y": 0, "title": "1939", "info": "Ehhez az évhez nem tartozik kérdés. Hasonlítsa össze az értékeket az előző évvel, és keresse az okokat a tankönyv szövegében. A kérdésekhez kattintson a színezett (kiemelt) évekre.", "ref": "159. o. (adatsor)", "q": null}, {"id": "y1940", "x": 0, "y": 0, "title": "1940", "info": "Ehhez az évhez nem tartozik kérdés. Hasonlítsa össze az értékeket az előző évvel, és keresse az okokat a tankönyv szövegében. A kérdésekhez kattintson a színezett (kiemelt) évekre.", "ref": "159. o. (adatsor)", "q": null}, {"id": "y1941", "x": 0, "y": 0, "title": "1941 – A valódi fellendülés", "info": "A New Deal jelentősége elsősorban abban állt, hogy bebizonyította: demokratikus keretek között is ki lehet lábalni a válságból. A valódi fellendülést azonban a tankönyv szerint csak a második világháború kitörése hozta el, amikor az Egyesült Államok termelése a fegyvergyártás és -eladás révén látványosan megugrott.", "ref": "159. o.", "q": {"text": "A tankönyv szerint mi hozta el a valódi fellendülést?", "options": ["A második világháború kitörése: a fegyvergyártás és -eladás révén megugrott a termelés.", "A jóvátételi fizetések újraindítása.", "A Young-terv elfogadása."], "correct": 0, "expl": "A háború a tankönyv szerint a <script>
(function(){
'use strict';

/* ================= adatok és segédfüggvények ================= */
var CFG = JSON.parse(document.getElementById('cfg').textContent);
var $ = function(s, r){ return (r||document).querySelector(s); };
var $$ = function(s, r){ return Array.prototype.slice.call((r||document).querySelectorAll(s)); };
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
function paras(t){ return String(t||'').split(/\n+/).filter(Boolean).map(function(p){return '<p>'+esc(p)+'</p>';}).join(''); }
function fmt(v){ return String(v).replace('.',','); }
var LETTERS = ['A','B','C','D'];
var S = { scene:0, sel:null, teacher:false, res:{}, suppress:false };

function scene(){ return CFG.scenes[S.scene]; }
function key(sc,p){ return sc.id+'/'+p.id; }
function pt(sc,id){ for(var i=0;i<sc.points.length;i++){ if(sc.points[i].id===id) return sc.points[i]; } return null; }
function num(sc,id){ for(var i=0;i<sc.points.length;i++){ if(sc.points[i].id===id) return i+1; } return '?'; }
function hasQ(p){ return !!(p.q && p.q.text && p.q.options && p.q.options.length>=2); }
function R(sc,p){ var k=key(sc,p); if(!S.res[k]) S.res[k]={done:false,first:false,tries:0,wrong:[],order:null}; return S.res[k]; }
function shuffle(n){ var a=[],i,j,t; for(i=0;i<n;i++) a.push(i); for(i=n-1;i>0;i--){ j=Math.floor(Math.random()*(i+1)); t=a[i];a[i]=a[j];a[j]=t; } return a; }
function sceneStats(sc){
  var total=0, done=0, first=0;
  sc.points.forEach(function(p){ if(hasQ(p)){ total++; var r=S.res[key(sc,p)]; if(r&&r.done){ done++; if(r.first) first++; } } });
  return {total:total, done:done, first:first};
}
function allStats(){
  var t={total:0,done:0,first:0};
  CFG.scenes.forEach(function(sc){ var s=sceneStats(sc); t.total+=s.total; t.done+=s.done; t.first+=s.first; });
  return t;
}

/* ================= SVG szerkesztők ================= */
function badge(x,y,n){ return '<g class="badge" transform="translate('+x+','+y+')"><circle r="14"/><text>'+n+'</text></g>'; }
function svgNode(sc,id,x,y,w,h,fill,lines,light){
  var n=num(sc,id), cy=y+h/2, out='';
  out+='<g class="hs-svg" data-pt="'+id+'" tabindex="0" role="button" aria-label="'+n+'. pont">';
  out+='<rect class="shape" x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" rx="14" fill="'+fill+'"/>';
  lines.forEach(function(t,i){ out+='<text class="nl'+(light?' light':'')+'" x="'+(x+w/2)+'" y="'+(cy+(i-(lines.length-1)/2)*22)+'">'+esc(t)+'</text>'; });
  out+=badge(x+6,y+6,n)+'</g>';
  return out;
}
function svgChip(sc,id,x,y){
  var n=num(sc,id);
  return '<g class="hs-svg" data-pt="'+id+'" tabindex="0" role="button" aria-label="'+n+'. pont"><circle class="shape" cx="'+x+'" cy="'+y+'" r="20" fill="#fff"/>'+badge(x,y,n)+'</g>';
}
var DEFS = function(id){ return '<defs><marker id="'+id+'" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#8a8070"/></marker></defs>'; };
function arrow(d,id){ return '<path d="'+d+'" fill="none" stroke="#8a8070" stroke-width="6" stroke-linecap="round" marker-end="url(#'+id+')"/>'; }

var BUILD = {
  dawes: function(sc){
    var A='arD', o='<svg viewBox="0 0 900 520" role="group" aria-label="A Dawes-terv hitelkörforgásának sémája">'+DEFS(A);
    o+='<rect x="0" y="0" width="900" height="520" fill="#fbf1e2"/>';
    o+=arrow('M254,260 L636,260',A);
    o+=arrow('M730,190 C730,100 640,82 540,86',A);
    o+=arrow('M730,330 C730,420 640,398 540,394',A);
    o+=arrow('M334,80 C250,80 190,110 160,184',A);
    o+=arrow('M334,400 C250,400 190,374 160,326',A);
    o+=svgNode(sc,'usa',40,190,210,140,'#a9c1e0',['Amerikai','Egyesült Államok']);
    o+=svgNode(sc,'antant',335,36,200,100,'#e3a39a',['Nagy-Britannia']);
    o+=svgNode(sc,'antant',335,344,200,100,'#ecc572',['Franciaország']);
    o+=svgNode(sc,'nemet',650,190,210,140,'#a9cfa3',['Németország']);
    o+=svgChip(sc,'hitel',445,260);
    o+='<text class="al" x="445" y="228">hitel és befektetés</text>';
    o+=svgChip(sc,'jovatetel',672,104);
    o+='<text class="al" x="690" y="64">jóvátétel</text>';
    o+=svgChip(sc,'jovatetel',672,396);
    o+='<text class="al" x="690" y="440">jóvátétel</text>';
    o+=svgChip(sc,'torlesztes',228,106);
    o+='<text class="al" x="200" y="62">törlesztés</text>';
    o+=svgChip(sc,'torlesztes',228,376);
    o+='<text class="al" x="190" y="432">törlesztés</text>';
    o+=svgNode(sc,'young',40,458,210,50,'#e8dcc3',['Young-terv (1929)']);
    o+='<text class="note" x="560" y="492">A hitelkörforgás: az USA hitelez, Németország jóvátételt fizet, az antant törleszt.</text>';
    return o+'</svg>';
  },
  okok: function(sc){
    var A='arO', o='<svg viewBox="0 0 900 520" role="group" aria-label="A világválság okainak láncolata">'+DEFS(A);
    o+='<rect x="0" y="0" width="900" height="520" fill="#fbf6ec"/>';
    [120,340,560,780].forEach(function(cx){ o+=arrow('M450,78 C450,105 '+cx+',100 '+cx+',126',A); });
    o+=arrow('M120,210 L120,274',A);
    o+=arrow('M340,210 C340,245 420,245 420,274',A);
    o+=arrow('M560,210 C560,240 480,245 480,274',A);
    o+=arrow('M780,210 C780,250 560,235 530,276',A);
    o+=arrow('M120,344 C120,440 220,462 322,462',A);
    o+=arrow('M450,344 L450,424',A);
    o+=svgNode(sc,'haboru',300,20,300,58,'#e8dcc3',['Háború és forradalmak']);
    o+=svgNode(sc,'usa',25,130,190,80,'#cfdcec',['Egyedül az USA-ban','jelentős a fellendülés']);
    o+=svgNode(sc,'eletszinvonal',245,130,190,80,'#ecd4cf',['Alacsonyabb','életszínvonal']);
    o+=svgNode(sc,'gyarmat',465,130,190,80,'#f0e3b8',['A gyarmati termelés','bővülése']);
    o+=svgNode(sc,'szovjet',685,130,190,80,'#e6d3d3',['A Szovjetunió','létrejötte']);
    o+=svgNode(sc,'beruhazas',25,280,190,64,'#cfdcec',['Túlzott beruházások']);
    o+=svgNode(sc,'piac',355,280,190,64,'#e9dfc9',['A piac beszűkülése']);
    o+=svgNode(sc,'tultermeles',325,430,250,64,'#7a2e2e',['Túltermelési válság'],true);
    return o+'</svg>';
  },
  chart: function(sc){
    var D=sc.data, x0=90, dx=780/(D.length-1);
    function X(i){ return x0+i*dx; }
    function yU(v){ return 230-v/30*180; }
    function yN(v){ return 480-v/1800*170; }
    var o='<svg viewBox="0 0 900 540" role="group" aria-label="Munkanélküliség és nemzeti jövedelem grafikon">';
    o+='<rect x="0" y="0" width="900" height="540" fill="#fbf6ec"/>';
    o+='<text class="ttl" x="'+x0+'" y="30">Munkanélküliség (%)</text>';
    o+='<text class="ttl" x="'+x0+'" y="300">Nemzeti jövedelem (milliárd dollár)</text>';
    o+='<text class="tick" x="880" y="30" text-anchor="end">● kérdéses év (kattintson)   ○ további adatpont</text>';
    [0,10,20,30].forEach(function(v){ o+='<line class="axis" x1="72" x2="880" y1="'+yU(v)+'" y2="'+yU(v)+'"/><text class="tick" x="64" y="'+(yU(v)+4)+'" text-anchor="end">'+v+'</text>'; });
    [0,600,1200,1800].forEach(function(v){ o+='<line class="axis" x1="72" x2="880" y1="'+yN(v)+'" y2="'+yN(v)+'"/><text class="tick" x="64" y="'+(yN(v)+4)+'" text-anchor="end">'+v+'</text>'; });
    var pu=D.map(function(d,i){return X(i)+','+yU(d.ue);}).join(' ');
    var pn=D.map(function(d,i){return X(i)+','+yN(d.ni);}).join(' ');
    o+='<polyline class="line" stroke="#7a2e2e" points="'+pu+'"/>';
    o+='<polyline class="line" stroke="#2c5a7a" points="'+pn+'"/>';
    D.forEach(function(d,i){
      var id='y'+d.y, p=pt(sc,id), k=p&&hasQ(p), cx=X(i);
      o+='<g class="hs-svg" data-pt="'+id+'" tabindex="0" role="button" aria-label="'+d.y+'. év adatpont'+(k?', kérdéssel':'')+'">';
      o+='<rect class="band" x="'+(cx-26)+'" y="40" width="52" height="468"/>';
      o+='<circle class="hit" cx="'+cx+'" cy="'+yU(d.ue)+'" r="17"/><circle class="dot'+(k?' key':'')+'" cx="'+cx+'" cy="'+yU(d.ue)+'" r="'+(k?9:5.5)+'"/>';
      o+='<circle class="hit" cx="'+cx+'" cy="'+yN(d.ni)+'" r="17"/><circle class="dot'+(k?' key':'')+'" cx="'+cx+'" cy="'+yN(d.ni)+'" r="'+(k?9:5.5)+'"/>';
      o+='<text class="tick" x="'+cx+'" y="504" text-anchor="middle"'+(k?' style="font-weight:700"':'')+'>'+d.y+'</text>';
      o+='</g>';
    });
    return o+'</svg>';
  }
};

/* ================= felület felépítése ================= */
function shell(){
  var m=CFG.meta;
  $('#app').innerHTML =
    '<header class="top"><div><h1>'+esc(m.title)+'</h1><p class="sub">'+esc(m.subtitle)+'</p></div>'+
    '<div class="stat"><span class="pill" id="pScore"></span><span class="pill" id="pDone"></span><div class="bar" aria-hidden="true"><i id="pBar"></i></div>'+
    '<button class="btn" id="bSum" type="button">Összegzés</button>'+
    '<button class="btn" id="bTeach" type="button" aria-pressed="false">Tanári mód</button></div></header>'+
    '<nav class="tabs" id="tabs" aria-label="Feladatrészek"></nav>'+
    '<main><section class="sheet"><h2 id="sTitle"></h2><p class="intro" id="sIntro"></p>'+
    '<div class="tbar" id="tbar"></div>'+
    '<div class="layout"><div><div id="stage"></div><p class="caption" id="sCap"></p></div>'+
    '<aside class="panel" id="panel" aria-live="polite"></aside></div></section></main>'+
    '<footer><p>Forrás: '+esc(m.source)+'. A kérdések és információs szövegek a tankönyvi fejezet alapján készültek.</p>'+
    '<p>Pontozás: feladatonként 1 pont jár, ha a válasz elsőre helyes; hibás válasz után a feladat újra megoldható, de pont már nem jár érte.</p></footer>'+
    '<dialog id="dlg"></dialog>';
  $('#bSum').addEventListener('click', openSummary);
  $('#bTeach').addEventListener('click', toggleTeacher);
  $('#stage').addEventListener('click', onStageClick);
  $('#stage').addEventListener('keydown', function(e){
    if((e.key==='Enter'||e.key===' ') && e.target.classList && e.target.classList.contains('hs-svg')){ e.preventDefault(); select(e.target.getAttribute('data-pt')); }
  });
  initDrag();
}

function renderTabs(){
  var h='';
  CFG.scenes.forEach(function(sc,i){
    var s=sceneStats(sc);
    h+='<button class="tab" type="button" data-i="'+i+'"'+(i===S.scene?' aria-current="true"':'')+'>'+(i+1)+'. '+esc(sc.tab)+'<span class="tk">'+s.done+'/'+s.total+'</span></button>';
  });
  $('#tabs').innerHTML=h;
  $$('.tab').forEach(function(b){ b.addEventListener('click',function(){ S.scene=+b.getAttribute('data-i'); S.sel=null; renderScene(); }); });
}

function renderScene(){
  var sc=scene();
  $('#sTitle').textContent=sc.title;
  $('#sIntro').textContent=sc.intro;
  $('#sCap').textContent=sc.caption||'';
  var st=$('#stage');
  if(sc.type==='image'){
    var h='<div class="imgwrap" id="imgwrap"><img id="stageImg" src="'+esc(sc.image)+'" alt="'+esc(sc.alt||'')+'">';
    sc.points.forEach(function(p,i){ h+='<button type="button" class="hs" data-pt="'+esc(p.id)+'" style="left:'+p.x+'%;top:'+p.y+'%" aria-label="'+(i+1)+'. pont">'+(i+1)+'</button>'; });
    st.innerHTML=h+'</div>';
  } else {
    st.innerHTML='<div class="svgwrap">'+BUILD[sc.builder](sc)+'</div>';
  }
  renderTbar();
  renderTabs();
  updateMarks();
  renderPanel();
}

function renderTbar(){
  var sc=scene(), h='';
  if(sc.type==='image'){
    h+='<button class="tb" type="button" id="tbAdd">+ Új pont</button><button class="tb" type="button" id="tbImg">Kép cseréje…</button><input type="file" id="tbFile" accept="image/*" class="sr" tabindex="-1">';
    h+='<span>A pontok húzással áthelyezhetők; a szerkesztő a kiválasztott pont alatt jelenik meg.</span>';
  } else {
    h+='<span>Ennél a feladatnál az ábra elrendezése rögzített; a szövegek és kérdések a kiválasztott pont alatti szerkesztőben módosíthatók.</span>';
  }
  h+='<button class="tb" type="button" id="tbSave">Mentés új HTML-fájlként</button>';
  $('#tbar').innerHTML=h;
  $('#tbSave').addEventListener('click', exportHTML);
  if(sc.type==='image'){
    $('#tbAdd').addEventListener('click', addPoint);
    $('#tbImg').addEventListener('click', function(){ $('#tbFile').click(); });
    $('#tbFile').addEventListener('change', replaceImage);
  }
}

function updateMarks(){
  var sc=scene();
  $$('[data-pt]', $('#stage')).forEach(function(el){
    var p=pt(sc,el.getAttribute('data-pt')); if(!p) return;
    var r=S.res[key(sc,p)], done=!!(r&&r.done), sel=S.sel===p.id;
    el.classList.toggle('sel',sel); el.classList.toggle('done',done);
    if(el.classList.contains('hs')){
      el.textContent = done ? '✓' : String(num(sc,p.id));
      if(S.teacher) el.title=p.title; else el.removeAttribute('title');
    } else {
      var t=$('.badge text',el); if(t) t.textContent = done ? '✓' : String(num(sc,p.id));
    }
  });
  var a=allStats();
  $('#pScore').innerHTML='Pontszám: <b>'+a.first+' / '+a.total+'</b>';
  $('#pDone').innerHTML='Megoldva: <b>'+a.done+' / '+a.total+'</b>';
  $('#pBar').style.width=(a.total?Math.round(a.done/a.total*100):0)+'%';
  var tk=$$('.tab .tk'); CFG.scenes.forEach(function(s,i){ if(tk[i]){ var st=sceneStats(s); tk[i].textContent=st.done+'/'+st.total; } });
}

/* ================= pont kiválasztása és panel ================= */
function onStageClick(e){
  var el=e.target.closest ? e.target.closest('[data-pt]') : null;
  if(!el) return;
  if(S.suppress){ S.suppress=false; return; }
  select(el.getAttribute('data-pt'));
}
function select(id){
  S.sel=id; updateMarks(); renderPanel();
  if(window.matchMedia('(max-width:980px)').matches){
    var rm=window.matchMedia('(prefers-reduced-motion:reduce)').matches;
    $('#panel').scrollIntoView({behavior:rm?'auto':'smooth',block:'start'});
  }
}

function renderPanel(){
  var sc=scene(), p=S.sel?pt(sc,S.sel):null, el=$('#panel');
  if(!p){
    el.innerHTML='<p class="empty"><b>Kezdje itt:</b> kattintson egy számozott pontra az ábrán. Megjelenik a hozzá tartozó információ és egy ellenőrző kérdés.</p>';
    if(S.teacher && sc.type==='image') el.innerHTML+='<p class="empty">Tanári mód: a pontok húzással áthelyezhetők.</p>';
    return;
  }
  var n=num(sc,p.id), h='<div class="pk">'+n+'. pont / '+sc.points.length+' · '+esc(sc.tab)+'</div><h3 id="pTitle"></h3><div id="pInfo"></div><div id="pQ"></div><div id="pNext"></div><details class="ed" id="pEd" open><summary>Tanári szerkesztő</summary><div id="pEdBody"></div></details>';
  el.innerHTML=h;
  renderPInfo(); renderQ(); renderEditor();
}

function renderPInfo(){
  var sc=scene(), p=pt(sc,S.sel); if(!p) return;
  $('#pTitle').textContent=p.title;
  var h='';
  if(sc.type==='chart'){
    var i=-1; sc.data.forEach(function(d,k){ if('y'+d.y===p.id) i=k; });
    if(i>=0){
      var d=sc.data[i], pr=i>0?sc.data[i-1]:null;
      h+='<div class="facts"><div class="fact"><small>Munkanélküliség</small><b>'+fmt(d.ue)+'%</b>'+(pr?'<small>'+(d.ue>=pr.ue?'+':'−')+fmt(Math.abs(Math.round((d.ue-pr.ue)*10)/10))+' százalékpont</small>':'')+'</div>';
      h+='<div class="fact"><small>Nemzeti jövedelem</small><b>'+d.ni+' mrd $</b>'+(pr?'<small>'+(d.ni>=pr.ni?'+':'−')+Math.abs(d.ni-pr.ni)+' mrd $ az előző évhez képest</small>':'')+'</div></div>';
    }
  }
  h+=paras(p.info);
  if(p.ref) h+='<p class="ref">Tankönyv: '+esc(p.ref)+'</p>';
  $('#pInfo').innerHTML=h;
}

function renderQ(){
  var sc=scene(), p=pt(sc,S.sel), box=$('#pQ'), nx=$('#pNext'); if(!p||!box) return;
  if(!hasQ(p)){ box.innerHTML = sc.type==='chart' ? '<p class="empty" style="margin-top:12px">Ehhez az évhez nincs kérdés. A kérdésekhez kattintson a kiemelt (piros pontos) évekre.</p>' : ''; nx.innerHTML=''; return; }
  var r=R(sc,p);
  if(!r.order || r.order.length!==p.q.options.length) r.order=shuffle(p.q.options.length);
  var h='<div class="q" role="group" aria-labelledby="qt"><p class="qt" id="qt">Kérdés: '+esc(p.q.text)+'</p><div class="opts">';
  r.order.forEach(function(oi,pos){
    var cls='opt', dis='';
    if(r.wrong.indexOf(oi)>=0){ cls+=' no'; dis=' disabled'; }
    if(r.done){ dis=' disabled'; if(oi===p.q.correct) cls+=' ok'; }
    h+='<button type="button" class="'+cls+'" data-oi="'+oi+'"'+dis+'><span class="lt">'+LETTERS[pos]+'</span><span>'+esc(p.q.options[oi])+'</span></button>';
  });
  h+='</div><div class="fb" id="fb" role="status"></div></div>';
  box.innerHTML=h;
  var fb=$('#fb');
  if(r.done){
    fb.className='fb good';
    fb.innerHTML='<b>Helyes válasz.</b> '+(r.first?'(1 pont)':'(Hibás próbálkozás után: 0 pont.)')+(p.q.expl?'<span class="ex">'+esc(p.q.expl)+'</span>':'');
    renderNext();
  } else {
    nx.innerHTML='';
    if(r.wrong.length){ fb.className='fb bad'; fb.textContent='Ez a válasz nem megfelelő. Olvassa el újra az információt, és próbálja újra.'; }
  }
  $$('.opt',box).forEach(function(b){ b.addEventListener('click',function(){ answer(+b.getAttribute('data-oi')); }); });
}

function answer(oi){
  var sc=scene(), p=pt(sc,S.sel), r=R(sc,p);
  if(r.done) return;
  r.tries++;
  if(oi===p.q.correct){ r.done=true; r.first=(r.tries===1); }
  else if(r.wrong.indexOf(oi)<0){ r.wrong.push(oi); }
  renderQ(); updateMarks();
  var f=$('#fb'); if(f && r.done){ var nb=$('.next'); if(nb) nb.focus({preventScroll:true}); }
}

function nextTarget(){
  var sc=scene(), i, j, p, sci;
  var start=S.sel?sc.points.map(function(q){return q.id;}).indexOf(S.sel):-1;
  for(j=1;j<=sc.points.length;j++){
    p=sc.points[(start+j)%sc.points.length];
    if(hasQ(p) && !(S.res[key(sc,p)]&&S.res[key(sc,p)].done)) return {scene:S.scene,id:p.id,label:'Következő pont'};
  }
  for(i=1;i<CFG.scenes.length;i++){
    sci=(S.scene+i)%CFG.scenes.length;
    var s2=CFG.scenes[sci];
    for(j=0;j<s2.points.length;j++){
      p=s2.points[j];
      if(hasQ(p) && !(S.res[key(s2,p)]&&S.res[key(s2,p)].done)) return {scene:sci,id:null,label:'Következő feladat: '+s2.tab};
    }
  }
  return {summary:true,label:'Összegzés megnyitása'};
}
function renderNext(){
  var t=nextTarget(), nx=$('#pNext');
  nx.innerHTML='<button type="button" class="next">'+esc(t.label)+' →</button>';
  $('.next',nx).addEventListener('click',function(){
    if(t.summary){ openSummary(); return; }
    if(t.scene!==S.scene){ S.scene=t.scene; S.sel=null; renderScene(); return; }
    select(t.id);
  });
}

/* ================= összegzés ================= */
function summaryText(name){
  var a=allStats(), lines=[CFG.meta.title+' – interaktív feladat','Név: '+(name||'—'),'Összpontszám: '+a.first+' / '+a.total];
  CFG.scenes.forEach(function(sc,i){ var s=sceneStats(sc); lines.push((i+1)+'. '+sc.tab+': '+s.first+' / '+s.total+' pont ('+s.done+' megoldva)'); });
  return lines.join('\n');
}
function openSummary(){
  var a=allStats(), d=$('#dlg'), rows='';
  CFG.scenes.forEach(function(sc,i){ var s=sceneStats(sc); rows+='<tr><td>'+(i+1)+'. '+esc(sc.tab)+'</td><td class="n">'+s.done+' / '+s.total+'</td><td class="n">'+s.first+' / '+s.total+'</td></tr>'; });
  var fin=(CFG.meta.final||[]).map(function(q){return '<li>'+esc(q)+'</li>';}).join('');
  d.innerHTML='<div class="dlg"><h2>Összegzés</h2><table><thead><tr><th>Feladat</th><th class="n">Megoldva</th><th class="n">Pont</th></tr></thead><tbody>'+rows+'</tbody><tfoot><tr><td>Összesen</td><td class="n">'+a.done+' / '+a.total+'</td><td class="n">'+a.first+' / '+a.total+'</td></tr></tfoot></table>'+
    (a.done<a.total?'<p>Még <b>'+(a.total-a.done)+'</b> kérdés vár megoldásra.</p>':'<p><b>Valamennyi kérdést megoldotta.</b></p>')+
    '<h3 style="margin-top:14px">Írásbeli zárófeladat</h3><p>Válaszoljon 5–6 mondatban a tankönyv összegző kérdéseire:</p><ol>'+fin+'</ol>'+
    '<div class="row"><input type="text" id="sName" placeholder="Név és osztály" aria-label="Név és osztály"><button type="button" class="pr" id="sCopy">Eredmény másolása</button></div>'+
    '<div class="cp" id="sCp" role="status"></div>'+
    '<div class="row"><button type="button" class="sc" id="sReset">Újrakezdés</button><button type="button" class="sc" id="sClose">Bezárás</button></div></div>';
  $('#sCopy').addEventListener('click',function(){
    var txt=summaryText($('#sName').value.trim()), ok=function(){ $('#sCp').textContent='Az eredmény a vágólapra került; beillesztheti a leadási felületre.'; };
    if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(txt).then(ok,function(){ fallbackCopy(txt); ok(); }); }
    else { fallbackCopy(txt); ok(); }
  });
  $('#sReset').addEventListener('click',function(){ if(confirm('Biztosan törli az eddigi válaszokat és a pontszámot?')){ S.res={}; d.close(); S.sel=null; renderScene(); } });
  $('#sClose').addEventListener('click',function(){ d.close(); });
  if(d.showModal) d.showModal(); else d.setAttribute('open','');
}
function fallbackCopy(t){ var x=document.createElement('textarea'); x.value=t; document.body.appendChild(x); x.select(); try{document.execCommand('copy');}catch(e){} document.body.removeChild(x); }

/* ================= tanári mód ================= */
function toggleTeacher(){
  S.teacher=!S.teacher;
  document.body.classList.toggle('teacher',S.teacher);
  $('#bTeach').setAttribute('aria-pressed',String(S.teacher));
  updateMarks(); renderPanel();
}

function renderEditor(){
  var box=$('#pEdBody'); if(!box) return;
  var sc=scene(), p=pt(sc,S.sel); if(!p) return;
  var q=p.q||{text:'',options:['','',''],correct:0,expl:''}, h='';
  h+='<label for="e_title">Cím</label><input type="text" id="e_title" value="'+esc(p.title)+'">';
  h+='<label for="e_info">Információs szöveg (új bekezdés: új sor)</label><textarea id="e_info" rows="6">'+esc(p.info)+'</textarea>';
  h+='<label for="e_ref">Tankönyvi hivatkozás</label><input type="text" id="e_ref" value="'+esc(p.ref||'')+'">';
  h+='<label for="e_q">Kérdés (üresen hagyva a ponthoz nem tartozik kérdés)</label><textarea id="e_q" rows="2">'+esc(q.text)+'</textarea>';
  h+='<label>Válaszlehetőségek (a kijelölt a helyes)</label>';
  for(var i=0;i<4;i++){
    h+='<div class="orow"><input type="radio" name="e_c" value="'+i+'" aria-label="Helyes válasz: '+LETTERS[i]+'"'+(q.correct===i?' checked':'')+'><input type="text" id="e_o'+i+'" value="'+esc(q.options[i]||'')+'" aria-label="'+LETTERS[i]+' válasz"></div>';
  }
  h+='<label for="e_ex">Magyarázat helyes válasz után</label><textarea id="e_ex" rows="2">'+esc(q.expl||'')+'</textarea>';
  if(sc.type==='image') h+='<button type="button" class="del" id="e_del">Pont törlése</button>';
  box.innerHTML=h;
  var upd=function(){
    p.title=$('#e_title').value; p.info=$('#e_info').value; p.ref=$('#e_ref').value;
    var text=$('#e_q').value.trim();
    if(!text){ p.q=null; }
    else {
      var corr=+(($('input[name=e_c]:checked')||{}).value||0), opts=[], ci=0;
      for(var k=0;k<4;k++){ var v=$('#e_o'+k).value.trim(); if(v){ if(k===corr) ci=opts.length; opts.push(v); } }
      p.q={text:text,options:opts,correct:ci,expl:$('#e_ex').value};
    }
    delete S.res[key(sc,p)];
    renderPInfo(); renderQ(); updateMarks();
    var tt=$('#pTitle'); if(tt) tt.textContent=p.title;
  };
  $$('input,textarea',box).forEach(function(e){ e.addEventListener('input',upd); e.addEventListener('change',upd); });
  var del=$('#e_del',box);
  if(del) del.addEventListener('click',function(){
    if(!confirm('Biztosan törli ezt a pontot?')) return;
    sc.points=sc.points.filter(function(x){return x.id!==p.id;}); delete S.res[key(sc,p)]; S.sel=null; renderScene();
  });
}

function addPoint(){
  var sc=scene(), id='p'+Date.now().toString(36);
  sc.points.push({id:id,x:50,y:50,title:'Új pont',info:'Írja ide az információs szöveget.',ref:'',q:null});
  S.sel=id; renderScene();
}

function replaceImage(e){
  var f=e.target.files&&e.target.files[0]; if(!f) return;
  var rd=new FileReader();
  rd.onload=function(){
    var im=new Image();
    im.onload=function(){
      var max=1600, sc=Math.min(1,max/im.width), c=document.createElement('canvas');
      c.width=Math.round(im.width*sc); c.height=Math.round(im.height*sc);
      c.getContext('2d').drawImage(im,0,0,c.width,c.height);
      scene().image=c.toDataURL('image/jpeg',0.86);
      renderScene();
    };
    im.src=rd.result;
  };
  rd.readAsDataURL(f);
}

function initDrag(){
  var st=$('#stage'), drag=null;
  st.addEventListener('pointerdown',function(e){
    if(!S.teacher) return;
    var b=e.target.closest ? e.target.closest('.hs') : null; if(!b) return;
    drag={b:b,id:b.getAttribute('data-pt'),moved:false,sx:e.clientX,sy:e.clientY};
    try{ b.setPointerCapture(e.pointerId); }catch(x){}
  });
  st.addEventListener('pointermove',function(e){
    if(!drag) return;
    if(!drag.moved && Math.abs(e.clientX-drag.sx)+Math.abs(e.clientY-drag.sy)<5) return;
    drag.moved=true;
    var w=$('#imgwrap'), r=w.getBoundingClientRect();
    var x=Math.max(0,Math.min(100,(e.clientX-r.left)/r.width*100)), y=Math.max(0,Math.min(100,(e.clientY-r.top)/r.height*100));
    x=Math.round(x*10)/10; y=Math.round(y*10)/10;
    drag.b.style.left=x+'%'; drag.b.style.top=y+'%';
    var p=pt(scene(),drag.id); if(p){ p.x=x; p.y=y; }
  });
  var end=function(){ if(drag){ if(drag.moved){ S.suppress=true; setTimeout(function(){ S.suppress=false; },80); } drag=null; } };
  st.addEventListener('pointerup',end);
  st.addEventListener('pointercancel',end);
}

function exportHTML(){
  var clone=document.documentElement.cloneNode(true);
  var app=clone.querySelector('#app'); if(app) app.innerHTML='';
  var cfg=clone.querySelector('#cfg'); if(cfg) cfg.textContent=JSON.stringify(CFG).replace(/</g,'\\u003c');
  var b=clone.querySelector('body'); if(b) b.className='';
  var html='<!DOCTYPE html>\n'+clone.outerHTML;
  var blob=new Blob([html],{type:'text/html;charset=utf-8'}), a=document.createElement('a');
  a.href=URL.createObjectURL(blob); a.download='nagy-gazdasagi-vilagvalsag-interaktiv.html';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(function(){ URL.revokeObjectURL(a.href); },1000);
}

/* ================= indítás ================= */
shell();
renderScene();
})();
</script>
</body>
