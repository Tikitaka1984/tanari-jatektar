<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gyilkosság a Forumon</title>
<style>
:root{
  --bg:#f4efe4; --card:#fffdf7; --ink:#2b1f14; --muted:#645544; --line:#d6c8a8;
  --accent:#8e1f1f; --accent-ink:#fff; --ok:#2f6b3a; --bad:#a32a2a; --warn:#8a6100; --chip:#f0e6d0;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#1b1412; --card:#2a1f1b; --ink:#f3e8d2; --muted:#c7b698; --line:#4d3b30; --accent:#e0675a; --accent-ink:#1b1412; --ok:#7fc58b; --bad:#f08a8a; --warn:#e6bd5a; --chip:#3a2f21; }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Georgia,"Times New Roman",serif;line-height:1.55;font-size:17px}
.wrap{max-width:900px;margin:0 auto;padding-block:16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1{font-size:1.45rem;margin:0;color:var(--accent);letter-spacing:.2px}
header.top{position:relative;overflow:hidden;display:flex;align-items:flex-start;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:20px 18px 46px;min-height:165px;margin-bottom:14px;border-radius:12px;border:2px solid #c9a24b;background:linear-gradient(135deg,#3f0c0c,#8e1f1f 70%);color:#f6ecd2}
header.top .bn{position:absolute;left:0;right:0;bottom:0;width:100%;height:100%;pointer-events:none}
header.top>*:not(.bn){position:relative;z-index:1}
header.top h1{color:#f6ecd2;font-size:1.6rem;letter-spacing:.06em;text-shadow:0 1px 2px rgba(0,0,0,.5)}
header.top .sub{font-size:.85rem;letter-spacing:.18em;color:#e8c46a;margin-top:2px;font-family:system-ui,sans-serif}
header.top .score{position:absolute;left:18px;bottom:10px;z-index:2;background:rgba(40,8,8,.55);border-color:#c9a24b;color:#f6ecd2}
body{background-image:radial-gradient(circle at 15% 0,rgba(201,162,75,.12),transparent 40%),radial-gradient(circle at 90% 100%,rgba(142,31,31,.07),transparent 45%);background-attachment:fixed}
h2{font-size:1.2rem;margin:0 0 8px;color:var(--accent)}
h3{font-size:1.02rem;margin:0 0 4px}
.score{font-family:system-ui,sans-serif;font-size:.9rem;background:var(--chip);border:1px solid var(--line);padding:4px 10px;border-radius:999px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:14px}
.muted{color:var(--muted);font-size:.93rem}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px}
.sus{border:1px solid var(--line);border-radius:10px;padding:12px;background:var(--card);position:relative}
.sus .role{font-family:system-ui,sans-serif;font-size:.8rem;color:var(--muted);margin-bottom:6px}
.sus blockquote{margin:6px 0;padding-left:10px;border-left:3px solid var(--line);font-style:italic;font-size:.95rem}
.sus.out{opacity:.62}
.badge{display:inline-block;font-family:system-ui,sans-serif;font-size:.75rem;padding:2px 8px;border-radius:999px;margin:2px 4px 2px 0;border:1px solid var(--line);background:var(--chip)}
.badge.ok{color:var(--ok);border-color:var(--ok)}
.badge.no{color:var(--bad);border-color:var(--bad)}
.badge.sus-m{color:var(--warn);border-color:var(--warn)}
.secret{font-size:.9rem;margin-top:6px;border-top:1px dashed var(--line);padding-top:6px}
button,.btn{font-family:system-ui,sans-serif;font-size:.95rem;cursor:pointer;border-radius:8px;border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);padding:9px 16px;min-height:44px}
button.ghost{background:transparent;color:var(--accent)}
button.small{min-height:36px;padding:5px 10px;font-size:.82rem}
button:disabled{opacity:.45;cursor:not-allowed}
button:focus-visible,input:focus-visible,label:focus-within{outline:3px solid var(--warn);outline-offset:2px}
.opt{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1px solid var(--line);border-radius:8px;margin:6px 0;cursor:pointer;background:var(--card)}
.opt input{margin-top:5px;width:18px;height:18px;flex:none}
.opt.sel{border-color:var(--accent);background:var(--chip)}
.progress{display:flex;gap:6px;margin:6px 0 14px}
.progress span{flex:1;height:8px;border-radius:4px;background:var(--line)}
.progress span.done{background:var(--ok)}
.progress span.cur{background:var(--accent)}
.fb{padding:10px 12px;border-radius:8px;margin:10px 0;font-size:.97rem}
.fb.bad{border:1px solid var(--bad);color:var(--ink);background:color-mix(in srgb,var(--bad) 12%,transparent)}
.fb.good{border:1px solid var(--ok);background:color-mix(in srgb,var(--ok) 12%,transparent)}
.fb.hint{border:1px dashed var(--warn)}
.clue{border-left:4px solid var(--accent);padding:6px 12px;margin:8px 0;background:var(--chip);border-radius:0 8px 8px 0}
.clue b{font-family:system-ui,sans-serif;font-size:.8rem;color:var(--muted);display:block}
ul.tight{margin:6px 0 6px 18px;padding:0}
ul.tight li{margin:3px 0}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:10px}
.sr{position:absolute;left:-9999px}
.res-row{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px solid var(--line);font-size:.95rem}
.big{font-size:2rem;font-weight:bold;color:var(--accent)}
[hidden]{display:none!important}
.tabs{display:flex;gap:6px;margin:0 0 14px;flex-wrap:wrap}
.tab{background:transparent;color:var(--accent);border:1px solid var(--line);border-radius:8px;padding:8px 14px;min-height:44px}
.tab[aria-selected="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
textarea.notes{width:100%;min-height:110px;font:inherit;padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);resize:vertical}
@media (max-width:520px){body{font-size:16px}h1{font-size:1.25rem}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top"><svg class="bn" viewBox="0 0 900 170" preserveAspectRatio="xMidYMax slice" aria-hidden="true" focusable="false"><defs><linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e0b04a" stop-opacity=".0"/><stop offset="1" stop-color="#e0b04a" stop-opacity=".35"/></linearGradient></defs><rect width="900" height="170" fill="url(#sky)"/><circle cx="700" cy="70" r="46" fill="#e8c46a" opacity=".28"/><g fill="#2a0a0a" opacity=".55"><path d="M0 170V122h900v48z"/><g id="ar"><path d="M0 122h60v48H0z"/></g></g><g fill="#8e1f1f" opacity=".95"><path d="M20 170v-28a20 20 0 0 1 40 0v28zM100 170v-28a20 20 0 0 1 40 0v28zM180 170v-28a20 20 0 0 1 40 0v28zM260 170v-28a20 20 0 0 1 40 0v28zM340 170v-28a20 20 0 0 1 40 0v28zM420 170v-28a20 20 0 0 1 40 0v28zM500 170v-28a20 20 0 0 1 40 0v28zM580 170v-28a20 20 0 0 1 40 0v28zM660 170v-28a20 20 0 0 1 40 0v28zM740 170v-28a20 20 0 0 1 40 0v28zM820 170v-28a20 20 0 0 1 40 0v28z"/></g><g fill="#c9a24b" opacity=".8"><rect x="610" y="46" width="10" height="76"/><rect x="640" y="46" width="10" height="76"/><rect x="670" y="46" width="10" height="76"/><rect x="700" y="46" width="10" height="76"/><rect x="730" y="46" width="10" height="76"/><rect x="600" y="38" width="150" height="10"/><path d="M600 38l75-26 75 26z"/></g><g stroke="#e8c46a" stroke-width="5" opacity=".9"><path d="M820 20v100M806 40l28 0M806 54l28 0M806 68l28 0"/></g><path d="M792 20l28-10 28 10-12 12h-32z" fill="#e8c46a" opacity=".9"/></svg>

  <p class="muted" style="margin-top:24px">Történelmi nyomozójáték 9. évfolyamnak. Szereplői kitalált alakok; a római köztársaság intézményei az OH-TOR09TB és a katolikus tankönyv vonatkozó leckéi alapján szerepelnek.</p>

<script>
"use strict";
/* ---------- ADATOK ---------- */
const SUSPECTS=[
 {id:"val",name:"Lucius Valerius Nepos",role:"szenátor, patrícius",
  say:"Aznap éjjel a senatus ülésén voltam. Marcus Aemilius a plebejusok oldalán állt, de az ellenségem nem volt.",
  secret:"Nyilvánosan szembeszállt a közföldek (ager publicus) újraosztásával, ezért sokan haragudtak rá."},
 {id:"ses",name:"Aulus Sestius",role:"néptribunus, Marcus kollégája",
  say:"Tribunus vagyok, a plebejusok jogait védem. Marcus Aemilius a kollégám volt, nem ölhettem meg.",
  secret:"Évek óta vetélytársak voltak a plebejusok körében, és a tribunusi tisztségért is egymás ellen indultak."},
 {id:"cor",name:"Gnaeus Cornelius Rufus",role:"imperator, hadvezér",
  say:"A légióimmal a campaniai táborban állomásozom, a senatus megbízásából. Kevés időm jut Rómára.",
  secret:"Zsoldosai inkább hozzá, mint a senatushoz hűek, és szeretné meghosszabbíttatni a parancsnoki megbízását."},
 {id:"fab",name:"Quintus Fabricius Ligur",role:"volt dictator",
  say:"Hat hónappal ezelőtt lejárt a dictatori megbízásom. Azóta magánember vagyok.",
  secret:"Dictatorként sok ellenfelét száműzte, ezért sokan félnek tőle."},
 {id:"sem",name:"Gaius Sempronius Varro",role:"consul",
  say:"A köztársaságot szolgálom, és a nép akarata, hogy tovább vezessem. A tribunus halála szerencsétlenség.",
  secret:"Már ötödik éve egymás után viseli a consuli tisztet, és a hatodikra készül."}
];
const SN=Object.fromEntries(SUSPECTS.map(s=>[s.id,s.name]));

const STEPS=[
 {title:"1. feladat (a köztársaság rendje): A senatus",type:"single",
  q:"Valerius szenátor alibije szerint aznap éjjel a senatus ülésén vett részt. A jegyzőkönyv szerint a testület a hadvezér-consul háborús javaslatát tárgyalta. Mit tehetett a senatus a köztársaság szabályai szerint egy ilyen javaslattal kapcsolatban?",
  opts:[["a","Kizárólag véleményezhette, mert a külügyekben és a háború kérdésében mindig a népgyűlés döntött."],["b","Csak a plebejus népgyűlés jóváhagyásával dönthetett, mert a senatus határozatai nem voltak kötelező érvényűek."],["c","Törvényt kezdeményezhetett, a külügyekben dönthetett, és a hivatalnokokat ellenőrizhette; számos döntése kötelező érvényű volt."],["d","A javaslatról a tagok közül sorsolt bizottság döntött, a testület pedig csak jóváhagyta a bizottság határozatát."]],
  correct:["c"],
  hint:"A senatus a nemzetségfők tanácsa volt, de jogköre messze túlment a puszta tanácsadáson.",
  expl:"A kezdetben 300 tagú senatus törvényeket kezdeményezhetett, döntött a külügyekben, és ellenőrizte a hivatalnokokat; számos döntése kötelező érvényű volt. Tagjai a nemzetségfők és a volt főhivatalnokok közül kerültek ki, nem sorsolták őket.",
  clue:{t:"A senatus jegyzőkönyve",x:"A senatus aznap késő estig ülésezett. Lucius Valerius az utolsó szónok volt, a jegyzőkönyvet több szenátor hitelesítette."},
  elim:{val:"Alibije igazolt: a senatus jegyzőkönyve szerint az ülésen volt."},
  after:"Valerius alibije igazolt, így kikerül a gyanúsítottak közül."},
 {title:"2. feladat (a köztársaság rendje): A tisztségviselők",type:"multi",
  q:"Egy szomszéd különös dolgot látott az éjszakában. Mi igaz a római tisztségviselőkre (magistratusokra)? (Több válasz is lehet.)",
  opts:[["1","A tisztviselők a népnek tartoztak felelősséggel, ezért a népgyűlés bármikor visszahívhatta őket."],["2","Semmilyen tisztséget sem töltött be egy hivatalnok egyedül; egyik a másik döntését érvényteleníthette."],["3","A consul önmagát is kinevezhette dictatorrá, ha a senatus ezt javasolta."],["4","A tisztségeket többnyire egy évre töltötték be, és viselőik nem kaptak fizetést."],["5","A tisztviselők hatalmát a lictorok által vitt, bárddal ékesített vesszőnyaláb (fasces) jelezte."]],
  correct:["2","4","5"],
  hint:"A hatalmat megosztották és időben korlátozták, hogy ne térjen vissza a királyság. A tisztviselők a senatusnak tartoztak felelősséggel.",
  expl:"A kollegialitás elve szerint a hivatalnokok egymást ellenőrizték, és érvényteleníthették egymás döntéseit. A tisztségek többnyire egyévesek voltak, fizetés nélküliek. A hatalom jelképe a fasces volt, amelyet a lictorok vittek. A tisztviselők a senatusnak tartoztak felelősséggel, a consul pedig önmagát nem nevezhette ki dictatorrá.",
  clue:{t:"A szomszéd vallomása",x:"„Késő éjjel lictorokat láttam bárdos vesszőnyalábokkal Marcus Aemilius háza felé menni. Valaki hivatalos kísérettel érkezett.”"},
  after:"Lictorok csak a hivatalban lévő tisztségviselőt kísérték. A tettes tehát valaki, aki akkor tisztséget viselt."},
 {title:"3. feladat (a köztársaság rendje): A néptribunus",type:"multi",
  q:"A meggyilkolt Marcus Aemilius néptribunus volt. Mi igaz a néptribunusokra? (Több válasz is lehet.)",
  opts:[["1","Személyük és házuk sérthetetlen volt."],["2","A senatus nevezte ki őket, hogy a plebejusok mozgalmait felügyeljék."],["3","Megvétózhatták a plebejusokat sértő törvényeket és intézkedéseket, a senatus döntéseit is."],["4","Hivatalukért fizetést kaptak, mert a plebejusok nem engedhették meg az ingyenes szolgálatot."],["5","A plebejusok népgyűlése választotta őket évente."]],
  correct:["1","3","5"],
  hint:"A néptribunus a plebejusok védelmére jött létre (Kr. e. 494), a Szent-hegyi kivonulás eredményeként.",
  expl:"A néptribunusokat a plebejusok népgyűlése választotta évente. Személyük és házuk sérthetetlen volt, vétójoggal rendelkeztek. A senatus nem nevezte ki őket, fizetést a tisztségviselők általában nem kaptak.",
  clue:{t:"Marcus Aemilius viasztáblája",x:"„Holnap vétót emelek a hadvezér-consul javaslata ellen. Ha átmegy, a köztársaságnak vége.”"},
  elim:{ses:"Alibije igazolt: három másik néptribunus tanúsítja, hogy az éjszakát együtt töltötték a plebejus népgyűlés előkészítésén."},
  after:"A viasztábla a consulra utal, de a gyanú még nem elég. Sestius alibije igazolt, így ő is kikerül."},
 {title:"4. feladat (a válság kora): A hadsereg",type:"single",
  q:"Cornelius Rufus imperator légiói zsoldosokból állnak, akik között sok a földnélküli. Mi tette lehetővé, hogy ilyen hadsereggel hosszú, folyamatos hadjáratokat vívjanak?",
  opts:[["a","A katonák a zsákmányból gazdagodtak, ezért önként vállalták a szolgálatot, a földjüket pedig rabszolgák művelték."],["b","A földnélküliek zsoldért folyamatosan szolgálhattak, míg a földdel rendelkező parasztok a hosszú katonáskodás miatt tönkrementek."],["c","A senatus a polgárok közül sorsolta a katonákat egy évre, és a szolgálat letelte után mindenkit hazaengedett."],["d","A plebejus népgyűlés szavazta meg a hadjáratokat, ezért minden polgár köteles volt részt venni bennük."]],
  correct:["b"],
  hint:"Ki tudott gondozni egy birtokot, ha a háborúban kellett lennie?",
  expl:"A földdel rendelkező katonaköteles parasztok a folyamatos katonáskodás miatt nem tudták birtokaikat megművelni, tönkrementek, és nem sorozhatták be őket. A problémát a földnélkülieket is alkalmazó zsoldoshadsereg oldotta meg, amely folyamatosan hadra fogható volt.",
  clue:{t:"A tábori napló",x:"A campaniai tábor naplója szerint Cornelius Rufus aznap éjjel a táborban volt, a légió tisztjei látták, hogy a tábort nem hagyta el."},
  elim:{cor:"Alibije igazolt: a táborban volt, légiói látták."},
  after:"A hadvezér a táborban volt, így nem járhatott Rómában. Két gyanúsított maradt."},
 {title:"5. feladat (a válság kora): A dictator",type:"single",
  q:"Fabricius volt dictator azt állítja, hogy megbízása lejárt, ezért nincs hatalma. Mi igaz a dictatori tisztségre, és mi következik ebből az ő jelenlegi helyzetére?",
  opts:[["a","A népgyűlés választotta egy évre; hivatala lejárta után is lictorok kísérik, mert a dictator címe élethosszig megmarad."],["b","A consul önmagát is kinevezhette; megbízása hat hónapig tartott, és ezalatt a többi hivatal működése szünetelt."],["c","A senatus javaslatára a consul nevezte ki, legfeljebb hat hónapra; a lejárat után a hatalma még egy évig megmaradt."],["d","A senatus javaslatára a consul nevezte ki, legfeljebb hat hónapra; lejárta után magánember, hatalma és lictorai megszűntek."]],
  correct:["d"],
  hint:"A dictator rendkívüli, de időben szigorúan korlátozott tisztség volt, és kinevezéséhez a consul és a senatus is kellett.",
  expl:"A dictatort nagy veszély esetén a senatus javaslatára a consul nevezte ki, legfeljebb hat hónapra; önmagát a consul nem nevezhette ki. A megbízás lejártával a hatalom megszűnt, így a dictatort kísérő lictorok is. A hivatali ideje alatt tett tetteiért később nem vonhatták felelősségre.",
  clue:{t:"A dictatori megbízás lejárta",x:"Fabricius megbízása hat hónappal ezelőtt lejárt. Azóta magánember, nincs hivatala, így lictorok sem kísérik."},
  elim:{fab:"A dictatori hatalma lejárt, magánemberként nincs lictora; a szomszéd viszont hivatalos kísérettel érkezőt látott."},
  after:"Fabricius már nem tisztségviselő. Egyetlen gyanúsított marad, de az indítékot még ellenőrizni kell."},
 {title:"6. feladat (a válság kora): Az egyéves hivatal",type:"single",
  q:"Sempronius Varro ötödik éve egymás után consul, és a hatodikra készül. (A szereplő Marius Kr. e. 2–1. század fordulóján zajló consulságainak mintájára készült.) Varro így érvel: „A nép újra és újra megválaszthat, mert a nép akarata a legfőbb törvény.” Melyik érv cáfolja ezt leginkább a köztársaság szabályai alapján?",
  opts:[["a","A hivatalokat többnyire egy évre korlátozták, viselőik a következő évre nem voltak újraválaszthatók."],["b","A consulok a népnek tartoztak felelősséggel, ezért a népgyűlés nem választhatta meg kétszer ugyanazt a személyt."],["c","A consulokat a senatus nevezte ki, ezért a népgyűlésnek egyáltalán nem volt joga a választáshoz."],["d","A consuli tisztség fizetett volt, ezért csak egyszer lehetett betölteni, hogy a kincstár ne terhelődjön túl."]],
  correct:["a"],
  hint:"Miért korlátozták egy évre a hivatalokat, és mitől féltek a rómaiak?",
  expl:"A hivatalok betöltésének idejét többnyire egy évre korlátozták, és viselőik a következő évre nem voltak újraválaszthatók. Ezzel az állam vezetőinek túlhatalmát, tulajdonképpen a királyok visszatérését akarták megakadályozni. A tartós consuli hatalom ellentmond ennek.",
  clue:{t:"A megvesztegetési főkönyv",x:"Varro házában főkönyvet találtak: a hatodik consulságért szavazatokat vásároltak. A kampány utcai erőszakkal is járt. Marcus Aemilius vétója ezt a jelöltséget akadályozta volna meg."},
  elim:null,
  after:"Nincs más gyanúsított, Varro motívuma pedig kiderült. Ideje vádat emelni."}
];

const MOTIVES=[
 ["a","Varro el akarta hallgattatni Marcus Aemiliust, mert a néptribunus vétója megakadályozta volna a hatodik consulságát és a hatalma meghosszabbítását."],

/* ---------- ÁLLAPOT ---------- */
const S={phase:"intro",step:0,score:100,tries:0,sel:[],fb:null,hintShown:false,
  clues:[],elim:{},marks:{},notes:"",rev:0,ret:"case",tab:"game",scoring:true,acc:{killer:null,motive:null,ev:[],court:null},accErr:null,result:null};
const $=id=>document.getElementById(id);
const app=$("app");

function setScore(){ $("score").textContent=S.scoring?("Pontszám: "+S.score):"Tanári mód (pontozás nélkül)"; }
function arrEq(a,b){return a.length===b.length&&a.every(x=>b.includes(x));}

/* ---------- NÉZETEK ---------- */
function suspectsHtml(){
  return '<div class="grid">'+SUSPECTS.map(s=>{
    const out=S.elim[s.id];
    const m=S.marks[s.id]||"";
    const showSecret=S.phase!=="intro" && S.clues.length>=({val:1,ses:3,cor:4,fab:5,sem:6})[s.id];
    return '<div class="sus'+(out?' out':'')+'">'
      +'<h3>'+s.name+'</h3><div class="role">'+s.role+'</div>'
      +'<blockquote>„'+s.say+'”</blockquote>'
      +(out?'<span class="badge no">Kizárva</span><div class="muted">'+out+'</div>':'')
      +(m==="gyanus"?'<span class="badge sus-m">Gyanús (saját jelölés)</span>':'')
      +(m==="artatlan"?'<span class="badge ok">Ártatlan (saját jelölés)</span>':'')
      +(showSecret?'<div class="secret"><b>Kiderült:</b> '+s.secret+'</div>':'')
      +(S.phase==="case"?'<div class="row"><button class="ghost small" data-act="mark" data-id="'+s.id+'" data-v="gyanus">Gyanús</button><button class="ghost small" data-act="mark" data-id="'+s.id+'" data-v="artatlan">Ártatlan</button><button class="ghost small" data-act="mark" data-id="'+s.id+'" data-v="">Töröl</button></div>':'')
      +'</div>';
  }).join('')+'</div>';
}
function cluesHtml(){
  if(!S.clues.length) return '<p class="muted">Még nincs feloldott nyom. Oldja meg az első feladatot!</p>';
  return S.clues.map((c,i)=>'<div class="clue"><b>'+(i+1)+'. nyom: '+c.t+'</b>'+c.x+'</div>').join('');
}
function progressHtml(){
  return '<div class="progress" aria-label="Haladás">'+STEPS.map((_,i)=>'<span class="'+(i<S.step?'done':(i===S.step&&S.phase==='case'?'cur':''))+'"></span>').join('')+'</div>';
}

  '<div class="card"><h2>A történet</h2>'

  +'<p>Egy reggel holtan találják Marcus Aemiliust, a néptribunust, akinek a személye szent és sérthetetlen volt. A halál éjszaka történt a háza előtt. A helyszínen a következőket találják:</p>'
  +'<ul class="tight"><li>egy bíborszegélyű tógadarabot,</li><li>egy vérfoltos tőrt,</li><li>a falon egy feliratot: <em>„A tribunus a nép ellensége volt.”</em></li><li>és a piacon suttognak a patrícius szenátorokról.</li></ul>'
  +'<p>A feladatok az Alapok (1–3. feladat: a köztársaság rendje) és a válság kora (4–6. feladat) tananyagából építkeznek. <b>Az Ön feladata:</b> kiderítse, ki ölte meg a tribunust, miért tette, és kinek a hatáskörébe tartozik az ügy.</p></div>'
  +'<div class="card"><h2>Gyanúsítottak</h2>'+suspectsHtml()+'</div>'
  +'<div class="card"><h2>Játékszabályok</h2><ul class="tight"><li>Hat feladatot kell megoldania. Minden helyes válasz feloldja a következő nyomot.</li><li>Kezdőpontszám: 100. Rossz válasz: −10 pont. Tipp kérése: −5 pont.</li><li>A feladatok után vádat emelhet, és megtudja, helyesen nyomozott-e.</li></ul>'

function renderTabs(){
  const t=$("tabs");
  t.hidden=false;
  const tabs=S.phase==="intro"?[["game","Kezdőlap"],["rules","Szabályok"]]:[["game","Nyomozás"],["log","Nyomnapló ("+S.clues.length+")"],["store","Bizonyíték raktár ("+wareAvail().length+")"],["rules","Szabályok"]];
  t.innerHTML=tabs.map(x=>'<button class="tab" role="tab" aria-selected="'+(S.tab===x[0])+'" data-tab="'+x[0]+'">'+x[1]+'</button>').join('');
}
$("tabs").addEventListener("click",e=>{
  const b=e.target.closest("[data-tab]"); if(!b) return;
  S.tab=b.dataset.tab; render();
});
document.addEventListener("input",e=>{ if(e.target.id==="notes") S.notes=e.target.value; });

function render(){
  setScore(); renderTabs();
  if(S.tab==="rules") viewRules();
  else if(S.phase!=="intro" && S.tab==="log") viewLog();
  else if(S.phase!=="intro" && S.tab==="store") viewStore();
  else if(S.phase==="intro") viewIntro();
  else if(S.phase==="case") viewCase();
  else if(S.phase==="done") viewStepDone();
  else if(S.phase==="accuse") viewAccuse();
  else if(S.phase==="result") viewResult();
  else if(S.phase==="review") viewReview();
  window.scrollTo({top:0,behavior:"auto"});
}
function pen(n){ if(S.scoring) S.score=Math.max(0,S.score-n); }
function rankOf(sc){ return sc>=90?"Consul":sc>=70?"Senator":sc>=50?"Római polgár":"Tanuló nyomozó"; }

/* ---------- ESEMÉNYEK ---------- */
app.addEventListener("click",ev=>{
  const t=ev.target.closest("[data-act]"); if(!t) return;
  const act=t.dataset.act;
  if(t.tagName==="INPUT") return; // change eseményre bízzuk
  if(act==="start"){ S.scoring=!$("teach").checked; S.tab="game"; S.phase="case"; S.step=0; S.score=100; S.sel=[]; S.fb=null; S.hintShown=false; S.tries=0; render(); }
  else if(act==="mark"){ S.marks[t.dataset.id]=t.dataset.v; const y=window.scrollY; renderKeep(y); }
  else if(act==="hint"){ S.hintShown=true; pen(5); renderKeep(window.scrollY); }
  else if(act==="check"){ check(); }
  else if(act==="next"){
    if(S.step===STEPS.length-1){ S.phase="accuse"; }
    else { S.step++; S.phase="case"; S.sel=[]; S.fb=null; S.hintShown=false; S.tries=0; }
    render();
  }
  else if(act==="submit"){ submit(); }
  else if(act==="back"){ S.ret=S.phase; S.rev=S.clues.length-1; S.phase="review"; render(); }
  else if(act==="backacc"){ S.ret="accuse"; S.rev=S.clues.length-1; S.phase="review"; render(); }
  else if(act==="revprev"){ if(S.rev>0) S.rev--; render(); }
  else if(act==="revnext"){ if(S.rev<S.clues.length-1) S.rev++; render(); }
  else if(act==="revret"){ S.phase=S.ret; render(); }
  else if(act==="revi"){ S.tab="game"; if(S.phase!=="review") S.ret=S.phase; S.rev=+t.dataset.i; S.phase="review"; render(); }
  else if(act==="restart"){ Object.assign(S,{phase:"intro",step:0,score:100,tries:0,sel:[],fb:null,hintShown:false,clues:[],elim:{},marks:{},notes:"",rev:0,ret:"case",tab:"game",acc:{killer:null,motive:null,ev:[],court:null},accErr:null,result:null}); render(); }
});
app.addEventListener("change",ev=>{
  const t=ev.target; if(!t.dataset||!t.dataset.act) return;
  const act=t.dataset.act, y=window.scrollY;
  if(act==="pick"){
    const st=STEPS[S.step];
    if(st.type==="multi"){ S.sel=[...app.querySelectorAll('input[name="ans"]:checked')].map(i=>i.value); }
    else S.sel=[t.value];
    S.fb=null; renderKeep(y);
  } else if(act==="killer"){ S.acc.killer=t.value; renderKeep(y); }
  else if(act==="motive"){ S.acc.motive=t.value; renderKeep(y); }
  else if(act==="court"){ S.acc.court=t.value; renderKeep(y); }
  else if(act==="ev"){
    const cur=[...app.querySelectorAll('input[data-act="ev"]:checked')].map(i=>i.value);
    if(cur.length>4){ t.checked=false; S.accErr="Legfeljebb négy bizonyítékot választhat."; }
    else { S.acc.ev=cur; S.accErr=null; }
    renderKeep(y);
  }
});
function renderKeep(y){ setScore(); renderTabs();
  if(S.tab==="rules") viewRules(); else if(S.phase!=="intro" && S.tab==="store") viewStore(); else if(S.phase!=="intro" && S.tab==="log") viewLog(); else
  if(S.phase==="case") viewCase(); else if(S.phase==="accuse") viewAccuse(); else if(S.phase==="done") viewStepDone(); else render();
  window.scrollTo(0,y);
}

function check(){
  const st=STEPS[S.step];
  if(arrEq(S.sel,st.correct)){
    S.clues.push(st.clue);
    if(st.elim) Object.assign(S.elim,st.elim);
    S.phase="done"; S.fb=null; render();
  } else {
    S.tries++; pen(10);
    let text="Nem egészen pontos a válasz"+(S.scoring?" (−10 pont)":"")+". Gondolja át újra.";
    if(S.tries>=2 && !S.hintShown){ S.hintShown=true; }
    if(S.tries>=3){
      text="Három sikertelen próbálkozás után a helyes megoldás: <b>"+st.correct.map(c=>st.opts.find(o=>o[0]===c)[1]).join("; ")+"</b><br>"+st.expl;
    }
    S.fb={kind:"bad",text};
    if(S.tries>=3){ S.sel=st.correct.slice(); }
    renderKeep(window.scrollY);
  }
}

function submit(){
  const a=S.acc, lines=[]; let pts=0;
  const kOK=a.killer==="sem"; if(!kOK) pts+=20;
  lines.push(["Gyilkos: "+SN[a.killer], kOK?"helyes":"helytelen (helyes: Gaius Sempronius Varro)"]);
  const mOK=a.motive==="a"; if(!mOK) pts+=10;
  lines.push(["Indíték", mOK?"helyes":"helytelen (helyes: Varro el akarta hallgattatni a vétójogú tribunust)"]);
  const good=a.ev.filter(id=>WARE.find(w=>w.id===id).rel).length;
  const bad=4-good; pts+=bad*5;
  lines.push(["Bizonyítékok ("+good+"/4 releváns)", bad?("−"+bad*5+" pont"):"mind releváns"]);
  const cOK=a.court==="c"; if(!cOK) pts+=10;
  lines.push(["Hatáskör", cOK?"helyes (praetor)":"helytelen (helyes: praetor)"]);
  pen(pts);
  S.result={lines,rank:rankOf(S.score)}; S.phase="result"; render();
}

render();
</script>
