<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>A nemzetiszocialista Németország – érettségi felkészítő</title>
<style>
/* Elrendezés: sticky fejléc + lapfülek, egy oszlopos, olvasásra és gyakorlásra optimalizált tartalom (max. ~52rem). Hangnem: visszafogott, levéltári; a téma súlya miatt nincs díszítő piros-fekete színvilág. */
:root{
  --bg:#eceff3; --surface:#ffffff; --surface2:#e3e8ee; --fg:#1b2129; --muted:#566170; --line:#cfd6df;
  --accent:#2a4a72; --accent-fg:#ffffff; --mark:#a86f0c; --markbg:#f6e8c8;
  --ok:#25704a; --okbg:#dcefe3; --bad:#a3342b; --badbg:#f6dcd8;
  --f-disp:'Spectral',Georgia,'Times New Roman',serif;
  --f-body:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#12171d; --surface:#1a212a; --surface2:#232c37; --fg:#e5e9ee; --muted:#9aa5b2; --line:#2e3946;
  --accent:#8fb4e0; --accent-fg:#0e1620; --mark:#e2a940; --markbg:#3a2f16;
  --ok:#6fc293; --okbg:#173325; --bad:#ec8b81; --badbg:#3d1d1a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12171d; --surface:#1a212a; --surface2:#232c37; --fg:#e5e9ee; --muted:#9aa5b2; --line:#2e3946;
  --accent:#8fb4e0; --accent-fg:#0e1620; --mark:#e2a940; --markbg:#3a2f16;
  --ok:#6fc293; --okbg:#173325; --bad:#ec8b81; --badbg:#3d1d1a; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:16px/1.55 var(--f-body);margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--surface);z-index:30}
h1,h2,h3{font-family:var(--f-disp);line-height:1.2;text-wrap:balance;margin:0}
h1{font-size:clamp(1.7rem,4.6vw,2.4rem);font-weight:700}
h2{font-size:1.4rem;font-weight:700}
h3{font-size:1.1rem;font-weight:700}
p{margin:0}
a{color:var(--accent)}
:focus-visible{outline:3px solid var(--mark);outline-offset:2px;border-radius:4px}
.wrap{max-width:52rem;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:baseline;gap:.75rem;padding-block:.6rem .2rem;flex-wrap:wrap}
.brand b{font-family:var(--f-disp);font-size:1.15rem}
.brand span{color:var(--muted);font-size:.85rem}
nav.tabs{display:flex;gap:.25rem;overflow-x:auto;padding-bottom:.5rem;scrollbar-width:thin}
nav.tabs a{white-space:nowrap;text-decoration:none;color:var(--fg);padding:.45rem .8rem;border-radius:999px;font-size:.92rem;font-weight:500;border:1px solid transparent}
nav.tabs a:hover{background:var(--surface2)}
nav.tabs a[aria-current="page"]{background:var(--accent);color:var(--accent-fg)}
main{padding-block:1.5rem 3rem;display:flex;flex-direction:column;gap:1.75rem;outline:none}
main>section,main>header{display:flex;flex-direction:column;gap:.8rem;min-width:0}
.lead{color:var(--muted);max-width:44rem}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:1rem 1.1rem;min-width:0}
.grid{display:grid;gap:.75rem;grid-template-columns:repeat(auto-fit,minmax(13rem,1fr))}
.stat{display:flex;flex-direction:column;gap:.15rem}
.stat .n{font-family:var(--f-disp);font-size:1.9rem;font-weight:700;font-variant-numeric:tabular-nums}
.stat .l{color:var(--muted);font-size:.85rem}
.bar{height:6px;background:var(--surface2);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--mark)}
.btn{font:inherit;font-weight:500;background:var(--accent);color:var(--accent-fg);border:1px solid var(--accent);border-radius:8px;padding:.55rem 1rem;cursor:pointer;min-height:2.5rem}
.btn:hover{filter:brightness(1.08)}
.btn.sec{background:transparent;color:var(--accent);border-color:var(--accent)}
.btn:disabled{opacity:.5;cursor:default}
.row{display:flex;gap:.6rem;flex-wrap:wrap;align-items:center}
.muted{color:var(--muted)}
.small{font-size:.88rem}
.tag{display:inline-block;font-size:.75rem;letter-spacing:.06em;text-transform:uppercase;font-weight:600;color:var(--mark);}
.status{min-height:1.4em;font-weight:500}
.steps{list-style:none;padding:0;margin:0;display:grid;gap:.6rem}
.steps li{display:grid;grid-template-columns:auto 1fr auto;gap:.8rem;align-items:center}
.steps .pg{font-variant-numeric:tabular-nums;color:var(--muted);font-size:.85rem;white-space:nowrap}
.steps .k{font-family:var(--f-disp);font-weight:700;color:var(--mark);font-size:1.15rem;min-width:1.2rem}
/* idővonal-rendezés */
.sortlist{list-style:none;margin:0;padding:0;display:grid;gap:.5rem}
.sortlist li{display:grid;grid-template-columns:2rem 1fr auto;gap:.6rem;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:.55rem .7rem}
.sortlist li.ok{background:var(--okbg);border-color:var(--ok)}
.sortlist li.no{background:var(--badbg);border-color:var(--bad)}
.sortlist .pos{font-variant-numeric:tabular-nums;color:var(--muted);font-weight:600}
.sortlist .yr{display:block;font-size:.82rem;font-weight:600;color:var(--muted)}
.mv{display:flex;gap:.3rem}
.mv button{font:inherit;width:2.4rem;height:2.4rem;border-radius:8px;border:1px solid var(--line);background:var(--surface2);color:var(--fg);cursor:pointer}
.mv button:disabled{opacity:.35;cursor:default}
.tl{list-style:none;margin:0;padding:0 0 0 1rem;border-left:2px solid var(--line);display:grid;gap:1rem}
.tl>li{position:relative;display:grid;gap:.2rem}
.tl>li::before{content:"";position:absolute;left:calc(-1rem - 6px);top:.5rem;width:10px;height:10px;border-radius:50%;background:var(--mark)}
.tl .y{font-family:var(--f-disp);font-weight:700;font-size:1.05rem}
.tl ul{margin:.2rem 0 0;padding-left:1.1rem}
/* kártyák */
.flash{min-height:13rem;display:flex;flex-direction:column;gap:.6rem;justify-content:center}
.flash .term{font-family:var(--f-disp);font-size:1.7rem;font-weight:700}
.flash .def{font-size:1.05rem}
/* csoportosítás */
.assign{display:grid;gap:.5rem}
.assign .it{display:grid;gap:.4rem;grid-template-columns:1fr minmax(11rem,15rem);align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:.6rem .7rem}
.assign .it.ok{background:var(--okbg);border-color:var(--ok)}
.assign .it.no{background:var(--badbg);border-color:var(--bad)}
.assign .fb{grid-column:1/-1;font-size:.88rem}
select,textarea{font:inherit;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:.5rem .6rem;width:100%;min-width:0}
textarea{min-height:6rem;resize:vertical}
@media (max-width:560px){.assign .it{grid-template-columns:1fr}}
/* források, kifejtés */
details.dt{background:var(--surface);border:1px solid var(--line);border-radius:10px}
details.dt>summary{cursor:pointer;padding:.85rem 1.1rem;font-family:var(--f-disp);font-weight:700;font-size:1.1rem;list-style:none;display:flex;justify-content:space-between;gap:1rem;align-items:center}
details.dt>summary::-webkit-details-marker{display:none}
details.dt>summary::after{content:"+";font-family:var(--f-body);color:var(--accent);font-size:1.3rem}
details.dt[open]>summary::after{content:"–"}
.dbody{padding:0 1.1rem 1.1rem;display:grid;gap:.9rem}
.srcbox{background:var(--surface2);border-radius:8px;padding:.8rem .9rem;display:grid;gap:.4rem;font-size:.95rem}
.srcbox ul{margin:.2rem 0 0;padding-left:1.1rem;display:grid;gap:.25rem}
.qa{display:grid;gap:.5rem;border-top:1px solid var(--line);padding-top:.8rem}
.qa .q{font-weight:600}
.model{background:var(--markbg);border-radius:8px;padding:.7rem .9rem;font-size:.95rem;display:grid;gap:.3rem}
.model ul{margin:0;padding-left:1.1rem}
.chk{display:grid;gap:.4rem}
.chk label{display:flex;gap:.6rem;align-items:flex-start;cursor:pointer}
.chk input{margin-top:.3rem;width:1.1rem;height:1.1rem;flex:none}
/* kvíz */
.opts{display:grid;gap:.5rem}
.opt{font:inherit;text-align:left;background:var(--surface);color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:.7rem .9rem;cursor:pointer;min-height:2.75rem}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt.ok{background:var(--okbg);border-color:var(--ok)}
.opt.no{background:var(--badbg);border-color:var(--bad)}
.opt:disabled{cursor:default;color:var(--fg)}
.expl{background:var(--surface2);border-radius:8px;padding:.75rem .9rem;font-size:.95rem}
.prog{display:flex;justify-content:space-between;color:var(--muted);font-size:.9rem;font-variant-numeric:tabular-nums}
.res td,.res th{padding:.35rem .6rem;text-align:left;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
.res{border-collapse:collapse;width:100%}
.tblwrap{overflow-x:auto}
footer.note{border-top:1px solid var(--line);padding-top:1rem;color:var(--muted);font-size:.85rem;display:grid;gap:.4rem}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
</style>
</head>

 {t:'2. Az NSDAP programja, 1922 (részletek)',pg:'169. o.',
  d:['<p>A tankönyv a program több pontját közli. Tartalmi kivonat:</p>',
     '<ul><li>1–2. A népek önrendelkezési jogára hivatkozva Nagy-Németország; a németeknek más nemzetekkel azonos jogok; a versailles-i és a saint-germain-i béke hatályon kívül helyezése.</li><li>3. Terület és föld a nép ellátására és a népfelesleg letelepítésére.</li><li>4. Csak a „néptárs” lehet állampolgár, vagyis akinek ereiben német vér folyik; zsidó nem lehet néptárs.</li><li>7. Az állam gondoskodjon az állampolgárok megélhetéséről.</li><li>11. A munka és fáradság nélküli jövedelem megszüntetése.</li><li>12. A háborús nyereségek beszolgáltatása.</li><li>13. A társaságok tulajdonában lévő üzemek államosítása.</li><li>15. Az öregekről való gondoskodás kiépítése.</li><li>16. Egészséges polgári középosztály; a nagy áruházak köztulajdonba vétele és olcsó bérbeadása kisiparosoknak.</li><li>23. A sajtóban csak német nyelvű, német tulajdonú, németek által szerkesztett lapok.</li></ul>'],
  q:[
   ['Csoportosítsd a témákat! Mely területeket érint a program?',['Nemzeti-területi (önrendelkezés, Nagy-Németország, a békék felülvizsgálata, föld).','Faji (állampolgárság, a zsidók kizárása, a sajtó német jellege).','Szociális-gazdasági (megélhetés, jövedelem, államosítás, öregek ellátása, háborús nyereségek).','Középosztály-védelem (kisiparosok, nagy áruházak).']],
   ['Milyen sérelmekre és indulatokra épít?',['A versailles-i béke igazságtalansága és a határon túli németek helyzete.','A háború utáni nélkülözés, a „meggazdagodók” és a nagytőke elleni harag.','Az ellenségkép: a zsidóság felelőssé tétele.']],
   ['Mely társadalmi rétegeket célozza meg, és milyen ideológiák hatása ismerhető fel?',['Munkások, kisiparosok és kiskereskedők, idősek, a „németség” egésze.','Nacionalizmus, fajelmélet és antiszemitizmus; szociális és antikapitalista elemek (államosítás, jövedelemkorlátozás); kispolgári érdekvédelem.','Az egyes ígéretek részben ellentmondanak egymásnak (pl. államosítás és a kisvállalkozók védelme); a program a hatalomszerzést szolgáló demagógia.']]
  ]},
 {t:'3. Hitler a tömegről és a propagandáról (Mein Kampf, 1925)',pg:'170. o., 4–5. ábra',
  d:['<p>Tartalmi kivonat (nem szó szerinti idézet): a propaganda szellemi szintje annál alacsonyabb legyen, minél nagyobb tömegre kell hatnia. A tömeg befogadóképessége korlátozott, értelme kicsiny, felejtő; ezért a propagandának néhány pontra kell szorítkoznia, és ezeket addig kell ismételni, amíg az utolsó ember is megérti. A szónok a hallgatók arcáról azonnal leolvashatja, hat-e a mondanivalója.</p>','<p>A hozzá tartozó képeken: katonás rendben álló, hatalmas tömegek előtt szónokló Hitler; egy másik felvételen a feléje nyúló, lelkes tömeg.</p>'],
  q:[
   ['Milyen szerepet szánt a tömeggyűléseknek Hitler?',['A tömeg érzelmi befolyásolása és mozgósítása, a vezér és a követők egységének látványos megjelenítése.']],
   ['Mi volt a véleménye a tömegről?',['Lenéző: szerinte a tömeg értelme kicsiny, felejt, és érzelmekre hat.','Ebből következett, hogy az embereket nem érvekkel, hanem leegyszerűsítéssel és érzelmi hatással kell megnyerni.']],
   ['Hogyan igazodtak ehhez a szónoklatok eszközei?',['Rövid, egyszerű jelmondatok és állandó ismétlés.','Gesztusok, a hallgatóság reakciójához igazodó szónoklat, tömeglélektani módszerek.','Látványos, szervezett környezet (egyenruhák, sorok, zászlók).']]
  ]},
 {t:'4. A németországi pártok erőviszonyai, 1919–1933 (ábra)',pg:'171. o., 7. ábra',
  d:['<p>Az ábra évenként mutatja a pártcsoportok arányát: a baloldali kommunisták, a kormánypártok és az „alkotmányosság”, valamint a jobboldali polgári pártok és az NSDAP sávját.</p>'],
  q:[
   ['Mely pártok tömegbefolyása nőtt?',['Az ábra szerint a két szélsőséges erőé: az NSDAP-é és a kommunistáké; az alkotmányos pártok sávja a válság idején szűkül.']],
   ['Milyen tényezők játszottak szerepet ebben?',['A gazdasági világválság: munkanélküliség, nyomor, kilátástalanság.','A polgári pártok és a szociáldemokraták nem tudtak egységesen fellépni a szélsőségekkel szemben.','1932-ben a szavazók többsége valamelyik szélsőséges pártra szavazott (NSDAP 37,8%, KPD 14,3%).']],
   ['Hogyan lehetett volna megakadályozni az NSDAP hatalomra kerülését, és mit tehetett volna az elnök?',['A tankönyv ezt a kérdést a weimari alkotmány alapján (18. téma, 160. o.) kéri megválaszolni. Ez az anyag nem része a feltöltött fejezetnek; ezt a leckét ott kell áttekintened.','A 19. lecke alapján annyi látszik: Hindenburg eleinte elzárkózott Hitler kancellárrá nevezésétől, később mégis kinevezte.']]
  ]},
 {t:'5. Leni Riefenstahl visszaemlékezései Hitlerről',pg:'172. o., háttérolvasmány',
  d:['<p>Riefenstahl (1902–2003) filmrendező, a nemzetiszocialista propagandafilmek egyik alkotója (például <em>Az akarat diadala</em>; a berlini olimpiáról is forgatott). A tankönyv három részletet közöl. Tartalmi kivonat:</p>',
     '<ul><li><strong>1932, a sportpalotai gyűlés:</strong> Hitler beszéde, szónoki ereje, a tömeg átélése; a szerző megrendült, magával ragadta a hatás.</li><li><strong>1935, karácsonyi magánbeszélgetés:</strong> Hitler civilben, szerénynek és barátságosnak mutatja magát; a könyvekről, az olvasásról beszél.</li><li><strong>1944, az utolsó találkozás:</strong> a szerző ellentmondásos érzései; Hitler viselkedése és megjelenése megváltozik; a szerzőben a varázs elmúlik, mintha transzból ébredne.</li></ul>'],
  q:[
   ['Hogyan jellemzi a szerző Hitler beszédeinek eszközrendszerét, és milyen hatást váltott ki?',['Szuggesztív, szenvedélyes előadásmód, a tömeggel való szoros kapcsolat; a hallgatóság, köztük a szerző is, mély hatás alá került.']],
   ['Milyen benyomást akart tenni magáról Hitler? Hol érezhető a mesterkéltség?',['Műveltnek, szerénynek, „civil” embernek akart látszani (könyvek, olvasmányok).','A szerep a magánbeszélgetésben is tudatosan alakított; a szereplés a gyűlések látványosságával ellentétben csendes, de ugyanúgy a hatáskeltést szolgálja.']],
   ['Mennyiben változott a szerző véleménye Hitlerről? Milyen forráskritikai megjegyzés tehető?',['Kezdeti lenyűgözöttség, majd a fokozatos kiábrándulás; 1944-re a varázs megszűnik.','A szöveg visszaemlékezés, utólag keletkezett, a szerző a rendszer propagandistája volt: önigazolás lehetősége miatt kritikával kell olvasni.']]
  ]}
];

 {tag:'Hatalomra jutás',q:'Miért hajlottak a jobboldal egyes csoportjai a Hitlerrel való együttműködésre?',o:['Megijedtek a kommunista veszélytől, és úgy gondolták, féken tudják tartani a nemzetiszocialistákat','Hitler lemondott a fajelméletről','A nácik vállalták a versailles-i béke teljesítését','A szociáldemokraták is Hitlert támogatták'],a:0,why:'A kommunista veszélytől megrémült jobboldal tévesen azt hitte, kézben tudja tartani Hitlert.'},

 {tag:'Diktatúra',q:'Mi történt 1934-ben Hindenburg halála után?',o:['Egyesítették az elnöki és a kancellári hatalmat: Hitler „vezér és kancellár” lett','Hitler lemondott a kancellárságról','Új választásokat tartottak, amelyeket a szociáldemokraták nyertek meg','Visszaállították a monarchiát'],a:0,why:'A hatalom a náci párt és a Führer kezében összpontosult.'},

 {tag:'Diktatúra',q:'Kik hajtották végre a hosszú kések éjszakáját?',o:['Az SS és a Gestapo','Az SA és a hadsereg','A hadsereg és a Reichstag őrsége','A Népszövetség egységei'],a:0,why:'Az akciót az SS (védőosztag) és a Gestapo (titkos államrendőrség) hajtotta végre.'},

 {tag:'Gazdaság',q:'Mit jelentett a Neuer Plan?',o:['A devizagazdálkodás korlátozását, a ki- és behozatal állami ellenőrzését','A szabad piacgazdaság visszaállítását','A parasztbirtokok felosztását','A hadkötelezettség megszüntetését'],a:0,why:'A rendelkezések nyomán nőtt a német aranytartalék.'},
 {tag:'Gazdaság',q:'Mi volt a fegyverkezés újraindításának gazdasági jelentősége és következménye?',o:['Állami megrendelést jelentett túltermelés nélkül; az államadósság azonban kezelhetetlenebbé vált, így a háború lett a kiút','Csökkentette a hadsereg létszámát és a munkanélküliséget','Külföldi hitelből fedezték, ezért adósság nem keletkezett','A Népszövetség finanszírozta'],a:0,why:'A hadsereg növelése százezreket vont ki a munkaerőpiacról is; a gazdasági fellendülés növelte Hitler népszerűségét.'},

 {tag:'Források',q:'Mit gondolt a tömegről Hitler az 1925-ös szöveg alapján, és mi következett ebből a propagandára?',o:['A tömeg befogadóképessége korlátozott, ezért néhány pontra kell szorítkozni, és ezeket sokat ismételni','A tömeg kritikus és művelt, ezért hosszas érvelés szükséges','A tömeg passzív, ezért a propaganda felesleges','A tömeget tudományos érvekkel kell meggyőzni'],a:0,why:'A propaganda színvonala igazodjon a legkevésbé művelt hallgatóhoz; az ismétlés a hatás eszköze.'},

  '<ol class="sortlist" id="sl"></ol><div class="row"><button class="btn" id="chk">Ellenőrzés</button><button class="btn sec" id="shf">Újrakeverés</button></div>'+
  '<p class="status" id="sst" role="status" aria-live="polite"></p></section>'+
  '<section aria-labelledby="h-tl"><h2 id="h-tl">A teljes idővonal</h2><ol class="tl">'+

  '</ol></section>';
  var n=TIMELINE_SORT.length,order,checked=false;
  function init(){
    do{order=shuffle(TIMELINE_SORT.map(function(_,i){return i}))}while(order.every(function(v,i){return v===i}));
    checked=false;draw();document.getElementById('sst').textContent='';
  }
  function draw(focusId){
    var sl=document.getElementById('sl');
    sl.innerHTML=order.map(function(v,p){
      var e=TIMELINE_SORT[v];var cls='';
      if(checked)cls=(v===p)?'ok':'no';
      return '<li class="'+cls+'"><span class="pos">'+(p+1)+'.</span><span>'+esc(e.t)+(checked?'<span class="yr">'+esc(e.y)+'</span>':'')+'</span>'+
      '<span class="mv"><button data-p="'+p+'" data-d="-1" aria-label="Feljebb: '+esc(e.t)+'"'+(p===0?' disabled':'')+'>▲</button><button data-p="'+p+'" data-d="1" aria-label="Lejjebb: '+esc(e.t)+'"'+(p===n-1?' disabled':'')+'>▼</button></span></li>';
    }).join('');
    if(focusId){var b=sl.querySelector('button[data-p="'+focusId[0]+'"][data-d="'+focusId[1]+'"]');if(b&&!b.disabled)b.focus();else{var any=sl.querySelector('button[data-p="'+focusId[0]+'"]:not(:disabled)');if(any)any.focus()}}
  }
  document.getElementById('sl').addEventListener('click',function(ev){
    var b=ev.target.closest('button');if(!b||b.disabled)return;
    var p=+b.dataset.p,d=+b.dataset.d,q=p+d;if(q<0||q>=n)return;
    var t=order[p];order[p]=order[q];order[q]=t;checked=false;
    document.getElementById('sst').textContent='';
    draw([q,d]);
  });
  document.getElementById('chk').addEventListener('click',function(){
    checked=true;draw();
    var ok=order.filter(function(v,p){return v===p}).length;

    if(ok===n){st.textContent='Hibátlan: mind a '+n+' esemény a helyén van.';store.set('sortOk',true)}
    else st.textContent=ok+' / '+n+' esemény van a helyén. A pirosan jelölteket mozgasd át, majd ellenőrizz újra.';
  });

  init();
}

function vTerms(){
  view.innerHTML='<header><h1>Fogalmak</h1><p class="lead">Olvasd el a fogalmat, mondd el a meghatározását, majd fordítsd meg a kártyát, és értékeld magad.</p></header>'+
  '<section><div class="row"><label class="row" style="gap:.5rem"><input type="checkbox" id="only"> Csak a még nem „tudom” fogalmak</label></div>'+
  '<div class="prog"><span id="cnt"></span><span id="kn"></span></div><div class="card flash" id="fc" aria-live="polite"></div>'+
  '<div class="row" id="ctl"></div><div class="row"><button class="btn sec" id="rst">Haladás törlése</button></div></section>';
  var known=store.get('known',{});var cur=0,flipped=false;
  function list(){var only=document.getElementById('only').checked;return TERMS.map(function(_,i){return i}).filter(function(i){return !only||known[i]!==1})}
  function draw(focusSel){
    var L=list();var fc=document.getElementById('fc'),ctl=document.getElementById('ctl');
    var kn=0;Object.keys(known).forEach(function(k){if(known[k]===1)kn++});
    document.getElementById('kn').textContent='„Tudom”: '+kn+' / '+TERMS.length;
    if(!L.length){fc.innerHTML='<span class="term">Minden fogalmat tudsz.</span><p class="muted">Vedd ki a jelölést a szűrőből, ha át szeretnéd nézni az egész készletet.</p>';ctl.innerHTML='';document.getElementById('cnt').textContent='';return}
    if(cur>=L.length)cur=0;
    var i=L[cur];var t=TERMS[i];
    document.getElementById('cnt').textContent=(cur+1)+' / '+L.length+' kártya';
    fc.innerHTML='<span class="tag">Fogalom</span><span class="term">'+esc(t[0])+'</span>'+(flipped?'<p class="def">'+esc(t[1])+'</p>':'<p class="muted">Mondd el a meghatározást, majd fordítsd meg.</p>');
    ctl.innerHTML=(flipped?
      '<button class="btn" data-a="know" id="b1">Tudom</button><button class="btn sec" data-a="again" id="b2">Gyakorolnom kell</button>':
      '<button class="btn" data-a="flip" id="b0">Kártya megfordítása</button>')+
      '<button class="btn sec" data-a="prev" aria-label="Előző kártya">◀</button><button class="btn sec" data-a="next" aria-label="Következő kártya">▶</button>';
    if(focusSel){var f=ctl.querySelector(focusSel);if(f)f.focus()}
  }
  document.getElementById('ctl').addEventListener('click',function(ev){
    var b=ev.target.closest('button');if(!b)return;var a=b.dataset.a;var L=list();
    if(a==='flip'){flipped=true;draw('#b1')}
    else if(a==='know'||a==='again'){known[L[cur]]=(a==='know'?1:0);store.set('known',known);flipped=false;
      if(document.getElementById('only').checked&&a==='know'){}else cur++;
      draw('#b0')}
    else if(a==='next'){cur=(cur+1)%L.length;flipped=false;draw('#b0')}
    else if(a==='prev'){cur=(cur-1+L.length)%L.length;flipped=false;draw('#b0')}
  });
  document.getElementById('only').addEventListener('change',function(){cur=0;flipped=false;draw()});
  document.getElementById('rst').addEventListener('click',function(){known={};store.set('known',known);cur=0;flipped=false;draw()});
  draw();
}

/* ====== KVÍZ ====== */
function vQuiz(){
  view.innerHTML='<header><h1>Kvíz</h1><p class="lead">Feleletválasztós kérdések a teljes leckéből. Minden válasz után megkapod az indoklást.</p></header><section id="qz"></section>';
  var box=document.getElementById('qz');
  function start(){
    box.innerHTML='<div class="card" style="display:grid;gap:.8rem"><h2>Válassz módot</h2><div class="row"><button class="btn" data-n="10">Gyors kör: 10 véletlen kérdés</button><button class="btn sec" data-n="'+QUIZ.length+'">Teljes kvíz: '+QUIZ.length+' kérdés</button></div></div>';
    box.querySelector('.card').addEventListener('click',function(ev){var b=ev.target.closest('button');if(b)run(shuffle(QUIZ.map(function(_,i){return i})).slice(0,+b.dataset.n))});
  }
  function run(ids){
    var pos=0,score=0,wrong=[],tagStat={};
    function show(){
      var q=QUIZ[ids[pos]];var idx=shuffle(q.o.map(function(_,i){return i}));var answered=false;
      box.innerHTML='<div style="display:grid;gap:.9rem"><div class="prog"><span>'+(pos+1)+' / '+ids.length+'. kérdés</span><span>Pontszám: '+score+'</span></div><div class="bar" aria-hidden="true"><i style="width:'+Math.round(100*pos/ids.length)+'%"></i></div>'+
      '<span class="tag">'+q.tag+'</span><h2 id="qq" tabindex="-1">'+esc(q.q)+'</h2><div class="opts" id="op">'+
      idx.map(function(i){return '<button class="opt" data-i="'+i+'">'+esc(q.o[i])+'</button>'}).join('')+'</div><div id="fb" role="status" aria-live="polite"></div></div>';
      document.getElementById('qq').focus({preventScroll:true});
      document.getElementById('op').addEventListener('click',function(ev){
        var b=ev.target.closest('.opt');if(!b||answered)return;answered=true;
        var pick=+b.dataset.i;var ok=pick===q.a;
        tagStat[q.tag]=tagStat[q.tag]||{c:0,n:0};tagStat[q.tag].n++;
        if(ok){score++;tagStat[q.tag].c++}else wrong.push(ids[pos]);
        box.querySelectorAll('.opt').forEach(function(o){o.disabled=true;var i=+o.dataset.i;if(i===q.a)o.classList.add('ok');else if(i===pick)o.classList.add('no')});
        var last=pos===ids.length-1;
        document.getElementById('fb').innerHTML='<div class="expl"><strong>'+(ok?'Helyes.':'Nem ez a helyes válasz.')+'</strong> '+esc(q.why)+'</div><div class="row" style="margin-top:.7rem"><button class="btn" id="nx">'+(last?'Eredmény':'Következő kérdés')+'</button></div>';
        document.getElementById('nx').focus();
        document.getElementById('nx').addEventListener('click',function(){pos++;if(pos<ids.length)show();else done()});
      });
    }
    function done(){
      var tot=ids.length;var best=store.get('quizBest',null);
      var pct=score/tot;if(!best||pct>best.score/best.total)store.set('quizBest',{score:score,total:tot});
      var rows=Object.keys(tagStat).map(function(k){var s=tagStat[k];return '<tr><td>'+k+'</td><td>'+s.c+' / '+s.n+'</td></tr>'}).join('');
      box.innerHTML='<div style="display:grid;gap:1rem"><h2 id="qq" tabindex="-1">Eredmény: '+score+' / '+tot+' ('+Math.round(100*pct)+'%)</h2>'+
      '<div class="card tblwrap"><table class="res"><thead><tr><th>Témakör</th><th>Helyes</th></tr></thead><tbody>'+rows+'</tbody></table></div>'+
      '<p class="muted">'+(wrong.length?'A tévesen megválaszolt témakörök ismétléséhez használd a Fogalmak és a Kifejtés fület.':'Hibátlan eredmény.')+'</p>'+
      '<div class="row">'+(wrong.length?'<button class="btn" id="rw">Hibás kérdések újra ('+wrong.length+')</button>':'')+'<button class="btn sec" id="nw">Új kvíz</button></div></div>';
      document.getElementById('qq').focus({preventScroll:true});
      var rw=document.getElementById('rw');if(rw)rw.addEventListener('click',function(){run(shuffle(wrong))});
      document.getElementById('nw').addEventListener('click',start);
    }
    show();
  }
  start();
}

/* ====== KIFEJTÉS ====== */
function vEssay(){
  var drafts=store.get('drafts',{});var checks=store.get('essayChecks',{});
  view.innerHTML='<header><h1>Kifejtés</h1><p class="lead">Fogalmazd meg a feleletet saját szavaiddal (vagy vázlatban), majd jelöld meg az ellenőrző listán, mely szempontok szerepeltek benne. A lista a tankönyvi leckéből készült.</p></header><section id="es" style="gap:.7rem"></section>';
  document.getElementById('es').innerHTML=ESSAYS.map(function(e,ei){
    return '<details class="dt"><summary><span>'+esc(e.t)+'</span></summary><div class="dbody"><label class="q" for="e'+ei+'" style="font-weight:600">Vázlat / felelet</label><textarea id="e'+ei+'" data-k="e'+ei+'" style="min-height:9rem" placeholder="Írd ide a feleletedet…"></textarea>'+
    '<div class="chk" role="group" aria-label="Ellenőrző szempontok">'+e.pts.map(function(p,pi){var id='c'+ei+'_'+pi;return '<label><input type="checkbox" id="'+id+'" data-c="'+id+'"><span>'+esc(p)+'</span></label>'}).join('')+'</div>'+
    '<p class="status" id="r'+ei+'" aria-live="polite"></p></div></details>';
  }).join('');
  function upd(ei){var n=0;ESSAYS[ei].pts.forEach(function(_,pi){if(checks['c'+ei+'_'+pi])n++});document.getElementById('r'+ei).textContent='Megjelölt szempontok: '+n+' / '+ESSAYS[ei].pts.length}
  ESSAYS.forEach(function(e,ei){e.pts.forEach(function(_,pi){var id='c'+ei+'_'+pi;var el=document.getElementById(id);if(checks[id])el.checked=true});var t=document.getElementById('e'+ei);if(drafts['e'+ei])t.value=drafts['e'+ei];upd(ei)});
  var esec=document.getElementById('es');
  esec.addEventListener('input',function(ev){var t=ev.target;if(t.tagName==='TEXTAREA'&&t.dataset.k){drafts[t.dataset.k]=t.value;store.set('drafts',drafts)}});
  esec.addEventListener('change',function(ev){var t=ev.target;if(t.dataset&&t.dataset.c){checks[t.dataset.c]=t.checked;store.set('essayChecks',checks);upd(+t.dataset.c.slice(1).split('_')[0])}});
}

route();
})();
</script>
