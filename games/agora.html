<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Az Agóra urai</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=EB+Garamond:ital,wght@0,400;0,600;1,400&family=Source+Sans+3:wght@400;600;700&display=swap">
<style>
/* Elrendezés: asztalon a tábla bal oldalt, a soron lévő játékos és a pontok jobb oldalt; telefonon a soron lévő játékos panelje a tábla fölé kerül. */
:root {
  --bg: #ECE2CB; --surface: #FBF6EA; --surface2: #F3EAD6; --ink: #2B2420; --muted: #6D5D48;
  --line: #D6C29A; --accent: #B04F2A; --accent-ink: #FFFFFF; --sea: #2C6894; --gold: #A87B22;
  --ok: #4F6B2C; --warn: #A3461F; --shadow: 0 10px 30px rgba(60,40,20,.18);
  --f-display: 'Cinzel', 'Trajan Pro', Georgia, serif;
  --f-text: 'Source Sans 3', 'Segoe UI', system-ui, sans-serif;
  --f-quote: 'EB Garamond', Garamond, Georgia, serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #17202B; --surface: #212C3A; --surface2: #2A3748; --ink: #F1E8D6; --muted: #B9AA92;
  --line: #3E4E62; --accent: #E2805A; --accent-ink: #1B1410; --sea: #86B7DC; --gold: #D9B25E;
  --ok: #9DBB6A; --warn: #F0956E; --shadow: 0 10px 30px rgba(0,0,0,.45); color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #17202B; --surface: #212C3A; --surface2: #2A3748; --ink: #F1E8D6; --muted: #B9AA92;
  --line: #3E4E62; --accent: #E2805A; --accent-ink: #1B1410; --sea: #86B7DC; --gold: #D9B25E;
  --ok: #9DBB6A; --warn: #F0956E; --shadow: 0 10px 30px rgba(0,0,0,.45); color-scheme: dark; }

* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-text); font-size: 15px; line-height: 1.4;
  padding-block: 0 28px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
button { font: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible, select:focus-visible, summary:focus-visible { outline: 3px solid var(--sea); outline-offset: 2px; }
.top { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding-block: 14px 12px; max-width: 1400px; margin: 0 auto; }
.brand { display: flex; flex-direction: column; margin-right: auto; min-width: 0; }
.brand h1 { font-family: var(--f-display); font-weight: 700; font-size: 1.5rem; margin: 0; letter-spacing: .02em; text-wrap: balance; }
.brand span { font-family: var(--f-quote); font-style: italic; color: var(--accent); font-size: 1.02rem; }
.clock { font-variant-numeric: tabular-nums; font-weight: 700; padding: 6px 12px; border-radius: 999px; background: var(--surface); border: 1px solid var(--line); }
.btn { border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 10px; padding: 8px 14px; font-weight: 600; }
.btn:hover { background: var(--surface2); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.primary:hover { filter: brightness(1.06); }
.btn.big { font-size: 1.15rem; padding: 12px 22px; border-radius: 12px; }
.btn:disabled { opacity: .45; cursor: not-allowed; }

.layout { display: grid; grid-template-columns: minmax(0, 1fr) 380px; grid-template-areas: "board turn" "board side"; grid-template-rows: auto 1fr;
  gap: 18px; max-width: 1400px; margin: 0 auto; align-items: start; }
#turn { grid-area: turn; min-width: 0; }
.board { grid-area: board; align-self: start; }
.side { grid-area: side; display: flex; flex-direction: column; gap: 14px; min-width: 0; }
@media (max-width: 980px) { .layout { grid-template-columns: minmax(0, 1fr); grid-template-areas: "turn" "board" "side"; grid-template-rows: auto; } }
.board { background: var(--surface); border-radius: 14px; box-shadow: var(--shadow); padding: 8px; min-width: 0; }
.board svg { width: 100%; height: auto; display: block; border-radius: 8px; }
.boardtools { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; padding: 8px 4px 2px; color: var(--muted); font-size: .88rem; }
.pawn { transition: transform .16s ease-out; }
.pawn.active circle.ring { animation: pulse 1.2s ease-in-out infinite; }
@keyframes pulse { 0%,100% { opacity: .9; } 50% { opacity: .2; } }

.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; min-width: 0; }
.panel h2 { font-family: var(--f-display); font-size: .82rem; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); margin: 0 0 10px; font-weight: 700; }
.turn-name { font-family: var(--f-display); font-weight: 700; font-size: 1.45rem; display: flex; align-items: center; gap: 10px; }
.chip { width: 16px; height: 16px; border-radius: 50%; display: inline-block; flex: none; border: 2px solid #fff; box-shadow: 0 0 0 1px rgba(0,0,0,.25); }
.roles { color: var(--muted); font-size: .93rem; margin: 6px 0 12px; }
.roles b { color: var(--ink); }
.rollrow { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
.dice { display: flex; gap: 8px; }
.die { width: 52px; height: 52px; border-radius: 11px; background: #FFFDF6; border: 2px solid #2B2420; display: grid;
  grid-template: repeat(3, 1fr) / repeat(3, 1fr); padding: 6px; box-shadow: 0 3px 0 #2B2420; flex: none; }
.die i { width: 9px; height: 9px; border-radius: 50%; background: #B04F2A; place-self: center; visibility: hidden; }
.die i.on { visibility: visible; }
.dice.spin .die { animation: wob .12s linear infinite; }
@keyframes wob { 50% { transform: rotate(8deg) scale(1.04); } }
.status { font-size: .95rem; color: var(--muted); }
.banner { border-radius: 10px; padding: 9px 12px; font-weight: 600; background: var(--accent); color: var(--accent-ink); margin-bottom: 10px; }

table.sc { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
table.sc th { text-align: left; font-size: .76rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 600; padding: 0 4px 6px; }
table.sc td { padding: 7px 4px; border-top: 1px solid var(--line); }
table.sc td.num { text-align: right; font-weight: 700; }
table.sc tr.cur td { background: var(--surface2); }
.tag { font-size: .72rem; border-radius: 999px; padding: 1px 7px; margin-left: 4px; border: 1px solid var(--line); color: var(--muted); white-space: nowrap; }
.tag.ex { background: var(--ink); color: var(--surface); border-color: var(--ink); }
.decks { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; }
.deck { border-radius: 8px; color: #fff; text-align: center; padding: 6px 2px; font-family: var(--f-display); font-weight: 700; }
.deck small { display: block; font-family: var(--f-text); font-weight: 600; font-size: .78rem; opacity: .95; }
.deck.empty { opacity: .3; }
.log { list-style: none; margin: 0; padding: 0; max-height: 220px; overflow-y: auto; font-size: .9rem; }
.log li { padding: 5px 0; border-top: 1px dashed var(--line); }
.log li:first-child { border-top: 0; }

.setup .row { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
.seg button { border: 1px solid var(--line); background: var(--surface2); color: var(--ink); padding: 7px 14px; border-radius: 9px; font-weight: 600; }
.seg button[aria-pressed="true"] { background: var(--sea); color: var(--accent-ink); border-color: var(--sea); }
.setup label { font-size: .85rem; color: var(--muted); display: block; margin: 8px 0 4px; }
.setup input[type=text], .modal input { width: 100%; padding: 9px 11px; border-radius: 9px; border: 1px solid var(--line); background: var(--surface2); color: var(--ink); font: inherit; }
.namegrid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.namegrid div { display: flex; align-items: center; gap: 8px; min-width: 0; }
.example { font-size: .82rem; color: var(--muted); margin: 4px 0 0; }

.overlay { position: fixed; inset: 0; background: rgba(20,14,8,.62); z-index: 20; display: flex; align-items: center; justify-content: center;
  padding: max(14px, env(safe-area-inset-top, 0px)) max(14px, env(safe-area-inset-right, 0px)) max(14px, env(safe-area-inset-bottom, 0px)) max(14px, env(safe-area-inset-left, 0px)); overflow-y: auto; }
.modal { background: var(--surface); color: var(--ink); border-radius: 16px; box-shadow: var(--shadow); width: 100%; max-width: 660px; padding: 20px; margin: auto; min-width: 0; }
.modal.wide { max-width: min(1180px, 100%); }
.modal h3 { font-family: var(--f-display); font-size: 1.25rem; margin: 0 0 8px; text-wrap: balance; }
.modal .actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 16px; }
.modal p { margin: 0 0 10px; }
.zoomscroll { overflow: auto; max-height: 72vh; border: 1px solid var(--line); border-radius: 10px; background: #F4EAD3; }
.zoomscroll svg { width: 1100px; max-width: none; height: auto; display: block; }

/* a kártya fizikai tárgyként mindkét témában világos marad */
.card { --cc: #A87B22; background: #FDF9EF; color: #2B2420; border: 3px solid var(--cc); border-radius: 14px; overflow: hidden; }
.card .ch { background: var(--cc); color: #fff; display: flex; align-items: center; gap: 10px; padding: 8px 12px; }
.card .cid { background: #FDF9EF; color: var(--cc); width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; flex: none; }
.card .cn { font-family: var(--f-display); font-weight: 700; line-height: 1.15; min-width: 0; }
.card .cn small { display: block; font-family: var(--f-text); font-weight: 400; font-size: .8rem; opacity: .95; }
.card .cp { margin-left: auto; background: #FDF9EF; color: var(--cc); border-radius: 7px; padding: 3px 9px; font-weight: 700; white-space: nowrap; }
.card .cb { padding: 14px 16px 10px; font-size: 1.04rem; line-height: 1.42; }
.card .bg { color: #4B3D2F; font-size: .96rem; margin-bottom: 8px; }
.card .ev { font-family: var(--f-display); font-weight: 700; color: var(--cc); margin-bottom: 4px; font-size: 1.05rem; }
.card .src { font-family: var(--f-quote); font-style: italic; font-size: 1.12rem; background: #F1E6CC; border-left: 4px solid #B8862B; padding: 8px 12px; }
.card .sref { font-size: .76rem; color: #7A6A55; text-align: right; margin: 3px 0 9px; }
.card .stmt { font-family: var(--f-quote); font-weight: 600; font-size: 1.3rem; text-align: center; border: 1px solid #C7A86A; border-radius: 9px; padding: 12px; margin: 4px 0 12px; background: #F6EDD6; }
.card .task { font-weight: 700; }
.card ul { list-style: none; padding-left: 8px; margin: 6px 0 0; }
.card table { border-collapse: collapse; margin-top: 6px; }
.card table td { padding: 3px 14px 3px 4px; border-bottom: 1px dotted #C7A86A; }
.card .eff { margin-top: 10px; background: #22384F; color: #fff; border-radius: 8px; padding: 8px 11px; font-size: .95rem; }
.card .cf { border-top: 1px solid #E2D2AE; background: #F6EEDB; padding: 7px 16px; font-size: .86rem; color: #4B3D2F; }
.card .recap { color: #4B3D2F; font-size: .95rem; border-bottom: 1px dashed #C7A86A; padding-bottom: 8px; margin-bottom: 10px; }
.card .solh { font-family: var(--f-display); font-weight: 700; font-size: .82rem; letter-spacing: .1em; color: #4F6B2C; margin-bottom: 4px; }
.card .sola { font-weight: 700; font-size: 1.08rem; margin-bottom: 4px; }
.card .soln { color: #5B4B38; font-size: .9rem; margin: 6px 0 4px; }
.card.back .cb { background: #EEF2E2; }
.card.flipout { animation: flipout .23s ease-in forwards; }
@keyframes flipout { to { transform: perspective(900px) rotateY(90deg); } }
.card.flipin { animation: flipin .3s ease-out; }
@keyframes flipin { from { transform: perspective(900px) rotateY(-90deg); } }

.timer { height: 8px; border-radius: 4px; background: var(--surface2); overflow: hidden; margin: 12px 0 4px; }
.timer div { height: 100%; background: var(--sea); transition: width .25s linear; }
.timer.out div { background: var(--accent); }
.tlabel { font-variant-numeric: tabular-nums; font-size: .9rem; color: var(--muted); }
.rub { margin-top: 12px; border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; background: var(--surface2); }
.rub h4 { margin: 0 0 6px; font-family: var(--f-display); font-size: .8rem; letter-spacing: .08em; color: var(--muted); }
.rrow { display: flex; gap: 10px; align-items: center; justify-content: space-between; padding: 7px 0; border-top: 1px solid var(--line); flex-wrap: wrap; }
.rub h4 + .rrow { border-top: 0; }
.rl { flex: 1 1 220px; min-width: 0; }
.rbtn { display: flex; gap: 6px; }
.rbtn button { min-width: 46px; min-height: 40px; border-radius: 9px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); font-weight: 700; }
.rbtn button.on { background: var(--sea); color: var(--accent-ink); border-color: var(--sea); }
.rtotal { margin-top: 8px; font-weight: 700; font-variant-numeric: tabular-nums; }
.pts { display: flex; gap: 8px; flex-wrap: wrap; }
.ostraka { display: flex; flex-wrap: wrap; gap: 10px; margin: 10px 0; }
.ostrakon { background: #E7B48F; color: #2B2420; padding: 10px 16px; font-family: var(--f-display); font-weight: 700;
  clip-path: polygon(0 30%, 18% 4%, 56% 0, 86% 12%, 100% 48%, 90% 92%, 50% 100%, 12% 88%); animation: drop .4s ease-out both; }
@keyframes drop { from { transform: translateY(-12px) rotate(-6deg); opacity: 0; } }
.rank { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
.rank td { padding: 9px 6px; border-top: 1px solid var(--line); }
.rank tr:first-child td { font-weight: 700; font-size: 1.1rem; }
.winner { font-family: var(--f-display); font-weight: 700; font-size: 1.7rem; text-align: center; margin: 4px 0 12px; color: var(--accent); }
details.sum { margin-top: 14px; border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; background: var(--surface2); }
details.sum summary { cursor: pointer; font-weight: 700; }
.sumtbl { width: 100%; border-collapse: collapse; margin: 10px 0; font-variant-numeric: tabular-nums; }
.sumtbl td { padding: 6px 6px; border-top: 1px solid var(--line); }
.bar { height: 10px; background: var(--surface); border-radius: 5px; overflow: hidden; border: 1px solid var(--line); }
.bar div { height: 100%; }
.sumtxt { width: 100%; font: 12px/1.4 ui-monospace, Menlo, Consolas, monospace; padding: 8px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); }
.rules h4 { font-family: var(--f-display); margin: 12px 0 4px; font-size: .95rem; color: var(--accent); }
.rules ul { margin: 0; padding-left: 20px; }
.toast { position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--surface);
  padding: 10px 16px; border-radius: 10px; z-index: 30; font-weight: 600; max-width: calc(100% - 32px); text-align: center; }
.sr-only { position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
.modal:focus, #turn:focus { outline: none; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>
</head>
<body>


<header class="top">
  <div class="brand"><h1>Az Agóra urai</h1><span>A demokrácia próbája – online társasjáték</span></div>
  <span class="clock" id="clock" hidden></span>
  <button class="btn" id="bRules" type="button">Szabályok</button>
  <button class="btn" id="bRes" type="button" hidden>Eredmény</button>
  <button class="btn" id="bEnd" type="button" hidden>Játék lezárása</button>
  <button class="btn" id="bNew" type="button">Új játék</button>
</header>

<main class="layout">

legszegényebb polgárok, a thétészek szolgáltak.", "task": "Miért nőtt meg ezután a thétészek politikai súlya Athénban? Fogalmazd meg az ok-okozati összefüggést!", "score": "Katonai szerep: 1 · flotta: 1 · politikai összefüggés: 1"}, "C2": {"id": "C2", "bg": "Periklész javaslatára napidíjat fizettek az esküdtbíróság tagjainak. Az esküdteket sorsolással jelölték ki, és ők ítélkeztek a peres ügyekben.", "task": "a) Miért volt szükség a napidíjra? Kiknek tette lehetővé a részvételt?<br>b) Nevezz meg egy következményét!", "score": "a) 2 pont · b) 1 pont"}, "C3": {"id": "C3", "bg": "Kr. e. 451/450-ben Periklész javaslatára új polgárjogi törvényt fogadtak el. Tipp: a törvény a szülők származásáról szólt.", "task": "a) Mit írt elő a törvény?<br>b) Hogyan változott ezáltal a polgárok köre?", "score": "a) 2 pont · b) 1 pont"}, "C4": {"id": "C4", "bg": "Szolón a polgárokat vagyonuk (földjük éves termése) szerint négy osztályba sorolta. A politikai jogok mértéke ettől függött.", "task": "a) Mi lett a politikai jogok alapja a származás helyett?<br>b) Kik nyertek ezzel, és kiknek csökkent a befolyása?", "score": "a) 1 pont · b) 2 pont"}, "D1": {"id": "D1", "bg": "Kr. e. 483/482, népgyűlés a Pnüxön. A laurióni bányákban gazdag ezüstérre bukkantak. Egyesek szerint a bevételt szét kell osztani a polgárok között. Themisztoklész azt javasolja, hogy építsenek belőle hadihajókat, mert Athén háborúban áll Aiginával, és a perzsa támadás veszélye is fennáll.", "task": "Hogyan szavazol? Indokold a kor viszonyai alapján – a későbbi eseményeket egy korabeli polgár még nem ismerheti!", "score": "Döntés: 1 · korhű, történelmi érv: 2"}, "D2": {"id": "D2", "bg": "Kr. e. 5. század. A népgyűlés minden évben eldönti, tartsanak-e cserépszavazást. Két befolyásos vezető ellentétes politikát követ; vitájuk hónapok óta megosztja a népgyűlést, és sokan tartanak attól, hogy egyikük túl nagy hatalomra tesz szert.", "task": "Megszavazod, hogy idén legyen cserépszavazás? Indokold a döntésedet!", "score": "Döntés: 1 · korhű, történelmi érv: 2"}, "D3": {"id": "D3", "bg": "Szomszédod metoikosz kereskedő: évtizedek óta Athénban él, adót fizet, és hadba is vonul. Megkér, hogy szólalj fel a népgyűlésen azért, hogy ő is szavazhasson.", "task": "Mit teszel? Indokold az athéni szabályok ismeretében!", "score": "Döntés: 1 · a polgárjog szabályainak helyes ismerete: 2"}, "D4": {"id": "D4", "bg": "Kr. e. 5. század közepe, népgyűlés. Periklész javasolja, hogy a déloszi szövetség közös pénzéből – amelyet a szövetséges poliszok befizetései töltenek fel – építsék újjá az Akropolisz perzsák által lerombolt templomait. Ellenfelei szerint a pénz a perzsák elleni védelemre szolgál.", "task": "Hogyan szavazol? Indokold a kor viszonyai alapján!", "score": "Döntés: 1 · korhű, történelmi érv: 2"}, "E1": {"id": "E1", "stmt": "Athénban minden felnőtt lakos részt vehetett a népgyűlésen.", "task": "Igaz vagy hamis? Ha hamis, javítsd ki; ha igaz, egészítsd ki egy pontosító adattal!", "score": "Helyes ítélet: 1 · javítás / kiegészítés: 1"}, "E2": {"id": "E2", "stmt": "Az athéni népgyűlésben a polgárok által választott képviselők döntöttek a nép nevében.", "task": "Igaz vagy hamis? Ha hamis, javítsd ki; ha igaz, egészítsd ki egy pontosító adattal!", "score": "Helyes ítélet: 1 · javítás / kiegészítés: 1"}, "E3": {"id": "E3", "stmt": "Az ötszázak tanácsa (bulé) hozta meg a végső döntéseket, a népgyűlés csak jóváhagyta azokat.", "task": "Igaz vagy hamis? Ha hamis, javítsd ki; ha igaz, egészítsd ki egy pontosító adattal!", "score": "Helyes ítélet: 1 · javítás / kiegészítés: 1"}, "E4": {"id": "E4", "stmt": "A legtöbb athéni tisztségviselőt sorsolással jelölték ki, a sztratégoszokat azonban választották.", "task": "Igaz vagy hamis? Ha hamis, javítsd ki; ha igaz, egészítsd ki egy pontosító adattal!", "score": "Helyes ítélet: 1 · javítás / kiegészítés: 1"}, "F1": {"id": "F1", "event": "Kr. e. 510 – A türannisz bukása", "bg": "Az athéniak spártai segítséggel elűzték Hippiasz türannoszt.", "task": "Milyen uralmi forma ért véget ekkor Athénban? Mit jelent ez a fogalom?", "score": "Megnevezés: 1 · jelentés: 1", "effect": "SZABADSÁG! Teljes pontszám (2/2) esetén lépj előre 2 mezőt. Az új mezőn nem kell feladatot teljesítened."}, "F2": {"id": "F2", "event": "Kr. e. 490 – Marathón", "bg": "Az athéni hopliták Marathón síkságán szálltak szembe a partra szállt sereggel.", "task": "Kik ellen védték meg hazájukat az athéniak, és ki vezette a sereget?", "score": "Ellenfél: 1 · hadvezér: 1", "effect": "A MARATHÓNI HŐS! Teljes pontszám (2/2) esetén +1 bónuszpontot kapsz."}, "F3": {"id": "F3", "event": "Kr. e. 480 – Szalamisz", "bg": "A szalamiszi szorosban dőlt el, hogy a perzsák meghódíthatják-e Hellászt.", "task": "Melyik athéni vezető nevéhez fűződik a győzelem, és milyen haderő aratta?", "score": "Vezető: 1 · haderő: 1", "effect": "A FLOTTA EREJE! Teljes pontszám (2/2) esetén lépj előre 3 mezőt. Az új mezőn nem kell feladatot teljesítened."}, "F4": {"id": "F4", "event": "Kr. e. 430–429 – Járvány Athénban", "bg": "A háború második évében járvány tört ki a zsúfolt, falak mögé húzódó Athénban. Kr. e. 429-ben áldozatai közé tartozott Periklész is.", "task": "Melyik háború idején történt mindez, és melyik két polisz volt a fő ellenfél?", "score": "Háború: 1 · a két polisz: 1", "effect": "CSAPÁS A VÁROSRA! Ha nem kaptál teljes (2/2) pontszámot, lépj vissza 2 mezőt. Az új mezőn nem kell feladatot teljesítened."}}, "KEY": {"A1": {"a": "b – d – a – c (Szolón, Kr. e. 594 → Peiszisztratosz türannisza, Kr. e. 560 körül–527 → Kleiszthenész, Kr. e. 508 → Periklész kora, Kr. e. 5. század közepe).", "n": "Részpont nem jár."}, "A2": {"a": "a) Kleiszthenész (reformjai: Kr. e. 508/507). b) A Kr. e. 6. század (vége).", "n": "A „Kr. e. 5. század” válasz hibás: a Kr. e. 508. év a Kr. e. 6. századba esik (Kr. e. 600–501)."}, "A3": {"a": "1–b, 2–d, 3–c, 4–a.", "n": "4 helyes pár: 2 pont; 2–3 helyes pár: 1 pont; 0–1 helyes pár: 0 pont."}, "A4": {"a": "1–a (Szolón), 2–c (Periklész), 3–b (Kleiszthenész), 4–a (Szolón).", "n": "4 helyes: 2 pont; 2–3 helyes: 1 pont. Megbeszéléshez: a vagyon szerinti osztályok és az adósrabszolgaság megszüntetése Szolónhoz, a területi beosztás és az 500 tagú tanács Kleiszthenészhez, az esküdtek napidíja Periklészhez kötődik."}, "B1": {"a": "a) Az adósrabszolgaság: az eladósodott polgár (és családja) a hitelező rabszolgájává válhatott. b) Az eladósodott, szegény parasztok, a démosz szegényebb rétegei.", "n": "Elfogadható: „adósság miatti rabszolgaság”, „adósok rabszolgasorba kerülése”. Csak „szegénység”: 1 pont az a) részre."}, "B2": {"a": "a) A régi, származáson (nemzetségi kötelékeken) alapuló arisztokrata befolyás megtörése; a lakóhely (terület) szerinti beosztás; több polgár bevonása a közügyekbe. b) 500 fő (10 × 50) – az ötszázak tanácsa (bulé).", "n": "Az a) részre 2 pont, ha a válasz a régi kötődések megtörését vagy a területi elvet ÉS a szélesebb részvételt is említi; egy elemért 1 pont."}, "B3": {"a": "a) Pl. a többség uralma; a törvény előtti egyenlőség; az érdem (nem a származás) számít; a szegénység nem zárja ki a részvételt. b) A nők, a rabszolgák és a metoikoszok (betelepült idegenek); a kiskorúak.", "n": "b) rész: két helyes csoport 2 pont, egy csoport 1 pont. Megbeszéléshez: a teljes jogú felnőtt férfi polgárok Attika lakosságának kisebbségét alkották – a „többség” a polgárok többségét jelentette."}, "B4": {"a": "a) A türannisz újbóli kialakulását, illetve azt, hogy egy személy túl nagy hatalomra tegyen szert. b) 10 évre. c) Vagyonát és polgárjogát (a 10 év letelte után visszatérhetett).", "n": "Kiegészítő tanári információ: a cserépszavazást a hagyomány Kleiszthenésznek tulajdonítja; első alkalmazása Arisztotelész szerint két évvel a marathóni győzelem után, Kr. e. 488/487-ben történt."}, "C1": {"a": "A flotta lett Athén legfontosabb haderője; az evezősök a thétészek közül kerültek ki, így a város védelme rajtuk múlt. Aki hazája védelmében nélkülözhetetlen, az nagyobb politikai beleszólást követelhetett és kapott (erősödött a démosz, a népgyűlés szerepe).", "n": "1 pont: a thétészek katonai (evezős) szerepe; 1 pont: a flotta jelentőségének növekedése; 1 pont: a katonai szerep és a politikai részvétel összefüggésének kimondása."}, "C2": {"a": "a) A szegényebb polgárok nem engedhették meg maguknak, hogy keresetük kiesése mellett bíráskodjanak; a napidíj pótolta a kiesett jövedelmet, így a szegények is részt vehettek. b) Pl. szélesebb körű részvétel; nőtt Periklész népszerűsége; jelentős állami kiadás (részben a szövetségesek befizetéseiből); a kritikusok szerint a nép „megvásárlása”.", "n": "a) rész: az ok (kereset kiesése) 1 pont, a szegény polgárok megnevezése 1 pont."}, "C3": {"a": "a) Csak az lehetett athéni polgár, akinek apja és anyja is athéni (polgárcsaládból származó) volt. b) Szűkült a polgárok köre; a polgári előjogokon (pl. napidíj, gabonaosztás) kevesebben osztoztak; a nem athéni anyától születettek kimaradtak.", "n": "Az a) részre 1 pont jár, ha csak az egyik szülőre vonatkozó feltételt említi."}, "C4": {"a": "a) A vagyon (a föld termése szerinti vagyoni besorolás – timokrácia). b) Nyertek: a meggazdagodott, de nem előkelő származású polgárok (pl. kereskedők, iparosok, gazdag parasztok). Csökkent: a születési arisztokrácia kizárólagos politikai befolyása.", "n": "Pontosítás: a legszegényebbek (thétészek) a népgyűlésen és a hagyomány szerint az esküdtbíróságon vehettek részt, hivatalt nem viselhettek."}, "D1": {"a": "Mindkét döntés elfogadható. Hajóépítés mellett: Aigina és a perzsa fenyegetés; a tengeri kereskedelem védelme; a hajókon szegény polgárok kapnak szolgálatot. Szétosztás mellett: a polgárok közvetlen anyagi haszna; a korábbi szokás; a szárazföldi hoplitasereg hagyománya.", "n": "2 pont csak korhű érvre jár. 0 pont a jövőbeli eseményekre (pl. „mert úgyis jön Szalamisz”) épülő indoklásra. Tanári információ: a népgyűlés a hajóépítés mellett döntött (Hérodotosz VII. 144)."}, "D2": {"a": "Mindkét döntés elfogadható. Igen: a cserépszavazás célja a túl nagy hatalmú politikus eltávolítása és a türannisz megelőzése; a viszály lezárható. Nem: a város kiváló vezetőt veszíthet; a szavazással vissza lehet élni, és politikai ellenfelek eltávolítására is használható.", "n": "Korhű érv: a türannisz emléke, Peiszisztratosz példája, a 10 évre szóló, de nem megbélyegző száműzetés. Hibás érv (0 pont): „bíróság elé állítják és elítélik” – a cserépszavazás nem bírósági ítélet."}, "D3": {"a": "Döntéstől függetlenül a kulcs: a metoikosz szabad, de nem polgár, ezért nincs politikai joga – nem szavazhat a népgyűlésen és nem viselhet hivatalt –, noha adót fizet (metoikion) és katonáskodik. Polgárjogot csak kivételesen, népgyűlési határozattal kaphatott.", "n": "A „felszólalok, és azonnal szavazhat” típusú válasz a döntésért 1 pontot ér, de érv nélkül a további 2 pont nem jár."}, "D4": {"a": "Mindkét döntés elfogadható. Mellette: munka és kereset a polgároknak; Athén dicsősége és vezető szerepe; az istenek (Pallasz Athéné) tisztelete; a perzsák pusztítása után helyreállítás. Ellene: a szövetségesek pénzének más célú felhasználása; a szövetség eredeti célja a perzsák elleni védelem; a szövetségesek elégedetlensége.", "n": "Tanári információ: a szövetségi pénztárat Kr. e. 454 körül (454–453) Délosz szigetéről Athénba vitték; a Parthenón Kr. e. 447 és 432 között épült. A vitáról Plutarkhosz (Periklész életrajza, 12. fejezet) tudósít."}, "E1": {"a": "HAMIS. Csak a teljes jogú, felnőtt férfi athéni polgárok vehettek részt; a nők, a rabszolgák és a metoikoszok nem.", "n": "A javításért 1 pont jár, ha legalább két kizárt csoportot vagy a „felnőtt férfi polgár” feltételt megnevezi."}, "E2": {"a": "HAMIS. Közvetlen demokrácia volt: a népgyűlésen minden teljes jogú polgár személyesen vehetett részt és szavazhatott; képviselők nem voltak.", "n": "A „közvetlen demokrácia” kifejezés vagy körülírása elegendő a javításhoz."}, "E3": {"a": "HAMIS. A népgyűlés volt a legfőbb döntéshozó szerv; a bulé előkészítette a népgyűlés ügyeit (napirendjét, javaslatait), és a döntések végrehajtásában is szerepe volt.", "n": "A javításért 1 pont jár, ha a népgyűlés döntési szerepét VAGY a bulé előkészítő szerepét megnevezi. A bulé phülénként 50, összesen 500 sorsolt tagból állt."}, "E4": {"a": "IGAZ. Kiegészítés például: a sztratégoszok katonai vezetők voltak, akiknél szakértelem kellett, ezért választották őket; újraválaszthatók voltak. Periklészt a hagyományos adat szerint 15 alkalommal választották meg sztratégosszá.", "n": "Az ítélet 1 pont, bármelyik helyes pontosító adat 1 pont."}, "F1": {"a": "A türannisz (Peiszisztratosz fiainak uralma). Jelentése: egyeduralom, amelyet a hatalomra törő személy törvényes alap nélkül, rendszerint erőszakkal szerzett meg.", "n": "A „zsarnokság” megnevezés elfogadható. A hatás csak teljes (2/2) pontszám esetén érvényes."}, "F2": {"a": "A perzsák ellen; a hadvezér Miltiadész volt.", "n": "A hatás (+1 bónuszpont) csak teljes (2/2) pontszám esetén jár."}, "F3": {"a": "Themisztoklész; az athéni (görög) hajóhad, a flotta.", "n": "A hatás csak teljes (2/2) pontszám esetén érvényes."}, "F4": {"a": "A peloponnészoszi háború (Kr. e. 431–404) idején; a fő ellenfelek Athén és Spárta voltak.", "n": "A hatás akkor lép életbe, ha a pontszám NEM teljes (nem 2/2)."}}, "RUBRIC": {"A1": [["Hibátlan sorrend: b – d – a – c", [0, 2]]], "A2": [["a) Kleiszthenész", [0, 1]], ["b) Kr. e. 6. század", [0, 1]]], "A3": [["Helyes párok száma (0–1: 0 · 2–3: 1 · 4: 2 pont)", [0, 1, 2]]], "A4": [["Helyes besorolások száma (0–1: 0 · 2–3: 1 · 4: 2 pont)", [0, 1, 2]]], "B1": [["a) az adósrabszolgaság (adósság miatti rabszolgasorba kerülés)", [0, 1, 2]], ["b) az eladósodott szegény parasztok (démosz)", [0, 1]]], "B2": [["a) cél: a régi, származási kötelékek megtörése és/vagy több polgár részvétele", [0, 1, 2]], ["b) 500 tag", [0, 1]]], "B3": [["a) két helyes érték", [0, 1]], ["b) két kimaradó csoport (nők, rabszolgák, metoikoszok)", [0, 1, 2]]], "B4": [["a) a türannisz / a túl nagy hatalom veszélye", [0, 1]], ["b) 10 év", [0, 1]], ["c) va const LENLAB = { short: 'Rövid (kb. 15 perc)', normal: 'Normál (kb. 25 perc)', long: 'Hosszú (kb. 35 perc)' };
const FNAME = { A: 'REFORMOK', B: 'BÍRÓSÁG', C: 'BULÉ', D: 'PNÜX', E: 'AGÓRA', F: 'FORDULÓPONT', O: 'CSERÉPSZAVAZÁS', R1: 'PIREUSZ', R2: 'AREIOSZPAGOSZ', P: 'PARTHENÓN', S: 'START', G: 'AKROPOLISZ' };
const REDUCED = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
let S = null;     // játékállapot (mentődik)
let ui = null;    // átmeneti ablak: szabályok, nagyítás, megerősítés (nem mentődik)
let setup = { n: 4, names: ['Anna', 'Bence', 'Csenge', 'Dani'], len: 'normal' };
let ticker = null;

function save() { try { localStorage.setItem(KEYQ, JSON.stringify(S)); } catch (e) {} }
function validState(s) {
  try {
    if (!s || s.v !== 2 || ![2, 3, 4].includes(s.n) || !Array.isArray(s.players) || s.players.length !== s.n) return false;
    if (!['rolloff', 'play', 'end'].includes(s.phase) || !Number.isInteger(s.cur) || s.cur < 0 || s.cur >= s.n) return false;
    if (!Number.isInteger(s.turn) || s.turn < 0 || !Number.isInteger(s.rounds) || !Number.isInteger(s.start) || s.start < 0 || s.start >= s.n) return false;
    if (!s.players.every(p => p && typeof p.name === 'string' && Number.isInteger(p.pos) && p.pos >= 1 && p.pos <= 30 && Number.isFinite(p.score) && Number.isFinite(p.stars) && Number.isFinite(p.skip) && typeof p.color === 'string')) return false;
    if (!s.decks || !CARD_CATS.every(c => Array.isArray(s.decks[c]) && s.decks[c].every(id => D.CARDS[id]))) return false;
    if (!Array.isArray(s.log) || !Array.isArray(s.rolloff) || !Array.isArray(s.results)) return false;
    if (s.modal) { if (typeof s.modal !== 'object' || (s.modal.type === 'card' && !D.CARDS[s.modal.id])) return false; }
    return true;
  } catch (e) { return false; }
}
function load() { try { const v = localStorage.getItem(KEYQ); return v ? JSON.parse(v) : null; } catch (e) { return null; } }
function clearSave() { try { localStorage.removeItem(KEYQ); } catch (e) {} }
function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function d6() { return 1 + Math.floor(Math.random() * 6); }
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.hidden = false; clearTimeout(toast.h); toast.h = setTimeout(() => t.hidden = true, 2600); announce(msg); }
let _an = 0;
function announce(m) { const r = $('#sr'); if (!r) return; r.textContent = ''; const id = ++_an; setTimeout(() => { if (id === _an) r.textContent = m; }, 40); }
const plain = h => String(h).replace(/<[^>]*>/g, '').replace(/&amp;/g, '&').replace(/&lt;/g, '<').replace(/&gt;/g, '>').replace(/&quot;/g, '"');
function log(msg) { S.log.unshift(msg); if (S.log.length > 80) S.log.pop(); announce(plain(msg)); }
const P = i => S.players[i];
const curP = () => S.players[S.cur];
const juryIdx = () => (S.cur - 1 + S.n) % S.n;
const lastIdx = () => (S.start - 1 + S.n) % S.n;
const peersOf = () => [...Array(S.n).keys()].filter(i => i !== S.cur && i !== juryIdx());
const deckTotal = () => CARD_CATS.reduce((s, c) => s + S.decks[c].length, 0);

/* ---------------- bábuk ---------------- */
function drawPawns() {
  const g = document.getElementById('pawns'); if (!g) return;
  const players = S ? S.players : setup.names.slice(0, setup.n).map((name, i) => ({ name, pos: 1, color: COLORS[i] }));
  const offs = [-7.2, -2.4, 2.4, 7.2];
  let html = '';
  players.forEach((p, i) => {
    const [x, y] = D.POS[p.pos];
    const tx = x + offs[i], ty = y + D.FH / 2 - 0.4;
    const act = S && S.phase === 'play' && i === S.cur;
    html += `<g class="pawn${act ? ' active' : ''}" style="transform:translate(${tx}px,${ty}px)">` +
      (act ? `<circle class="ring" r="4.1" fill="none" stroke="${p.color}" stroke-width="0.8"/>` : '') +
      `<circle r="2.9" fill="${p.color}" stroke="#fff" stroke-width="0.7"/>` +
      `<text y="1.05" text-anchor="middle" font-family="Source Sans 3, sans-serif" font-weight="700" font-size="3" fill="#fff">${esc((p.name.trim().charAt(0) || String(i + 1)).toUpperCase())}</text></g>`;
  });
  g.innerHTML = html;
}

/* ---------------- kockák ---------------- */
function dieHTML(v) {
  const on = v ? { 1: [4], 2: [0, 8], 3: [0, 4, 8], 4: [0, 2, 6, 8], 5: [0, 2, 4, 6, 8], 6: [0, 2, 3, 5, 6, 8] }[v] : [];
  return `<div class="die" role="img" aria-label="Kocka: ${v || '–'}">` + [...Array(9)].map((_, i) => `<i class="${on.includes(i) ? 'on' : ''}"></i>`).join('') + '</div>';
}
function diceHTML(a, b, spin) { return `<div class="dice${spin ? ' spin' : ''}" id="dice">${dieHTML(a)}${dieHTML(b)}</div>`; }

/* ---------------- paneleik ---------------- */
function scoreboard() {
  const rows = S.players.map((p, i) => {
    const tags = [];
    if (S.phase === 'play' && i === juryIdx()) tags.push('<span class="tag">esküdt</span>');
    if (p.skip) tags.push('<span class="tag ex">száműzött</span>');
    if (S.firstFinish === i) tags.push('<span class="tag">célba ért</span>');
    return `<tr class="${S.phase === 'play' && i === S.cur ? 'cur' : ''}"><td><span class="chip" style="background:${p.color}"></span> ${esc(p.name)} ${tags.join('')}</td>` +
      `<td class="num">${p.pos}.</td><td class="num">${p.stars}</td><td class="num">${p.score}</td></tr>`;
  }).join('');
  return `<section class="panel"><h2>Tekintélypontok</h2><table class="sc"><tr><th>Játékos</th><th style="text-align:right">Mező</th><th style="text-align:right">★</th><th style="text-align:right">Pont</th></tr>${rows}</table></section>`;
}
function decksHTML() {
  return `<section class="panel"><h2>Paklik – ${deckTotal()} lap maradt</h2><div class="decks">` + CARD_CATS.map(c =>
    `<div class="deck${S.decks[c].length ? '' : ' empty'}" style="background:${D.CAT[c].color}" title="${esc(D.CAT[c].name)}">${c}<small>${S.decks[c].length} lap</small></div>`).join('') + '</div></section>';
}
function renderPanels() {
  $('#bEnd').hidden = !S || S.phase !== 'play';
  $('#bRes').hidden = !S || S.phase !== 'end';
  const turn = $('#turn'), side = $('#side');
  if (!S) { turn.innerHTML = setupHTML(); side.innerHTML = introHTML(); bindSetup(); drawPawns(); return; }
  let h = '';
  if (S.phase === 'play') {
    const p = curP();
    const banner = S.ending ? `<div class="banner">Utolsó kör! (${esc(S.endReason)}) A kör ${esc(P(lastIdx()).name)} lépésével zárul.</div>` : '';
    let body;
    if (p.skip) body = `<p class="status">${esc(p.name)} 10 évre száműzetésben van, ezért ez a köre kimarad. Pontjai megmaradtak.</p><button class="btn primary big" id="bSkip" type="button">Tovább</button>`;
    else body = `<div class="rollrow">${diceHTML(S.lastRoll && S.lastRoll[0], S.lastRoll && S.lastRoll[1])}<button class="btn primary big" id="bRoll" type="button"${S.busy ? ' disabled' : ''}>Dobj!</button>` +
      `<span class="status">${S.lastRoll ? 'Előző dobás: ' + S.lastRoll[0] + ' + ' + S.lastRoll[1] + ' = ' + (S.lastRoll[0] + S.lastRoll[1]) : 'Két kockával dobsz.'}</span></div>`;
    const peers = peersOf();
    const roles = `Esküdt: <b>${esc(P(juryIdx()).name)}</b>` + (peers.length ? ` · Társak: <b>${peers.map(i => esc(P(i).name)).join(', ')}</b>` : '');
    h += `<section class="panel">${banner}<h2>Soron következik</h2><div class="turn-name"><span class="chip" style="background:${p.color}"></span>${esc(p.name)}</div>` +
      `<div class="roles">Mező: <b>${p.pos}. – ${FNAME[D.FIELDS[p.pos]]}</b><br>${roles}</div>${body}</section>`;
  }
  if (S.phase === 'rolloff') {
    h += `<section class="panel"><h2>Ki kezd?</h2><p>Mindenki dobott egy kockával, a legnagyobb dobás kezd (egyenlőségnél újradobás).</p><ul>` +
      S.rolloff.map(r => `<li>${esc(r)}</li>`).join('') + `</ul><p class="status">${S.n} játékos, ${S.rounds} kör (${S.rounds * S.n} lépés). Készítsetek elő tollat és papírt a válaszokhoz.</p>` +
      `<button class="btn primary big" id="bGo" type="button">Indul a játék – ${esc(P(S.start).name)} kezd</button></section>`;
  }
  if (S.phase === 'end') h += `<section class="panel"><h2>A játék véget ért</h2><p>Az eredmény és a tanári összesítő az „Eredmény” gombbal nyitható meg.</p><button class="btn primary" id="bRes2" type="button">Eredmény megtekintése</button></section>`;
  turn.innerHTML = h;
  side.innerHTML = scoreboard() + decksHTML() + `<section class="panel"><h2>Napló</h2><ul class="log">${S.log.map(l => `<li>${l}</li>`).join('')}</ul></section>`;
  const r = $('#bRoll'); if (r) r.onclick = doRoll;
  const s = $('#bSkip'); if (s) s.onclick = () => { const p = curP(); p.skip = 0; log(`${esc(p.name)} kimaradt (száműzetés).`); endTurn(); };
  const g = $('#bGo'); if (g) g.onclick = () => { S.phase = 'play'; S.cur = S.start; log(`A játék elkezdődött. ${esc(P(S.start).name)} kezd.`); save(); renderAll(); };
  const r2 = $('#bRes2'); if (r2) r2.onclick = () => { if (S.modal) { S.modal.hidden = false; renderModal(); } };
  drawPawns();
}

/* ---------------- beállítás ---------------- */
function setupHTML() {
  const seg = (name, vals, cur, fmt) => `<div class="seg row" role="group" aria-label="${name}">` + vals.map(v => `<button type="button" data-${name}="${v}" aria-pressed="${v === cur}">${fmt(v)}</button>`).join('') + '</div>';
  const r = ROUNDS[setup.len][setup.n];
  return `<section class="panel setup"><h2>Új játék</h2>
    <p style="margin:0 0 10px">Egy eszközön játszotok, körbeadva. Az esküdt felolvassa a kártyát, a többiek papírra írják a választ, utána megfordítjátok a kártyát: a hátoldalon a megoldás látható.</p>
    <label>Játékosok száma</label>${seg('n', [2, 3, 4], setup.n, v => v + ' fő')}
    <label>Nevek</label><div class="namegrid">${[0, 1, 2, 3].slice(0, setup.n).map(i => `<div><span class="chip" style="background:${COLORS[i]}"></span><input type="text" id="name${i}" maxlength="18" value="${esc(setup.names[i])}" aria-label="${i + 1}. játékos neve"></div>`).join('')}</div>
    <p class="example">A nevek csak példák – írjátok át a sajátotokra.</p>
    <label>A játék hossza</label>${seg('len', ['short', 'normal', 'long'], setup.len, v => LENLAB[v])}
    <p class="example">${setup.n} fővel ${r} kör, összesen ${r * setup.n} lépés. A játék a lépések elfogytával ér véget.</p>
    <div class="row" style="margin-top:14px"><button class="btn primary big" id="bStart" type="button">Kezdődjön a játék</button></div></section>`;
}
function introHTML() {
  return `<section class="panel"><h2>Röviden a játékról</h2><p style="margin:0">Dobj két kockával, lépj, és oldd meg a mező feladatát. Pontot csak helyes válaszért kapsz, a társak teljesen helyes írásbeli válaszáért 1 társ-pont jár. Az elsőként az Akropoliszra érő +2 pontot kap, és a bábu újraindul. A Szabályok gombbal a teljes szabályleírás megnyitható.</p></section>`;
}
function bindSetup() {
  document.querySelectorAll('[data-n]').forEach(b => b.onclick = () => { readNames(); setup.n = +b.dataset.n; renderPanels(); });
  document.querySelectorAll('[data-len]').forEach(b => b.onclick = () => { readNames(); setup.len = b.dataset.len; renderPanels(); });
  for (let i = 0; i < setup.n; i++) { const el = $('#name' + i); el.oninput = () => { setup.names[i] = el.value; drawPawns(); }; }
  $('#bStart').onclick = () => { readNames(); startGame(); };
}
function readNames() { for (let i = 0; i < setup.n; i++) { const el = $('#name' + i); if (el) setup.names[i] = el.value.trim() || (i + 1) + '. játékos'; } }

function startGame() {
  const n = setup.n;
  S = { v: 2, n, rounds: ROUNDS[setup.len][n], turn: 0, phase: 'rolloff', cur: 0, start: 0, busy: false, lastRoll: null,
    players: setup.names.slice(0, n).map((name, i) => ({ name: name.trim() || (i + 1) + '. játékos', pos: 1, score: 0, stars: 0, skip: 0, color: COLORS[i] })),
    decks: {}, firstFinish: -1, ending: false, endReason: '', log: [], rolloff: [], modal: null, results: [] };
  CARD_CATS.forEach(c => S.decks[c] = shuffle(Object.keys(D.CARDS).filter(id => id[0] === c)));
  let pool = [...Array(n).keys()], round = 1;
  while (pool.length > 1) {
    const rolls = pool.map(i => [i, d6()]);
    S.rolloff.push((round > 1 ? 'Újradobás: ' : '') + rolls.map(([i, r]) => `${S.players[i].name}: ${r}`).join(' · '));
    const max = Math.max(...rolls.map(r => r[1]));
    pool = rolls.filter(r => r[1] === max).map(r => r[0]); round++;
  }
  S.start = pool[0];
  save(); renderAll();
}

/* ---------------- dobás és mozgás ---------------- */
function doRoll() {
  if (S.busy) return; S.busy = true;
  $('#bRoll').disabled = true;
  const a = d6(), b = d6(); let k = 0;
  const spin = setInterval(() => {
    k++; const last = k >= 7;
    $('#dice').outerHTML = diceHTML(last ? a : d6(), last ? b : d6(), !last);
    if (last) { clearInterval(spin); S.lastRoll = [a, b]; afterRoll(a, b); }
  }, REDUCED ? 1 : 90);
}
function afterRoll(a, b) {
  const p = curP(); const target = Math.min(30, p.pos + a + b);
  log(`${esc(p.name)} ${a} + ${b} = ${a + b}-et dobott, és a ${target}. mezőre lép.`);
  stepTo(p, target, () => { S.busy = false; resolveField(); });
}
function stepTo(p, target, done) {
  if (REDUCED || p.pos === target) { p.pos = target; drawPawns(); done(); return; }
  const dir = target > p.pos ? 1 : -1;
  const t = setInterval(() => { p.pos += dir; drawPawns(); if (p.pos === target) { clearInterval(t); setTimeout(done, 220); } }, 120);
}
function goalThenEnd(p) {
  const i = S.players.indexOf(p);
  if (S.firstFinish < 0) { S.firstFinish = i; p.score += 2; log(`<b>${esc(p.name)} elsőként érte el az Akropoliszt: +2 pont.</b>`); toast(`${p.name} az Akropoliszon: +2 pont`); }
  else log(`${esc(p.name)} is elérte az Akropoliszt.`);
  log(`${esc(p.name)} bábuja az 1. mezőről újraindul.`);
  S.busy = true; renderPanels();
  setTimeout(() => { p.pos = 1; endTurn(); }, REDUCED ? 0 : 800);
}
function setEnding(reason) { if (!S.ending) { S.ending = true; S.endReason = reason; log(`<b>A játék a kör végén befejeződik (${reason}).</b>`); } }

function resolveField() {
  const p = curP(); const t = D.FIELDS[p.pos];
  if (p.pos === 30) { goalThenEnd(p); return; }
  if (CARD_CATS.includes(t)) {
    let cat = t;
    if (!S.decks[cat].length) {
      const best = CARD_CATS.slice().sort((a, b) => S.decks[b].length - S.decks[a].length)[0];
      if (!S.decks[best].length) { setEnding('elfogytak a kártyák'); endTurn(); return; }
      log(`A(z) ${cat} pakli üres, ezért a(z) ${best} pakliból húznak.`); cat = best;
    }
    const id = S.decks[cat].shift();
    S.modal = { type: 'card', id, stage: 'q', t0: Date.now() };
    save(); renderAll(); return;
  }
  if (t === 'P') { p.score += 1; log(`${esc(p.name)} a Parthenón építkezésén: +1 pont.`); toast('Parthenón: +1 tekintélypont'); endTurn(); return; }
  if (t === 'O') { startVote(); return; }
  if (t === 'R1' || t === 'R2') log(`${esc(p.name)} pihen (${t === 'R1' ? 'Pireusz' : 'Areioszpagosz'}).`);
  endTurn();
}

let _lockT = 0;
function endTurn() {
  const _n = Date.now(); if (_n - _lockT < 320) return; _lockT = _n;
  S.turn++;
  if (!deckTotal()) setEnding('elfogytak a kártyák');
  if (S.turn >= S.rounds * S.n) { finish(); return; }
  if (S.ending && S.cur === lastIdx()) { finish(); return; }
  S.cur = (S.cur + 1) % S.n; S.modal = null; S.busy = false;
  save(); renderAll();
}

/* ---------------- kártya ---------------- */
function cardHTML(c) {
  const k = D.CAT[c.id[0]];
  let b = '';
  if (c.event) b += `<div class="ev">${c.event}</div>`;
  if (c.bg) b += `<div class="bg"><i>Háttér:</i> ${c.bg}</div>`;
  if (c.src) b += `<div class="src">„${c.src}”</div><div class="sref">${c.srcref}</div>`;
  if (c.stmt) b += `<div class="stmt">„${c.stmt}”</div>`;
  b += `<div class="task">${c.task}</div>`;
  if (c.lst) b += '<ul>' + c.lst.map(x => `<li>${x}</li>`).join('') + '</ul>';
  if (c.tbl) b += '<table>' + c.tbl.map(r => `<tr><td>${r[0]}</td><td>${r[1]}</td></tr>`).join('') + '</table>';
  if (c.effect) b += `<div class="eff"><b>Hatás:</b> ${c.effect}</div>`;
  return `<article class="card" style="--cc:${k.color}"><div class="ch"><span class="cid">${c.id}</span><span class="cn">${k.name}<small>${k.sub} · mező: ${k.field}</small></span><span class="cp">${k.pts} pont</span></div>` +
    `<div class="cb">${b}</div><div class="cf"><b>Pontozás:</b> ${c.score}</div></article>`;
}
function backHTML(c) {
  const k = D.CAT[c.id[0]]; const key = D.KEY[c.id];
  return `<article class="card back flipin" style="--cc:${k.color}"><div class="ch"><span class="cid">${c.id}</span><span class="cn">${k.name}<small>A kártya hátoldala · megoldás</small></span><span class="cp">${k.pts} pont</span></div>` +
    `<div class="cb"><div class="recap">${c.stmt ? '„' + c.stmt + '”' : c.task}</div><div class="solh">MEGOLDÁS</div><div class="sola">${key.a}</div><div class="soln">${key.n}</div>` +
    (c.effect ? `<div class="eff"><b>Hatás:</b> ${c.effect}</div>` : '') + `</div><div class="cf"><b>Pontozás:</b> ${c.score}</div></article>`;
}
function renderCard(ov, m) {
  const c = D.CARDS[m.id]; const p = curP(); const jury = P(juryIdx()).name;
  const peers = peersOf();
  let h = `<div class="modal" role="dialog" aria-modal="true" aria-label="Feladatkártya ${c.id}">${m.stage === 'q' ? cardHTML(c) : backHTML(c)}`;
  if (m.stage === 'q') {
    h += `<div class="timer" id="tbar"><div style="width:100%"></div></div><div class="tlabel" id="tlab">60 mp</div>
      <p style="margin-top:8px"><b>${esc(jury)}</b>, az esküdt, felolvassa a kártyát és méri az időt. <b>${esc(p.name)}</b> szóban válaszol` +
      (peers.length ? `, a társak (<b>${peers.map(i => esc(P(i).name)).join(', ')}</b>) a válaszukat papírra írják.` : '.') + `</p>
      <div class="actions"><button class="btn primary big" id="bAns" type="button">Elhangzott a válasz – kártya megfordítása</button></div>`;
  } else {
    const rub = D.RUBRIC[c.id]; m.sel = m.sel || rub.map(() => null); m.peer = m.peer || {};
    h += `<div class="rub"><h4>Pontozás részszempontonként · ${esc(jury)}, az esküdt, a hátoldal alapján értékel ${esc(p.name)} válaszáról</h4>` +
      rub.map((r, i) => `<div class="rrow"><span class="rl">${r[0]}</span><span class="rbtn" role="group" aria-label="${esc(r[0])}">` +
        r[1].map(v => `<button type="button" data-r="${i}" data-v="${v}" aria-pressed="false">${v}</button>`).join('') + '</span></div>').join('') +
      `<div class="rtotal" id="rtot"></div></div>`;
    if (peers.length) h += `<div class="rub"><h4>Társ-pont · kinek volt teljesen helyes az írásbeli válasza? (+1 pont)</h4><div class="pts">` +
      peers.map(i => `<button class="btn" type="button" data-peer="${i}" aria-pressed="false"><span class="chip" style="background:${P(i).color}"></span> ${esc(P(i).name)}</button>`).join('') + '</div></div>';
    h += `<div class="actions"><button class="btn primary big" id="bSave" type="button" disabled>Pontok rögzítése</button></div>`;
  }
  h += '</div>';
  ov.innerHTML = h;
  clearInterval(ticker);
  if (m.stage === 'q') {
    const tick = () => {
      const left = Math.max(0, 60 - (Date.now() - m.t0) / 1000);
      const bar = $('#tbar'); if (!bar) return;
      bar.firstElementChild.style.width = (left / 60 * 100) + '%';
      bar.classList.toggle('out', left <= 0);
      $('#tlab').textContent = left > 0 ? Math.ceil(left) + ' mp' : 'Lejárt az idő – az esküdt értékeli, ami eddig elhangzott.';
    };
    tick(); ticker = setInterval(tick, 250);
    $('#bAns').onclick = () => {
      const go = () => { m.stage = 'j'; save(); renderModal(); };
      const el = ov.querySelector('.card');
      if (REDUCED || !el) return go();
      $('#bAns').disabled = true; clearInterval(ticker); el.classList.add('flipout'); setTimeout(go, 230);
    };
    $('#bAns').focus();
    return;
  }
  const rub = D.RUBRIC[c.id]; const max = rub.reduce((s, r) => s + Math.max(...r[1]), 0);
  const sync = () => {
    ov.querySelectorAll('[data-r]').forEach(b => { const on = m.sel[+b.dataset.r] === +b.dataset.v; b.classList.toggle('on', on); b.setAttribute('aria-pressed', on); });
    ov.querySelectorAll('[data-peer]').forEach(b => { const on = !!m.peer[+b.dataset.peer]; b.classList.toggle('primary', on); b.setAttribute('aria-pressed', on); });
    const got = m.sel.reduce((s, v) => s + (v || 0), 0); const done = m.sel.every(v => v !== null);
    $('#rtot').textContent = `Összesen: ${got} / ${max} pont` + (done && got === max ? ' ★' : '') + (done ? '' : ' (minden sorban válassz értéket)');
    $('#bSave').disabled = !done;
  };
  ov.querySelectorAll('[data-r]').forEach(b => b.onclick = () => { m.sel[+b.dataset.r] = +b.dataset.v; sync(); });
  ov.querySelectorAll('[data-peer]').forEach(b => b.onclick = () => { const i = +b.dataset.peer; m.peer[i] = !m.peer[i]; sync(); });
  sync();
  $('#bSave').onclick = () => {
    const got = m.sel.reduce((s, v) => s + v, 0); const full = got === max;
    p.score += got; if (full) p.stars++;
    const pg = peers.filter(i => m.peer[i]); pg.forEach(i => P(i).score += 1);
    S.results.push({ id: c.id, who: p.name, got, max, peers: pg.length, items: rub.map((r, i) => ({ l: r[0], max: Math.max(...r[1]), got: m.sel[i] })) });
    log(`${esc(p.name)} – ${c.id} kártya: ${got}/${max} pont${full ? ' ★' : ''}.` + (pg.length ? ` Társ-pont: ${pg.map(i => esc(P(i).name)).join(', ')}.` : ''));
    finishCard(m, full);
  };
}
function finishCard(m, full) {
  const c = D.CARDS[m.id]; const p = curP();
  clearInterval(ticker); S.modal = null; renderModal();
  let mv = 0;
  if (c.id === 'F1' && full) mv = 2;
  if (c.id === 'F3' && full) mv = 3;
  if (c.id === 'F4' && !full) mv = -2;
  if (c.id === 'F2' && full) { p.score += 1; log(`${c.event}: ${esc(p.name)} +1 bónuszpontot kap.`); toast('A marathóni hős: +1 bónuszpont'); }
  else if (c.id[0] === 'F' && !mv) log(`${c.event}: a kártya hatása nem lépett életbe.`);
  if (mv) {
    const target = Math.max(1, Math.min(30, p.pos + mv));
    log(`${c.event}: ${esc(p.name)} ${mv > 0 ? 'előre' : 'vissza'}lép a ${target}. mezőre (ott nincs feladat).`);
    S.busy = true; renderPanels();
    stepTo(p, target, () => { if (p.pos === 30) goalThenEnd(p); else endTurn(); });
    return;
  }
  endTurn();
}

/* ---------------- cserépszavazás ---------------- */
function startVote() {
  if (S.n === 2) S.modal = { type: 'vote', two: true, roll: null };
  else S.modal = { type: 'vote', order: [...Array(S.n).keys()].map(k => (S.cur + k) % S.n), step: 0, stage: 'pass', votes: [] };
  log(`${esc(curP().name)} cserépszavazást hívott össze.`);
  save(); renderAll();
}
function renderVote(ov, m) {
  let h = '<div class="modal" role="dialog" aria-modal="true" aria-label="Cserépszavazás"><h3>Cserépszavazás</h3>';
  if (m.two) {
    if (m.roll == null) h += `<p>Két játékosnál a kocka dönt. <b>${esc(curP().name)}</b> dob egy kockával: 1–2: ő marad ki egy körből · 3–4: senki · 5–6: az ellenfele marad ki.</p><div class="actions"><button class="btn primary big" id="vRoll" type="button">Dobás</button></div>`;
    else {
      const other = S.players[(S.cur + 1) % 2];
      const who = m.roll <= 2 ? curP() : m.roll >= 5 ? other : null;
      h += `<div class="rollrow">${dieHTML(m.roll)}<p style="margin:0">${who ? `<b>${esc(who.name)}</b> 10 évre száműzetésbe vonul: a következő saját köre kimarad. Pontjai megmaradnak.` : 'Senkit sem száműznek.'}</p></div><div class="actions"><button class="btn primary" id="vDone" type="button">Tovább</button></div>`;
    }
  } else if (m.stage === 'pass') {
    const v = P(m.order[m.step]);
    h += `<p>Titkos szavazás. Add a készüléket <b>${esc(v.name)}</b> kezébe – a többiek ne nézzenek oda.</p><p class="status">Szavazat: ${m.step + 1} / ${S.n}</p>
      <div class="actions"><button class="btn primary big" id="vMe" type="button">${esc(v.name)} vagyok – szavazok</button></div>`;
  } else if (m.stage === 'choose') {

  } else if (m.stage === 'result') {
    const cnt = Array(S.n).fill(0); m.votes.forEach(v => cnt[v]++);
    const max = Math.max(...cnt); const tops = cnt.map((c, i) => c === max ? i : -1).filter(i => i >= 0);
    const ex = (tops.length === 1 && max >= 2) ? tops[0] : -1;
    if (m.shown === undefined) m.shown = shuffle(m.votes);
    h += `<p>Az osztrakonok:</p><div class="ostraka">` + m.shown.map((v, k) => `<span class="ostrakon" style="animation-delay:${k * 0.15}s">${esc(P(v).name)}</span>`).join('') + '</div>' +
      `<p>${ex >= 0 ? `<b>${esc(P(ex).name)}</b> ${max} szavazattal 10 évre száműzetésbe vonul: a következő saját köre kimarad. Pontjai megmaradnak – ahogy az athéni száműzött vagyona is.` : 'Nincs egyértelmű többség (legalább 2 szavazat, egyedül a legtöbb), ezért senkit sem száműznek.'}</p>
      <div class="actions"><button class="btn primary" id="vDone" type="button" data-ex="${ex}">Tovább</button></div>`;
  }
  h += '</div>'; ov.innerHTML = h;
  const r = $('#vRoll'); if (r) r.onclick = () => { m.roll = d6(); const other = (S.cur + 1) % 2; m.ex = m.roll <= 2 ? S.cur : m.roll >= 5 ? other : -1; save(); renderModal(); };
  const me = $('#vMe'); if (me) me.onclick = () => { m.stage = 'choose'; renderModal(); };
  ov.querySelectorAll('[data-v]').forEach(b => b.onclick = () => {
    m.votes.push(+b.dataset.v); m.step++;
    m.stage = m.step >= S.n ? 'result' : 'pass'; save(); renderModal();
  });
  const dn = $('#vDone'); if (dn) dn.onclick = () => {
    const ex = m.two ? m.ex : +dn.dataset.ex;
    if (ex >= 0) { P(ex).skip = 1; log(`Cserépszavazás: ${esc(P(ex).name)} száműzetésbe vonul (egy kör kimarad).`); }
    else log('Cserépszavazás: senkit sem száműztek.');
    S.modal = null; endTurn();
  };
}

/* ---------------- vége és tanári összesítő ---------------- */
function finish() {
  S.phase = 'end'; S.busy = false;
  const order = [...S.players.keys()].sort((a, b) => P(b).score - P(a).score || P(b).stars - P(a).stars);
  const top = order.filter(i => P(i).score === P(order[0]).score && P(i).stars === P(order[0]).stars);
  S.modal = { type: 'end', order, tied: top.length > 1 ? top : null, q: 0, winner: top.length === 1 ? [top[0]] : null };
  log('<b>A játék véget ért.</b>');
  save(); renderAll();
}
const TB = [{ q: 'Hány esküdtet sorsoltak ki évente az athéni esküdtbíróságba?', a: 6000 }, { q: 'Hányszor választották meg Periklészt sztratégosszá?', a: 15 }];
function summary() {
  const R = S.results;
  if (!R.length) return { html: '<p>Ebben a játékban nem volt kártyás válasz.</p>', text: '' };
  const cat = {};
  R.forEach(r => { const c = r.id[0]; cat[c] = cat[c] || { g: 0, m: 0, n: 0 }; cat[c].g += r.got; cat[c].m += r.max; cat[c].n++; });
  const rows = CARD_CATS.filter(c => cat[c]).map(c => {
    const x = cat[c]; const pc = Math.round(100 * x.g / x.m);
    return `<tr><td><b style="color:${D.CAT[c].color}">${c}</b> ${esc(D.CAT[c].name)}</td><td style="text-align:right">${x.n} db</td><td style="width:36%"><div class="bar"><div style="width:${pc}%;background:${D.CAT[c].color}"></div></div></td><td style="text-align:right"><b>${pc}%</b></td></tr>`;
  }).join('');
  const miss = [];
  R.forEach(r => r.items.forEach(it => { if (it.got < it.max) miss.push(`${r.id} · ${it.l} – ${it.got}/${it.max} (${r.who})`); }));
  const html = `<table class="sumtbl"><tr><td><b>Kategória</b></td><td style="text-align:right"><b>Kártyák</b></td><td></td><td style="text-align:right"><b>Elért pont</b></td></tr>${rows}</table>` +
    `<p><b>Elmaradt részszempontok</b> (${miss.length}):</p>` + (miss.length ? '<ul>' + miss.slice(0, 12).map(x => `<li>${esc(x)}</li>`).join('') + (miss.length > 12 ? `<li>… és még ${miss.length - 12}</li>` : '') + '</ul>' : '<p>Minden részszempont teljesült.</p>');
  const text = ['Az Agóra urai – összesítő', 'Kártya\tJátékos\tPont\tMax\tTársak jó válasza'].concat(R.map(r => `${r.id}\t${r.who}\t${r.got}\t${r.max}\t${r.peers}`)).concat(['', 'Elmaradt részszempontok:']).concat(miss).join('\n');
  return { html, text };
}
function renderEnd(ov, m) {
  let h = '<div class="modal" role="dialog" aria-modal="true" aria-label="Eredmény"><h3>Az agóra ítélete</h3>';
  if (m.winner) h += `<div class="winner">${m.winner.map(i => esc(P(i).name)).join(' és ')} ${m.winner.length > 1 ? 'közösen győztek' : 'győzött'}!</div>`;
  h += '<table class="rank">' + m.order.map((i, r) => `<tr><td>${r + 1}.</td><td><span class="chip" style="background:${P(i).color}"></span> ${esc(P(i).name)}</td><td style="text-align:right">${P(i).stars} ★</td><td style="text-align:right"><b>${P(i).score} pont</b></td></tr>`).join('') + '</table>';
  if (!m.winner && m.tied) {
    const t = TB[m.q];
    h += `<p style="margin-top:14px"><b>Holtverseny.</b> Rájátszás: a helyes számhoz közelebbi tipp nyer. Írjátok be a tippeket egymás után.</p><p><b>${t.q}</b></p>` +
      m.tied.map(i => `<label style="display:block;margin:6px 0 2px">${esc(P(i).name)} tippje</label><input type="number" inputmode="numeric" id="tb${i}">`).join('') +
      `<div class="actions"><button class="btn primary" id="tbGo" type="button">Eredmény</button></div>`;
  }
  if (m.tbMsg) h += `<p style="margin-top:10px">${m.tbMsg}</p>`;
  const sm = summary();
  h += `<details class="sum"><summary>Tanári összesítő – melyik kártya hogyan sikerült?</summary>${sm.html}` +
    (sm.text ? `<textarea class="sumtxt" id="sumTxt" rows="6" readonly aria-label="Összesítő szövege">${esc(sm.text)}</textarea><div class="actions"><button class="btn" id="bCopy" type="button">Összesítő másolása</button></div>` : '') + '</details>';
  h += `<div class="actions"><button class="btn" id="eNew" type="button">Új játék</button><button class="btn" id="eClose" type="button">Tábla megtekintése</button></div></div>`;
  ov.innerHTML = h;
  const g = $('#tbGo'); if (g) g.onclick = () => {
    const t = TB[m.q]; const d = m.tied.map(i => [i, Math.abs((parseFloat($('#tb' + i).value) || 1e9) - t.a)]);
    const best = Math.min(...d.map(x => x[1])); const w = d.filter(x => x[1] === best).map(x => x[0]);
    m.tbMsg = `Helyes válasz: ${t.a}.`;
    if (w.length === 1) m.winner = w; else if (m.q === 0) { m.q = 1; m.tied = w; m.tbMsg += ' Ismét egyenlő – jön a második kérdés.'; } else m.winner = w;
    save(); renderModal();
  };
  const cp = $('#bCopy'); if (cp) cp.onclick = () => {

}

/* ---------------- átmeneti ablakok ---------------- */
function renderConfirm(ov, m) {
  ov.innerHTML = `<div class="modal" role="dialog" aria-modal="true"><h3>${m.title}</h3><p>${m.text}</p><div class="actions"><button class="btn primary" id="okB" type="button">${m.ok}</button><button class="btn" id="noB" type="button">Mégse</button></div></div>`;
  $('#okB').onclick = () => { const f = m.fn; ui = null; f(); };
  $('#noB').onclick = () => { ui = null; renderAll(); };
}
function renderRules(ov) {
  ov.innerHTML = `<div class="modal rules" role="dialog" aria-modal="true" aria-label="Szabályok"><h3>Játékszabály röviden</h3>
  <h4>Szerepek minden körben</h4><ul><li><b>Aktív játékos:</b> dob két kockával, lép, szóban válaszol.</li><li><b>Esküdt</b> (az előző játékos): felolvassa a kártyát, figyeli az 1 percet, a kártya megfordítása után a hátoldal alapján részszempontonként pontoz. Az esküdt nem ír választ.</li><li><b>Társak</b> (3–4 főnél a többiek): papírra írják a választ. Aki teljesen helyesen válaszolt, +1 társ-pontot kap.</li></ul>
  <h4>Mezők és pontok</h4><ul><li>REFORMOK – A (2 pont) · BÍRÓSÁG – B (3) · BULÉ – C (3) · PNÜX – D (3) · AGÓRA – E (2) · FORDULÓPONT – F (2)</li><li>F-kártyák hatása: F1, F3 teljes pontnál előre lép 2, illetve 3 mezőt; F2 teljes pontnál +1 bónusz; F4: ha nem teljes a pontszám, vissza 2 mezőt.</li><li>CSERÉPSZAVAZÁS: titkos szavazás; akit egyedül a legtöbb, de legalább 2 szavazattal neveztek meg, egy kört kimarad, pontjai megmaradnak. Két főnél a kocka dönt.</li><li>PARTHENÓN: +1 pont · PIREUSZ, AREIOSZPAGOSZ: pihenő.</li><li>Kártyahatás miatti lépés után az érkezési mezőn nincs feladat.</li></ul>
  <h4>Akropolisz és a játék vége</h4><ul><li>A 30. mezőt elérő bábu az 1. mezőről újraindul; az elsőként célba érő +2 pontot kap.</li><li>A játék fix hosszúságú: normál hosszon 4 fővel 5 kör, 3 fővel 6 kör, 2 fővel 10 kör. Korábban véget ér, ha elfogynak a kártyák, vagy a tanár lezárja a játékot; az elkezdett kört befejezitek.</li><li>Holtversenynél a több ★ (teljes pontos válasz) dönt, utána rájátszáskérdés.</li></ul>
  <div class="actions"><button class="btn primary" id="rClose" type="button">Rendben</button></div></div>`;
  $('#rClose').onclick = () => { ui = null; renderAll(); };
}
function renderZoom(ov) {
  ov.innerHTML = `<div class="modal wide" role="dialog" aria-modal="true" aria-label="Nagyított játéktábla"><h3>Játéktábla</h3><p class="status">Görgetéssel vagy húzással mozgathatod. A bábuk a pillanatnyi állást mutatják.</p><div class="zoomscroll" id="zs"></div><div class="actions"><button class="btn primary" id="zClose" type="button">Bezárás</button></div></div>`;
  const svg = $('#boardsvg').cloneNode(true);
  svg.removeAttribute('id'); svg.removeAttribute('width'); svg.removeAttribute('height');
  svg.querySelectorAll('[id]').forEach(e => e.removeAttribute('id'));
  $('#zs').appendChild(svg);
  $('#zClose').onclick = () => { ui = null; renderAll(); };
}
function askNew() {
  const go = () => { clearSave(); S = null; renderAll(); };
  if (!S) return go();
  ui = { type: 'confirm', title: 'Új játék kezdése', text: 'A jelenlegi játék állása törlődik. Biztosan új játékot kezdtek?', ok: 'Igen, új játék', fn: go };
  renderModal();
}

/* ---------------- fő renderelés ---------------- */
function renderModalInner() {
  const ov = $('#overlay');
  const m = ui || (S && S.modal);
  if (!m || m.hidden) { ov.hidden = true; ov.innerHTML = ''; clearInterval(ticker); return; }
  ov.hidden = false;
  if (m.type === 'card') return renderCard(ov, m);
  clearInterval(ticker);
  if (m.type === 'vote') return renderVote(ov, m);
  if (m.type === 'end') return renderEnd(ov, m);
  if (m.type === 'confirm') return renderConfirm(ov, m);
  if (m.type === 'rules') return renderRules(ov);
  if (m.type === 'zoom') return renderZoom(ov);
}
let _wasOpen = false, _opener = null;
function focusEl(el) { if (el && el.focus) { try { el.focus(); } catch (e) {} } }
function setInert(on) { document.querySelectorAll('header.top, main.layout').forEach(e => { if (on) e.setAttribute('inert', ''); else e.removeAttribute('inert'); }); }
function renderModal() {
  if (!_wasOpen) { const a = document.activeElement; _opener = a && a !== document.body ? { id: a.id || null, el: a } : null; }
  renderModalInner();
  const ov = $('#overlay'); const open = !ov.hidden;
  setInert(open);
  if (open) {
    const dlg = ov.querySelector('.modal');
    if (dlg && !ov.contains(document.activeElement)) { dlg.setAttribute('tabindex', '-1'); focusEl(dlg); }
  } else if (_wasOpen) {
    let t = null;
    if (_opener) t = (document.body.contains(_opener.el) && !_opener.el.disabled && !_opener.el.hidden) ? _opener.el : (_opener.id ? document.getElementById(_opener.id) : null);
    if (!t || t.hidden || t.disabled) t = $('#bRoll:not([disabled])') || $('#bSkip') || $('#bStart') || $('#bRules');
    focusEl(t);
  }
  _wasOpen = open;
}
function ensureFocus() {
  const a = document.activeElement;
  if (a && a !== document.body && document.body.contains(a) && !a.disabled) return;
  if (!$('#overlay').hidden) return;
  focusEl($('#bRoll:not([disabled])') || $('#bSkip') || $('#bGo') || $('#bStart'));
}
function updateRound() {
  const c = $('#clock');
  if (!S || S.phase !== 'play') { c.hidden = true; return; }
  c.hidden = false; c.textContent = `${Math.min(S.rounds, Math.floor(S.turn / S.n) + 1)}. kör / ${S.rounds}`;
}
function renderAll() { renderPanels(); updateRound(); renderModal(); ensureFocus(); }

$('#bRules').onclick = () => { ui = { type: 'rules' }; renderModal(); };
$('#bZoom').onclick = () => { ui = { type: 'zoom' }; renderModal(); };
$('#bNew').onclick = askNew;
$('#bRes').onclick = () => { if (S && S.modal) { S.modal.hidden = false; renderModal(); } };
$('#bEnd').onclick = () => {
  ui = { type: 'confirm', title: 'Játék lezárása', text: 'A tanár jelzi a játékidő végét: az elkezdett kört még befejezitek, utána jön az eredményhirdetés.', ok: 'Lezárás a kör végén',
    fn: () => { setEnding('tanári jelzés'); save(); renderAll(); } };
  renderModal();
};
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && ui && (ui.type === 'rules' || ui.type === 'zoom' || ui.type === 'confirm')) { ui = null; renderAll(); return; }
  if (e.repeat && (e.key === 'Enter' || e.key === ' ') && e.target.closest && e.target.closest('button')) e.preventDefault();
});

function start(data) {
  S = (data && data.S) || load();
  if (S && !validState(S)) { S = null; clearSave(); }
  if (S) S.busy = false;
  try { renderAll(); }
  catch (err) { S = null; ui = null; clearSave(); try { renderAll(); } catch (e2) {} }
}
start({});
